<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ferruccio — La Notte Immobile · Teatro delle Marionette</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  html, body {
    background: #050302;
    color: #f6e7c4;
    font-family: ui-monospace, "Cascadia Mono", "Segoe UI Mono", monospace;
    overflow: hidden;
    width: 100vw;
    height: 100vh;
    margin: 0;
    padding: 0;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  .game-card {
    background: #050302;
    border: none;
    border-radius: 0;
    padding: 0;
    margin: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    width: 100vw;
    height: 100vh;
    max-width: none;
    box-shadow: none;
  }
  .palco-wrap {
    position: relative;
    width: min(98vw, calc(98vh * 16 / 9));
    height: min(98vh, calc(98vw * 9 / 16));
    aspect-ratio: 16 / 9;
    background: #0d0907;
    border: 2px solid #5a3c1e;
    border-radius: 6px;
    overflow: hidden;
    box-shadow: 0 0 40px rgba(0,0,0,0.92);
    outline: none;
  }
  .palco-wrap:focus { border-color: #f7c844; }
  canvas {
    width: 100%;
    height: 100%;
    display: block;
    /* (T5) il buffer è alla risoluzione reale (o appena sopra, scala intera): il browser riduce in modo liscio */
    image-rendering: auto;
    cursor: crosshair;
  }
</style>
</head>
<body>
<div class="game-card">
  <div class="palco-wrap" id="wrap" tabindex="0">
    <canvas id="c" width="640" height="360"></canvas>
  </div>
</div>

<script src="teatro/00-config.js"></script>

<script src="teatro/70-input.js"></script>

<script src="teatro/t2-sprite.js"></script>
<script src="teatro/t3-economia-salvataggi.js"></script>
<!-- --- T4: inizio --- -->
<script src="teatro/t4-hub-storia.js"></script>
<script src="teatro/a1-bombe-chiavi.js"></script>
<script src="teatro/a8-musica.js"></script>
<script src="teatro/a2-consumabili.js"></script>
<script src="teatro/a3-stanze-speciali.js"></script>
<script src="teatro/a6-progressione.js"></script>
<script src="teatro/a7-registro-bilancio.js"></script>
<script src="teatro/b8-finali-diario.js"></script>
<script>
// --- ponte T3/T4: i flag della trama di T4 vivono nello slot di salvataggio di T3 ---
(function () {
  var sv = window.__teatroT3 && window.__teatroT3.salvataggi;
  var T = window.__teatro;
  if (!sv || !T || Object.isFrozen(T)) return;
  // T4 tiene una copia dei flag: al salvataggio si scrivono solo le chiavi che T4 ha cambiato rispetto a
  // quanto aveva letto, così non si sovrascrivono flag scritti nel frattempo da altri (oggettiConosciuti, progressione6).
  var visti = {};
  var j = function (v) { try { return JSON.stringify(v); } catch (e) { return String(v); } };
  T.caricaFlag = function () {
    var d = sv.leggi(sv.slotAttivo); var f = (d && d.flag) ? Object.assign({}, d.flag) : {};
    visti = {}; Object.keys(f).forEach(function (k) { visti[k] = j(f[k]); });
    return f;
  };
  T.salvaFlag = function (flag) {
    Object.keys(flag || {}).forEach(function (k) {
      var v = j(flag[k]); if (visti[k] === v) return;
      visti[k] = v; sv.impostaFlag(k, flag[k]);
    });
  };
})();
</script>
<!-- --- T4: fine --- -->
</body>
</html>
