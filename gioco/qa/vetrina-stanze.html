<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vetrina dei modelli di stanza — piano 1 (QA)</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="../stile/token.css">
  <style>
    /* Strumento di QA della storia 017: i 14 modelli di `contenuti/modelli-stanza/piazza-dante/` disegnati in fil di
       ferro, in griglia, con il filtro in scala di grigi (`?grigi=1` o la casella) per verificare che ogni ostacolo e
       pericolo si legga in sagoma nera. Nessuna grafica definitiva: il renderer vero aspetta l'approvazione dell'autore. */
    html, body { margin: 0; padding: 0; background: var(--bruno); color: var(--crema); font-family: var(--font-testo); }
    :root[data-grigi="1"] body { filter: grayscale(1); }
    header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 16px; padding: 12px 16px 4px; }
    header h1 { font-family: var(--font-titoli); font-size: 20px; margin: 0; font-weight: normal; }
    header label { font-size: 14px; }
    #riepilogo, #errori { padding: 0 16px; font-size: 13px; }
    #errori { color: var(--rosso); white-space: pre-wrap; }
    #legenda { padding: 4px 16px 8px; font-size: 12px; opacity: 0.9; }
    #griglia { display: grid; grid-template-columns: repeat(4, max-content); gap: 10px 12px; padding: 4px 16px 16px; align-items: start; }
    /* la scheda è larga quanto il suo canvas (min-content): il testo lungo va a capo invece di allargare la colonna,
       e il canvas non viene mai stirato (resta 1 px di canvas = 1 px a schermo) */
    .modello { display: flex; flex-direction: column; align-items: flex-start; gap: 3px; width: min-content; }
    .modello.doppia { grid-column: span 2; }
    .modello h2 { font-size: 13px; margin: 0; font-weight: normal; font-family: var(--font-titoli); white-space: nowrap; }
    .modello p { font-size: 11px; margin: 0; opacity: 0.85; }
    .modello canvas { display: block; flex: none; }
  </style>
</head>
<body>
  <header>
    <h1>Vetrina dei modelli di stanza — piano 1 (fil di ferro)</h1>
    <label><input type="checkbox" id="grigi"> scala di grigi</label>
  </header>
  <div id="riepilogo">carico i modelli…</div>
  <div id="errori"></div>
  <div id="legenda"></div>
  <div id="griglia"></div>
  <script type="module">
    import { creaParametri } from '../motore/fondazione/parametri.js';
    import {
      caricaModelli, creaCatalogo, regoleDaParametri, analizzaGriglia, geometriaStanza, vestiboloDi, LEGENDA, TAG_DIFFICOLTA,
    } from '../motore/mondo/modelli.js';

    /** Cartelle e file dei contenuti (nomi, non valori di gioco). */
    const CARTELLA_PARAMETRI = '../contenuti/parametri/';
    const FILE_STATISTICHE = ['stanza', 'stanze'];
    const CARTELLA_MODELLI = '../contenuti/modelli-stanza/piazza-dante/';
    const FILE_INDICE = 'indice';
    /** Lato in pixel di una cella nella vetrina (presentazione, non gioco): `?cella=N` lo cambia. */
    const CELLA_PX_DEFAULT = 20;
    /** Nome del parametro del raggio della fiamma del braciere (stanze.json), scalato sulla cella di gioco. */
    const CHIAVE_R_FIAMMA = 'stanze.braciere.r_fiamma';
    const CHIAVE_CELLA_GIOCO = 'stanza.cella';

    const query = new URL(window.location.href).searchParams;
    const grigi = query.get('grigi') === '1';
    const cellaPx = Number(query.get('cella')) > 0 ? Number(query.get('cella')) : CELLA_PX_DEFAULT;
    const casella = document.getElementById('grigi');
    const applicaGrigi = (attivo) => { document.documentElement.toggleAttribute('data-grigi', false); if (attivo) document.documentElement.setAttribute('data-grigi', '1'); casella.checked = attivo; };
    applicaGrigi(grigi);
    casella.addEventListener('change', () => applicaGrigi(casella.checked));

    /** Legge un token CSS dalla radice del documento. */
    const token = (nome) => getComputedStyle(document.documentElement).getPropertyValue(nome).trim();
    const colori = {
      muro: token('--carta'), pavimento: token('--pavimento'), griglia: token('--bruno'), sagoma: token('--inchiostro'),
      segno: token('--crema'), oro: token('--oro'), contenuto: token('--azzurro'),
    };

    const caricaJson = async (percorso) => {
      const r = await fetch(percorso, { cache: 'no-cache' });
      if (!r.ok) throw new Error(`impossibile caricare ${percorso} (${r.status})`);
      return r.json();
    };

    /**
     * Sagoma piena di un ostacolo, per id della legenda: forme elementari in fil di ferro, tutte d'inchiostro
     * (la grafica vera è del renderer). `x, y` è l'angolo in alto a sinistra della cella, `l` il lato.
     */
    function disegnaOstacolo(ctx, id, x, y, l) {
      const cx = x + l / 2;
      const cy = y + l / 2;
      ctx.fillStyle = colori.sagoma;
      switch (id) {
        case 'colonna':
        case 'colonna_crepata':
          ctx.beginPath(); ctx.arc(cx, cy, l * 0.38, 0, Math.PI * 2); ctx.fill();
          if (id === 'colonna_crepata') {
            ctx.strokeStyle = colori.pavimento; ctx.lineWidth = 1;
            ctx.beginPath(); ctx.moveTo(cx - l * 0.1, cy - l * 0.3); ctx.lineTo(cx + l * 0.05, cy); ctx.lineTo(cx - l * 0.05, cy + l * 0.3); ctx.stroke();
          }
          break;
        case 'panca':
          ctx.fillRect(x + l * 0.05, y + l * 0.3, l * 0.9, l * 0.4);
          break;
        case 'cassa':
          ctx.fillRect(x + l * 0.12, y + l * 0.12, l * 0.76, l * 0.76);
          break;
        case 'grata':
          ctx.fillRect(x + l * 0.08, y + l * 0.2, l * 0.84, l * 0.6);
          ctx.fillStyle = colori.pavimento;
          for (let i = 1; i <= 3; i++) ctx.fillRect(x + l * (0.08 + 0.21 * i) - 1, y + l * 0.25, 2, l * 0.5);
          break;
        case 'siepe':
          ctx.beginPath(); ctx.ellipse(cx, cy, l * 0.45, l * 0.35, 0, 0, Math.PI * 2); ctx.fill();
          break;
        case 'telaio':
          ctx.fillRect(x + l * 0.1, y + l * 0.05, l * 0.8, l * 0.9);
          ctx.fillStyle = colori.pavimento;
          ctx.fillRect(x + l * 0.25, y + l * 0.2, l * 0.5, l * 0.5);
          break;
        case 'banco':
          ctx.fillRect(x + l * 0.03, y + l * 0.2, l * 0.94, l * 0.6);
          break;
        case 'statua_dormiente':
          ctx.beginPath(); ctx.arc(cx, y + l * 0.25, l * 0.17, 0, Math.PI * 2); ctx.fill();
          ctx.fillRect(x + l * 0.25, y + l * 0.42, l * 0.5, l * 0.5);
          break;
        default:
          ctx.fillRect(x + l * 0.1, y + l * 0.1, l * 0.8, l * 0.8);
      }
    }

    /** Sagoma piena di un pericolo (braciere: piede e cerchio tratteggiato della fiamma; siepe spinosa: punte). */
    function disegnaPericolo(ctx, id, x, y, l, rFiammaPx) {
      const cx = x + l / 2;
      const cy = y + l / 2;
      ctx.fillStyle = colori.sagoma;
      ctx.strokeStyle = colori.sagoma;
      if (id === 'braciere') {
        ctx.fillRect(cx - l * 0.25, cy + l * 0.15, l * 0.5, l * 0.2);
        ctx.fillRect(cx - l * 0.06, cy - l * 0.15, l * 0.12, l * 0.35);
        ctx.beginPath(); ctx.ellipse(cx, cy - l * 0.15, l * 0.3, l * 0.14, 0, 0, Math.PI * 2); ctx.fill();
        ctx.lineWidth = 1;
        ctx.setLineDash([3, 3]);
        ctx.beginPath(); ctx.arc(cx, cy, rFiammaPx, 0, Math.PI * 2); ctx.stroke();
        ctx.setLineDash([]);
        return;
      }
      if (id === 'siepe_spinosa') {
        ctx.beginPath(); ctx.ellipse(cx, cy, l * 0.4, l * 0.3, 0, 0, Math.PI * 2); ctx.fill();
        for (let i = 0; i < 6; i++) {
          const a = (i / 6) * Math.PI * 2;
          ctx.beginPath();
          ctx.moveTo(cx + Math.cos(a) * l * 0.3, cy + Math.sin(a) * l * 0.22);
          ctx.lineTo(cx + Math.cos(a) * l * 0.48, cy + Math.sin(a) * l * 0.42);
          ctx.lineTo(cx + Math.cos(a + 0.3) * l * 0.3, cy + Math.sin(a + 0.3) * l * 0.22);
          ctx.fill();
        }
        return;
      }
      ctx.beginPath(); ctx.moveTo(cx, y + l * 0.1); ctx.lineTo(x + l * 0.9, cy); ctx.lineTo(cx, y + l * 0.9); ctx.lineTo(x + l * 0.1, cy); ctx.fill();
    }

    /** Terreno (pozza, rigagnolo): NON è un ostacolo, quindi solo un contorno tratteggiato scuro, mai una sagoma piena. */
    function disegnaTerreno(ctx, id, x, y, l) {
      ctx.strokeStyle = colori.griglia;
      ctx.lineWidth = 1;
      ctx.setLineDash([2, 2]);
      ctx.beginPath();
      if (id === 'rigagnolo') { ctx.moveTo(x, y + l * 0.5); ctx.quadraticCurveTo(x + l * 0.5, y + l * 0.2, x + l, y + l * 0.5); }
      else ctx.ellipse(x + l / 2, y + l / 2, l * 0.4, l * 0.3, 0, 0, Math.PI * 2);
      ctx.stroke();
      ctx.setLineDash([]);
    }

    /**
     * Disegna un modello in fil di ferro su un canvas nuovo: cornice di mura con gli slot delle porte (soglia d'oro),
     * vestiboli tratteggiati, pavimento con la griglia, sagome nere di ostacoli e pericoli, terreni tratteggiati,
     * punti di nascita (croce chiara: T a terra, V in volo) e contenuti (quadrato azzurro con etichetta).
     * @returns {{ canvas: HTMLCanvasElement, cella: (c: number, r: number) => { x: number, y: number } }}
     */
    function disegnaModello(modello, regole, rFiammaPx) {
      const geo = geometriaStanza({ dim: modello.dim, colonne: regole.colonne, righe: regole.righe });
      const l = cellaPx;
      const canvas = document.createElement('canvas');
      canvas.width = (geo.colonne + 2) * l;
      canvas.height = (geo.righe + 2) * l;
      const ctx = canvas.getContext('2d');
      /** Angolo in alto a sinistra della cella (c, r) del modello, con la cornice di una cella. */
      const cella = (c, r) => ({ x: (c + 1) * l, y: (r + 1) * l });

      ctx.fillStyle = colori.muro;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = colori.pavimento;
      ctx.fillRect(l, l, geo.colonne * l, geo.righe * l);
      ctx.strokeStyle = colori.griglia;
      ctx.lineWidth = 1;
      for (let i = 0; i <= geo.colonne; i++) { ctx.beginPath(); ctx.moveTo(l + i * l, l); ctx.lineTo(l + i * l, l + geo.righe * l); ctx.stroke(); }
      for (let j = 0; j <= geo.righe; j++) { ctx.beginPath(); ctx.moveTo(l, l + j * l); ctx.lineTo(l + geo.colonne * l, l + j * l); ctx.stroke(); }

      ctx.font = '9px monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      for (const [nome, slot] of Object.entries(geo.slots)) {
        const p = cella(slot.c, slot.r);
        ctx.fillStyle = colori.pavimento;
        ctx.fillRect(p.x, p.y, l, l);
        ctx.strokeStyle = colori.oro;
        ctx.lineWidth = 2;
        ctx.beginPath();
        if (slot.lato === 'N') { ctx.moveTo(p.x, p.y + l); ctx.lineTo(p.x + l, p.y + l); }
        else if (slot.lato === 'S') { ctx.moveTo(p.x, p.y); ctx.lineTo(p.x + l, p.y); }
        else if (slot.lato === 'W') { ctx.moveTo(p.x + l, p.y); ctx.lineTo(p.x + l, p.y + l); }
        else { ctx.moveTo(p.x, p.y); ctx.lineTo(p.x, p.y + l); }
        ctx.stroke();
        ctx.fillStyle = colori.segno;
        ctx.fillText(nome, p.x + l / 2, p.y + l / 2);
        ctx.strokeStyle = colori.muro;
        ctx.lineWidth = 1;
        ctx.setLineDash([2, 2]);
        for (const v of vestiboloDi(slot, regole.vestiboloCelle)) {
          const q = cella(v.c, v.r);
          ctx.strokeRect(q.x + 1.5, q.y + 1.5, l - 3, l - 3);
        }
        ctx.setLineDash([]);
      }

      const analisi = analizzaGriglia(modello);
      for (const t of analisi.terreni) { const p = cella(t.c, t.r); disegnaTerreno(ctx, t.id, p.x, p.y, l); }
      for (const o of analisi.ostacoli) { const p = cella(o.c, o.r); disegnaOstacolo(ctx, o.id, p.x, p.y, l); }
      for (const h of analisi.pericoli) { const p = cella(h.c, h.r); disegnaPericolo(ctx, h.id, p.x, p.y, l, rFiammaPx); }

      ctx.strokeStyle = colori.segno;
      ctx.lineWidth = 1;
      for (const s of modello.spawn ?? []) {
        const p = cella(s.c, s.r);
        const cx = p.x + l / 2;
        const cy = p.y + l / 2;
        ctx.beginPath();
        if (s.tipo === 'V') { ctx.moveTo(cx, cy - l * 0.22); ctx.lineTo(cx + l * 0.22, cy + l * 0.16); ctx.lineTo(cx - l * 0.22, cy + l * 0.16); ctx.closePath(); }
        else { ctx.moveTo(cx - l * 0.2, cy); ctx.lineTo(cx + l * 0.2, cy); ctx.moveTo(cx, cy - l * 0.2); ctx.lineTo(cx, cy + l * 0.2); }
        ctx.stroke();
      }
      ctx.strokeStyle = colori.contenuto;
      ctx.lineWidth = 2;
      ctx.textBaseline = 'bottom';
      for (const k of analisi.contenuti) {
        const p = cella(k.c, k.r);
        ctx.strokeRect(p.x + l * 0.25, p.y + l * 0.25, l * 0.5, l * 0.5);
        ctx.fillStyle = colori.segno;
        ctx.fillText(k.tipo, p.x + l / 2, p.y + l * 0.2);
      }
      return { canvas, cella, analisi };
    }

    async function avvia() {
      const parametri = creaParametri();
      await parametri.carica({ caricatore: (nome) => caricaJson(`${CARTELLA_PARAMETRI}${nome}.json`), statistiche: FILE_STATISTICHE, tabelle: [] });
      const regole = regoleDaParametri(parametri);
      const rFiammaPx = (parametri.get(CHIAVE_R_FIAMMA) / parametri.get(CHIAVE_CELLA_GIOCO)) * cellaPx;
      const indice = await caricaJson(`${CARTELLA_MODELLI}${FILE_INDICE}.json`);
      const { modelli, errori } = await caricaModelli({ caricatore: (nome) => caricaJson(`${CARTELLA_MODELLI}${nome}.json`), indice, regole });
      const catalogo = creaCatalogo(modelli);

      const griglia = document.getElementById('griglia');
      const schede = [];
      for (const m of modelli) {
        const { canvas, cella, analisi } = disegnaModello(m, regole, rFiammaPx);
        const scheda = document.createElement('section');
        scheda.className = `modello${m.dim === '2x1' ? ' doppia' : ''}`;
        scheda.dataset.id = m.id;
        const h = document.createElement('h2');
        h.textContent = `${m.id} — ${m.tipo} ${m.dim}`;
        const p = document.createElement('p');
        p.textContent = `difficoltà ${m.difficolta} (${TAG_DIFFICOLTA[m.difficolta]}) · ${m.tag.join(', ')}${m.scena_id ? ` · ${m.scena_id}` : ''}`;
        scheda.append(h, p, canvas);
        griglia.append(scheda);
        schede.push({ id: m.id, tipo: m.tipo, dim: m.dim, difficolta: m.difficolta, tag: m.tag, canvas, cella, analisi, griglia: m.griglia });
      }
      document.getElementById('errori').textContent = errori.join('\n');
      const conteggi = catalogo.conteggi();
      document.getElementById('riepilogo').textContent = `${modelli.length} modelli dall'indice (${indice.modelli.length} elencati) · ${Object.entries(conteggi).map(([k, v]) => `${k}: ${v}`).join(' · ')} · cella ${cellaPx} px`;
      document.getElementById('legenda').textContent = `Legenda: ${Object.entries(LEGENDA).filter(([, v]) => v.genere !== 'pavimento').map(([s, v]) => `${s} = ${v.id} (${v.genere})`).join(' · ')} · + T / △ V = punti di nascita · soglia d'oro = slot porta · tratteggio = vestibolo · azzurro = contenuto`;

      /** Superficie di QA della vetrina (letta dal test Playwright). */
      window.__vetrina = Object.freeze({
        pronta: true,
        grigi: () => document.documentElement.getAttribute('data-grigi') === '1',
        errori,
        conteggi,
        modelli: schede.map((s) => ({
          id: s.id, tipo: s.tipo, dim: s.dim, difficolta: s.difficolta, tag: s.tag, griglia: s.griglia,
          ostacoli: s.analisi.ostacoli.map((o) => ({ c: o.c, r: o.r, id: o.id })),
          pericoli: s.analisi.pericoli.map((h) => ({ c: h.c, r: h.r, id: h.id })),
        })),
        /** Luminanza (0-255, pesi Rec. 709) del pixel della cella (c, r) del modello `id` in (fx, fy) ∈ [0,1]² (centro se omessi). */
        luminanza: (id, c, r, fx = 0.5, fy = 0.5) => {
          const s = schede.find((x) => x.id === id);
          if (!s) return null;
          const p = s.cella(c, r);
          const d = s.canvas.getContext('2d').getImageData(Math.round(p.x + cellaPx * fx), Math.round(p.y + cellaPx * fy), 1, 1).data;
          return 0.2126 * d[0] + 0.7152 * d[1] + 0.0722 * d[2];
        },
      });
    }

    avvia().catch((e) => {
      console.error('[vetrina] la vetrina non è partita:', e);
      document.getElementById('errori').textContent = String(e);
    });
  </script>
</body>
</html>
