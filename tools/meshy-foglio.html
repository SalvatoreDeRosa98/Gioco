<script type="module">
import * as THREE from 'three';

/** Rende i fotogrammi di un GLB animato: cella LxA, vista dal davanti-alto, figura girata di `giro` gradi. */
window.rendi = async function (o) {

  const anca0 = new THREE.Vector3(); mixer.setTime(0); modello.position.set(0, 0, 0); modello.updateMatrixWorld(true); if (anca) anca.getWorldPosition(anca0);
