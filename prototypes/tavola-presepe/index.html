<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Ferruccio — Teatro delle Marionette d'Ombra (Variante C + Donna Luciana)</title>
<style>
  :root {
    --bg: #070402;
    --gold: #f3c14b;
    --cream: #f4e3bd;
    --ink: #0b0704;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--cream);
    font-family: Georgia, "Times New Roman", serif;
    overflow: hidden;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .stage-wrap {
    position: relative;
    width: min(100vw, calc((100vh - 46px) * 16 / 9));
    aspect-ratio: 16 / 9;
    box-shadow: 0 20px 60px rgba(0,0,0,.85);
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    background: #050302;
  }
  canvas.grigi { filter: grayscale(1); }
  .toolbar {
    height: 46px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 0 16px;
    background: rgba(14, 8, 4, 0.95);
    border-top: 1px solid rgba(243, 193, 75, 0.3);
    width: 100%;
    font-size: 13px;
    letter-spacing: 0.08em;
  }
  .btn {
    background: rgba(243, 193, 75, 0.08);
    color: var(--cream);
    border: 1px solid rgba(243, 193, 75, 0.45);
    padding: 5px 14px;
    border-radius: 3px;
    cursor: pointer;
    font-family: inherit;
    font-size: 12px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    transition: all 0.15s ease;
  }
  .btn:hover {
    background: rgba(243, 193, 75, 0.2);
    border-color: var(--gold);
  }
  .btn.active {
    background: rgba(243, 193, 75, 0.28);
    border-color: var(--gold);
    color: #fff;
    box-shadow: 0 0 12px rgba(243, 193, 75, 0.3);
  }
  .sep {
    width: 1px;
    height: 20px;
    background: rgba(243, 193, 75, 0.25);
    margin: 0 4px;
  }
</style>
</head>
<body>
<div class="stage-wrap">
  <canvas id="c" width="1280" height="720"></canvas>
</div>
<div class="toolbar">
  <button class="btn active" id="btn-stanza" onclick="setScena('stanza')">1. Stanza (Variante C + Mani di Marionetta)</button>
  <button class="btn" id="btn-transizione" onclick="setScena('transizione')">2. Discesa delle Mani</button>
  <button class="btn" id="btn-boss" onclick="setScena('boss')">3. Boss Finale: Donna Luciana</button>
  <div class="sep"></div>
  <button class="btn active" id="btn-anim" onclick="toggleAnim()">Animazione: ON</button>
  <button class="btn" id="btn-grigi" onclick="toggleGrigi()">Scala di Grigi</button>
</div>

<script>
'use strict';
/* =====================================================================
   TEATRO DELLE MARIONETTE D'OMBRA — Variante C approvata e ridisegnata.
   - Boccascena barocco napoletano con quinte drappeggiate e luci di ribalta
   - Mani giganti di marionettista (Donna Luciana) con bilancini in legno e
     fili d'oro che reggono e muovono i personaggi/nemici dall'alto
   - Modalità Boss Finale (?scena=boss): le mani scendono nel palco e si
     rivelano come Donna Luciana, signora del Velo
   - Disegni rifatti da zero: Ferruccio (burattino articolato con giunti in
     ottone, maschera scolpita, coppolone, sciarpa doppia, stocco), Gatti
     d'ombra (anatomia felina predatoria, artigli, pelo, occhi a fessura),
     colpo marcato alla Isaac (flash, squash, schizzi, onda d'urto, scia).
   ===================================================================== */
const W = 1280, H = 720;
const Q = new URLSearchParams(location.search);
const VAR = (Q.get('variante') || 'C').toUpperCase();
let SCENA = Q.get('scena') || 'stanza'; // 'stanza' | 'transizione' | 'boss'
const cv = document.getElementById('c');
if (Q.get('grigi')) cv.classList.add('grigi');
const DPR = Q.get('dpr') ? +Q.get('dpr') : Math.min(2, window.devicePixelRatio || 1);
cv.width = W * DPR; cv.height = H * DPR;
const ctx = cv.getContext('2d', { alpha: false });

const P = {
  ink: '#0b0704', inkMid: '#180d06', bruno: '#5a2a0e', brunoChiaro: '#7d3e18',
  carta: '#c98a3c', luce: '#f2c278', pav: '#9a6428', crema: '#f4e3bd',
  bianco: '#fff8e8', oro: '#f3c14b', oroDim: '#b88b32', rosso: '#c8301b',
  rossoDeep: '#8f1d14', azzurro: '#7fd3ff', legno: '#241207', legnoLuce: '#4a2610',
  sipario: '#380d09', siparioOmbra: '#1a0503'
};

const VARIANTI = {
  A: { nome: 'A — calda e teatrale', esp: 1.00, wallTop: 118, pool: .75, alone: .70, vign: .72, vignIn: .62, ombra: .34, grana: .08, quinte: true, scalaFondale: 1.12 },
  B: { nome: 'B — scura e contrastata', esp: 0.88, wallTop: 118, pool: .95, alone: .88, vign: .88, vignIn: .54, ombra: .46, grana: .12, quinte: true, scalaFondale: 1.12 },
  C: { nome: 'C — Teatro di Marionette (Variante C)', esp: 0.98, wallTop: 132, pool: .78, alone: .72, vign: .68, vignIn: .64, ombra: .35, grana: .08, quinte: true, scalaFondale: 1.22 }
};
const V = VARIANTI[VAR] || VARIANTI.C;

/* Geometria ampliata e ben proporzionata: il palco riempie armoniosamente la scena */
const G = { fx: 148, fy: 168, fw: 984, fh: 472, cella: 64, wallW: 32, southH: 42 };
G.fr = G.fx + G.fw; G.fb = G.fy + G.fh;
const wallTop = V.wallTop;
const LANTERNE = [{ x: 350, y: 174 }, { x: 930, y: 174 }];
const PORTA_N = { x: 640, w: 86, h: 66 };

function rng(seed) {
  let t = seed >>> 0;
  return function () {
    t = (t + 0x6D2B79F5) >>> 0;
    let r = Math.imul(t ^ (t >>> 15), 1 | t);
    r = (r + Math.imul(r ^ (r >>> 7), 61 | r)) ^ r;
    return ((r ^ (r >>> 14)) >>> 0) / 4294967296;
  };
}
function hex(h) { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
function rgba(c, a) { const [r, g, b] = typeof c === 'string' ? hex(c) : c; return `rgba(${r | 0},${g | 0},${b | 0},${a == null ? 1 : a})`; }
function mix(c1, c2, t) { const a = typeof c1 === 'string' ? hex(c1) : c1, b = typeof c2 === 'string' ? hex(c2) : c2; return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t]; }
function esp(c, k) { const a = typeof c === 'string' ? hex(c) : c; return [Math.min(255, a[0] * k), Math.min(255, a[1] * k), Math.min(255, a[2] * k)]; }
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const TAU = Math.PI * 2;
function lum(r, g, b) { const f = c => { c /= 255; return c <= .04045 ? c / 12.92 : Math.pow((c + .055) / 1.055, 2.4); }; return .2126 * f(r) + .7152 * f(g) + .0722 * f(b); }

function nuovoCanvas(w, h) {
  const c = document.createElement('canvas');
  c.width = Math.round(w * DPR);
  c.height = Math.round(h * DPR);
  const x = c.getContext('2d');
  x.scale(DPR, DPR);
  return [c, x];
}

function rumore(w, h, seed, ott) {
  const out = new Float32Array(w * h), r = rng(seed);
  for (const o of ott) {
    const cx = o.cx, cy = o.cy || o.cx, amp = o.amp;
    const gw = Math.ceil(w / cx) + 2, gh = Math.ceil(h / cy) + 2;
    const g = new Float32Array(gw * gh);
    for (let i = 0; i < g.length; i++) g[i] = r() * 2 - 1;
    for (let y = 0; y < h; y++) {
      const fy = y / cy, y0 = fy | 0, ty = fy - y0, sy = ty * ty * (3 - 2 * ty);
      for (let x = 0; x < w; x++) {
        const fx = x / cx, x0 = fx | 0, tx = fx - x0, sx = tx * tx * (3 - 2 * tx);
        const i = y0 * gw + x0;
        const top = g[i] + (g[i + 1] - g[i]) * sx;
        const bot = g[i + gw] + (g[i + gw + 1] - g[i + gw]) * sx;
        out[y * w + x] += amp * (top + (bot - top) * sy);
      }
    }
  }
  return out;
}

/* =====================================================================
   PRECALCOLO 1 — Pavimento del Palco (Basolato caldo + tavole da palcoscenico)
   ===================================================================== */
function creaCartaPavimento() {
  const w = G.fw, h = G.fh;
  const [c, x] = nuovoCanvas(w, h);
  const cen = esp(mix(P.pav, P.carta, .32), V.esp);
  const med = esp(P.pav, V.esp);
  const bordo = esp(mix(P.pav, P.bruno, .38), V.esp);
  const g = x.createRadialGradient(w * .5, h * .45, 20, w * .5, h * .5, w * .65);
  g.addColorStop(0, rgba(cen));
  g.addColorStop(.58, rgba(med));
  g.addColorStop(1, rgba(bordo));
  x.fillStyle = g;
  x.fillRect(0, 0, w, h);

  // Grana e fibre della carta
  const pw = Math.round(w * DPR), ph = Math.round(h * DPR);
  const id = x.getImageData(0, 0, pw, ph), d = id.data;
  const n1 = rumore(pw, ph, 11, [{ cx: 180 * DPR, amp: .45 }, { cx: 75 * DPR, amp: .3 }]);
  const n2 = rumore(pw, ph, 23, [{ cx: 65 * DPR, cy: 2.2 * DPR, amp: .55 }]);
  const rr_ = rng(37);
  for (let i = 0, p = 0; i < pw * ph; i++, p += 4) {
    const m = 1 + .08 * n1[i] + .06 * n2[i] + (rr_() * 2 - 1) * .04;
    d[p] = clamp(d[p] * m, 0, 255);
    d[p + 1] = clamp(d[p + 1] * m, 0, 255);
    d[p + 2] = clamp(d[p + 2] * m, 0, 255);
  }
  x.putImageData(id, 0, 0);

  // Fuga prospettica del basolato teatrale (lastre convergenti verso la Reggia)
  x.save();
  x.strokeStyle = 'rgba(40,18,6,0.16)';
  x.lineWidth = 1.2;
  for (let row = 0; row <= 7; row++) {
    const t = row / 7;
    const py = Math.pow(t, 1.12) * h;
    x.beginPath();
    x.moveTo(0, py);
    x.lineTo(w, py);
    x.stroke();
    if (row < 7) {
      const nextY = Math.pow((row + 1) / 7, 1.12) * h;
      const cols = 13;
      const offset = (row % 2) * 0.5;
      for (let col = 0; col <= cols; col++) {
        const u = (col + offset) / cols;
        const xTop = w * 0.5 + (u - 0.5) * w * (0.86 + 0.14 * t);
        const xBot = w * 0.5 + (u - 0.5) * w * (0.86 + 0.14 * ((row + 1) / 7));
        x.beginPath();
        x.moveTo(xTop, py);
        x.lineTo(xBot, nextY);
        x.stroke();
      }
    }
  }
  // Rosone barocco centrale inciso nel pavimento della piazza
  x.translate(w / 2, h * 0.52);
  x.scale(1, 0.58);
  x.strokeStyle = 'rgba(242,194,120,0.13)';
  x.lineWidth = 2;
  x.beginPath(); x.arc(0, 0, 145, 0, TAU); x.stroke();
  x.beginPath(); x.arc(0, 0, 136, 0, TAU); x.stroke();
  x.strokeStyle = 'rgba(58,26,10,0.18)';
  for (let i = 0; i < 8; i++) {
    const a = (i / 8) * TAU;
    x.beginPath();
    x.moveTo(Math.cos(a) * 28, Math.sin(a) * 28);
    x.lineTo(Math.cos(a) * 136, Math.sin(a) * 136);
    x.stroke();
  }
  x.restore();

  // Occlusione ambientale morbida lungo i muri
  const ao = (x0, y0, x1, y1, a) => {
    const gg = x.createLinearGradient(x0, y0, x1, y1);
    gg.addColorStop(0, rgba(P.ink, a));
    gg.addColorStop(1, rgba(P.ink, 0));
    x.fillStyle = gg;
    x.fillRect(0, 0, w, h);
  };
  ao(0, 0, 0, 85, .36);
  ao(0, h, 0, h - 50, .28);
  ao(0, 0, 64, 0, .32);
  ao(w, 0, w - 64, 0, .32);
  return c;
}

/* =====================================================================
   PRECALCOLO 2 — Fondale Teatrale (Piazza Dante, Palazzi, Reggia, Luna)
   ===================================================================== */
function creaFondale() {
  const FH = 380;
  const [c, x] = nuovoCanvas(W, FH);
  const yG = wallTop + 42;

  // Cielo notturno ambrato retroilluminato
  const sky = x.createLinearGradient(0, 0, 0, yG);
  sky.addColorStop(0, '#120703');
  sky.addColorStop(.28, '#2d1307');
  sky.addColorStop(.58, '#6e3412');
  sky.addColorStop(.82, '#b86825');
  sky.addColorStop(1, '#e09e46');
  x.fillStyle = sky;
  x.fillRect(0, 0, W, yG);

  // Grande bagliore all'orizzonte dietro la Reggia di Caserta
  const hot = x.createRadialGradient(640, yG - 48, 10, 640, yG - 48, 420);
  hot.addColorStop(0, 'rgba(255,232,175,0.72)');
  hot.addColorStop(0.45, 'rgba(243,193,75,0.28)');
  hot.addColorStop(1, 'rgba(243,193,75,0)');
  x.fillStyle = hot;
  x.fillRect(0, 0, W, yG);

  // Luna piena in crema con crateri
  const mx = 370, my = 56, mr = 28;
  const halo = x.createRadialGradient(mx, my, 4, mx, my, mr * 3.8);
  halo.addColorStop(0, 'rgba(255,246,220,0.85)');
  halo.addColorStop(0.35, 'rgba(255,230,175,0.28)');
  halo.addColorStop(1, 'rgba(255,230,175,0)');
  x.fillStyle = halo;
  x.beginPath(); x.arc(mx, my, mr * 3.8, 0, TAU); x.fill();
  x.fillStyle = '#fff5d8';
  x.beginPath(); x.arc(mx, my, mr, 0, TAU); x.fill();
  x.fillStyle = 'rgba(218,190,138,0.38)';
  x.beginPath(); x.arc(mx - 8, my - 6, 5, 0, TAU); x.arc(mx + 9, my + 6, 6.5, 0, TAU); x.arc(mx - 3, my + 10, 3.2, 0, TAU); x.fill();

  // Colline Tifatine e Reggia di Caserta in lontananza
  x.save();
  x.fillStyle = 'rgba(62,28,11,0.78)';
  x.beginPath();
  x.moveTo(180, yG);
  x.bezierCurveTo(340, yG - 85, 510, yG - 102, 640, yG - 90);
  x.bezierCurveTo(790, yG - 104, 940, yG - 82, 1100, yG);
  x.closePath();
  x.fill();

  // Silhouette monumentale della Reggia vanvitelliana
  const rx = 640, ry = yG;
  x.fillStyle = '#240f05';
  x.fillRect(rx - 150, ry - 74, 300, 74);
  x.fillRect(rx - 156, ry - 78, 312, 5);
  // Timpano centrale e cupola
  x.fillRect(rx - 38, ry - 92, 76, 18);
  x.beginPath();
  x.moveTo(rx - 44, ry - 92);
  x.lineTo(rx, ry - 112);
  x.lineTo(rx + 44, ry - 92);
  x.closePath();
  x.fill();
  // Torrette laterali
  x.fillRect(rx - 150, ry - 86, 24, 10);
  x.fillRect(rx + 126, ry - 86, 24, 10);
  // Finestre accese della Reggia
  x.fillStyle = 'rgba(255,214,128,0.78)';
  for (let wx = -136; wx <= 136; wx += 14) {
    if (Math.abs(wx) < 12) continue;
    x.fillRect(rx + wx - 2, ry - 64, 4, 8);
    x.fillRect(rx + wx - 2, ry - 46, 4, 8);
  }
  // Grande portale centrale della Reggia
  x.beginPath();
  x.arc(rx, ry - 18, 9, Math.PI, 0);
  x.lineTo(rx + 9, ry);
  x.lineTo(rx - 9, ry);
  x.closePath();
  x.fill();
  x.restore();

  // Palazzi neoclassici ai lati con portici e abitanti addormentati alle finestre
  const palazzi = [{ x0: 40, x1: 445 }, { x0: 835, x1: 1240 }];
  const finestre = [];
  for (const f of palazzi) {
    x.fillStyle = '#150a04';
    x.fillRect(f.x0, yG - 158, f.x1 - f.x0, 165);
    x.fillRect(f.x0 - 5, yG - 163, f.x1 - f.x0 + 10, 7);
    x.fillStyle = 'rgba(242,194,120,0.35)';
    x.fillRect(f.x0 - 5, yG - 156, f.x1 - f.x0 + 10, 1.3);

    // Finestre ad arco con dormienti
    const nWin = 4;
    const step = (f.x1 - f.x0 - 60) / (nWin - 1);
    for (let i = 0; i < nWin; i++) {
      const wx = f.x0 + 30 + i * step;
      const wy = yG - 122;
      finestre.push({ x: wx, y: wy, tipo: (i + (f.x0 > 500 ? 1 : 0)) % 3 });
      // Alone finestra
      const wg = x.createRadialGradient(wx, wy + 16, 2, wx, wy + 16, 36);
      wg.addColorStop(0, 'rgba(255,190,82,0.42)');
      wg.addColorStop(1, 'rgba(255,190,82,0)');
      x.fillStyle = wg;
      x.beginPath(); x.arc(wx, wy + 16, 36, 0, TAU); x.fill();

      // Vano illuminato
      const lg = x.createLinearGradient(0, wy, 0, wy + 38);
      lg.addColorStop(0, '#ffe8aa');
      lg.addColorStop(1, '#eb9b34');
      x.fillStyle = lg;
      x.beginPath();
      x.arc(wx, wy + 12, 12, Math.PI, 0);
      x.lineTo(wx + 12, wy + 38);
      x.lineTo(wx - 12, wy + 38);
      x.closePath();
      x.fill();

      // Sagoma dell'abitante incantato col sorriso sottile
      x.fillStyle = P.ink;
      x.beginPath();
      x.moveTo(wx - 9, wy + 38);
      x.bezierCurveTo(wx - 8, wy + 27, wx - 4, wy + 24, wx, wy + 24);
      x.bezierCurveTo(wx + 4, wy + 24, wx + 8, wy + 27, wx + 9, wy + 38);
      x.fill();
      x.beginPath();
      x.arc(wx, wy + 17, 4.8, 0, TAU);
      x.fill();
      x.strokeStyle = '#f6c76a';
      x.lineWidth = 0.9;
      x.beginPath();
      x.arc(wx, wy + 17.5, 2.2, 0.15 * Math.PI, 0.85 * Math.PI);
      x.stroke();
      // Ringhierina
      x.fillStyle = P.ink;
      x.fillRect(wx - 13, wy + 29, 26, 1.4);
    }
  }

  // Fili d'oro del Velo che collegano le finestre alla Reggia
  for (const w of finestre) {
    const cx = (w.x + 640) * 0.5;
    const cy = Math.max(w.y, yG - 68) + 22;
    x.strokeStyle = 'rgba(243,193,75,0.22)';
    x.lineWidth = 4.5;
    x.beginPath(); x.moveTo(w.x, w.y + 16); x.quadraticCurveTo(cx, cy, 640, yG - 68); x.stroke();
    x.strokeStyle = 'rgba(255,232,168,0.85)';
    x.lineWidth = 1.1;
    x.beginPath(); x.moveTo(w.x, w.y + 16); x.quadraticCurveTo(cx, cy, 640, yG - 68); x.stroke();
  }
  return c;
}

let CARTA = creaCartaPavimento();
let FONDALE = creaFondale();

/* =====================================================================
   DISEGNO 1 — FERRUCCIO (Burattino articolato in crema, maschera, stocco)
   ===================================================================== */
function disegnaFerruccio(x, modo, tAnim) {
  const ink = modo === 'ombra';
  const C = c => ink ? P.ink : c;
  const bob = Math.sin(tAnim * 2.6) * 2.2;
  const scarfWave = Math.sin(tAnim * 4.2) * 5;

  x.save();
  x.translate(0, bob);
  x.lineCap = 'round';
  x.lineJoin = 'round';

  const outlineFill = (pathFn, fillStyle, lw = 3.4) => {
    x.beginPath();
    pathFn();
    if (ink) {
      x.fillStyle = P.ink;
      x.strokeStyle = P.ink;
      x.lineWidth = lw;
      x.stroke();
      x.fill();
    } else {
      x.strokeStyle = P.ink;
      x.lineWidth = lw;
      x.stroke();
      x.fillStyle = fillStyle;
      x.fill();
    }
  };

  // 1. Asta metallica da burattino (dietro la schiena) e fili spezzati
  if (!ink) {
    x.strokeStyle = 'rgba(175,148,108,0.65)';
    x.lineWidth = 2.2;
    x.beginPath();
    x.moveTo(-8, -110);
    x.lineTo(-22, -260);
    x.stroke();
    // Fili d'oro spezzati che pendono (Ferruccio è libero dal Velo!)
    x.strokeStyle = 'rgba(243,193,75,0.75)';
    x.lineWidth = 1.3;
    x.beginPath();
    x.moveTo(6, -182);
    x.bezierCurveTo(12, -210, -4, -225, 8, -242);
    x.stroke();
  }

  // 2. Code della sciarpa rossa (2 lembi dinamici con frange)
  outlineFill(() => {
    x.moveTo(-10, -116);
    x.bezierCurveTo(-36, -122, -62, -104 + scarfWave * 0.6, -92, -114 + scarfWave);
    x.lineTo(-89, -101 + scarfWave);
    x.bezierCurveTo(-60, -92 + scarfWave * 0.5, -34, -106, -8, -104);
    x.closePath();
  }, C(P.rossoDeep), 3.0);

  outlineFill(() => {
    x.moveTo(-6, -112);
    x.bezierCurveTo(-32, -110, -56, -90 - scarfWave * 0.5, -84, -95 - scarfWave * 0.8);
    x.lineTo(-80, -83 - scarfWave * 0.8);
    x.bezierCurveTo(-52, -78 - scarfWave * 0.4, -28, -96, -4, -100);
    x.closePath();
  }, C(P.rosso), 3.0);

  // Frange dorate/rosse sulla punta della sciarpa
  if (!ink) {
    x.strokeStyle = P.rosso;
    x.lineWidth = 1.8;
    for (let i = -2; i <= 2; i++) {
      x.beginPath();
      x.moveTo(-90, -107 + scarfWave + i * 2.5);
      x.lineTo(-100, -109 + scarfWave + i * 3.2);
      x.stroke();
    }
  }

  // 3. Gambe larghe da Pulcinella con snodi a vista e scarpette nere
  // Gamba sinistra (dietro)
  outlineFill(() => {
    x.moveTo(-18, -54);
    x.quadraticCurveTo(-24, -28, -19, -6);
    x.lineTo(-5, -6);
    x.quadraticCurveTo(-6, -28, -4, -54);
    x.closePath();
  }, C('#dfd0b0'), 3.2);

  // Gamba destra (avanti, piegata in guardia)
  outlineFill(() => {
    x.moveTo(4, -54);
    x.quadraticCurveTo(18, -28, 22, -6);
    x.lineTo(8, -6);
    x.quadraticCurveTo(4, -26, -2, -54);

  }, C(P.crema), 3.2);

  // Scarpette da maschera con punta all'insù
  x.fillStyle = P.ink;
  x.beginPath();
  x.moveTo(-24, -6); x.quadraticCurveTo(-28, 2, -6, 1); x.lineTo(-4, -7); x.closePath();
  x.moveTo(6, -6); x.quadraticCurveTo(22, -8, 32, -2); x.quadraticCurveTo(24, 4, 6, 1); x.closePath();
  x.fill();

  // 4. Braccio sinistro arretrato (bilanciamento da schermidore)
  outlineFill(() => {
    x.moveTo(-16, -108);
    x.quadraticCurveTo(-36, -94, -44, -74);
    x.lineTo(-33, -68);
    x.quadraticCurveTo(-24, -84, -8, -96);

  // 5. Camicione ampio da Pulcinella con pieghe d'inchiostro e cintura
  const camGrad = !ink ? (() => {

    g.addColorStop(0, P.bianco);
    g.addColorStop(1, '#e2ce9f');
    return g;
  })() : P.ink;

  outlineFill(() => {
    x.moveTo(-22, -110);
    x.bezierCurveTo(-8, -118, 16, -118, 26, -108);
    x.bezierCurveTo(34, -86, 40, -64, 42, -46);
    x.quadraticCurveTo(4, -36, -38, -46);
    x.bezierCurveTo(-36, -68, -30, -88, -22, -110);

  }, camGrad, 3.6);

  if (!ink) {
    // Pieghe del camicione
    x.strokeStyle = 'rgba(11,7,4,0.38)';
    x.lineWidth = 1.4;
    for (const [x0, y0, x1, y1] of [[-14, -68, -20, -45], [0, -66, 0, -42], [14, -68, 20, -45]]) {
      x.beginPath(); x.moveTo(x0, y0); x.lineTo(x1, y1); x.stroke();
    }
    // Cintura nera con fibbia d'ottone
    x.fillStyle = P.ink;
    x.beginPath();
    x.moveTo(-33, -76); x.quadraticCurveTo(2, -68, 35, -76);
    x.lineTo(37, -65); x.quadraticCurveTo(2, -57, -35, -65);
    x.closePath();
    x.fill();
    x.fillStyle = P.oro;
    x.strokeStyle = P.ink;
    x.lineWidth = 1.4;
    x.fillRect(-5, -75, 11, 12);
    x.strokeRect(-5, -75, 11, 12);

  // 6. Nodo della sciarpa rossa al collo
  outlineFill(() => {
    x.moveTo(-18, -115);
    x.quadraticCurveTo(2, -123, 20, -114);
    x.quadraticCurveTo(18, -102, 2, -101);
    x.quadraticCurveTo(-18, -102, -18, -115);
    x.closePath();
  }, C(P.rosso), 3.0);

  // 7. Testa, Maschera nera scolpita col becco adunco e Coppolone ricurvo
  outlineFill(() => {
    x.arc(4, -138, 21, 0, TAU);
  }, C(P.crema), 3.4);

  // Maschera lupina / Pulcinella con naso adunco e sopracciglio fiero
  x.fillStyle = P.ink;
  x.beginPath();
  x.moveTo(-16, -144);
  x.bezierCurveTo(-10, -160, 20, -160, 25, -142);
  x.bezierCurveTo(36, -139, 49, -130, 52, -121);
  x.bezierCurveTo(48, -116, 36, -119, 26, -123);
  x.bezierCurveTo(20, -116, 6, -116, -4, -122);
  x.bezierCurveTo(-12, -126, -16, -134, -16, -144);
  x.closePath();
  x.fill();

  if (!ink) {
    // Occhio luminoso nella maschera
    x.fillStyle = '#fff4c2';
    x.beginPath();
    x.ellipse(14, -139, 3.6, 2.5, -0.15, 0, TAU);
    x.fill();
    // Filo di luce sul profilo del becco
    x.strokeStyle = 'rgba(242,194,120,0.45)';
    x.lineWidth = 1.2;
    x.beginPath();
    x.moveTo(22, -142);
    x.quadraticCurveTo(38, -136, 50, -122);
    x.stroke();

  // Coppolone tradizionale alto con punta ripiegata all'indietro
  outlineFill(() => {
    x.moveTo(-19, -150);
    x.lineTo(26, -150);
    x.bezierCurveTo(24, -174, 14, -196, -2, -206);
    x.bezierCurveTo(-14, -214, -32, -212, -38, -198);
    x.bezierCurveTo(-30, -196, -22, -186, -20, -170);
    x.closePath();

  // Risvolto del coppolone
  outlineFill(() => {
    x.moveTo(-24, -150);
    x.quadraticCurveTo(4, -158, 30, -150);
    x.quadraticCurveTo(30, -141, 4, -143);
    x.quadraticCurveTo(-24, -141, -24, -150);
    x.closePath();
  }, C(P.bianco), 3.0);

  // 8. Braccio destro armato e Stocco napoletano (con guardia a coccia e lama lucente)
  outlineFill(() => {
    x.moveTo(14, -104);
    x.lineTo(30, -98);
    x.lineTo(56, -72);
    x.lineTo(46, -62);
    x.lineTo(16, -88);
    x.closePath();
  }, C(P.crema), 3.2);

  // Lama dello stocco
  x.strokeStyle = P.ink;
  x.lineWidth = 5.2;
  x.beginPath(); x.moveTo(52, -68); x.lineTo(124, -4); x.stroke();
  if (!ink) {
    const bl = x.createLinearGradient(52, -68, 124, -4);
    bl.addColorStop(0, '#a8a096');
    bl.addColorStop(0.5, '#ffffff');
    bl.addColorStop(1, '#c8c0b4');
    x.strokeStyle = bl;
    x.lineWidth = 2.6;
    x.beginPath(); x.moveTo(52, -68); x.lineTo(123, -5); x.stroke();

  // Guardia a coccia ed elsa
  x.fillStyle = ink ? P.ink : P.oro;

  x.lineWidth = 2;
  x.beginPath();
  x.arc(54, -66, 7, -0.8, 2.3);

  x.stroke();
  x.beginPath();
  x.moveTo(42, -56); x.lineTo(64, -78);
  x.strokeStyle = P.ink; x.lineWidth = 3.6; x.stroke();

  // Mano e rivetti di ottone (perni da marionetta)
  outlineFill(() => { x.arc(50, -68, 5.8, 0, TAU); }, C(P.crema), 2.8);
  if (!ink) {
    x.fillStyle = '#3b2614';

    for (const [jx, jy] of [[18, -98], [36, -80], [-12, -30], [12, -30]]) {

    }
  }
  x.restore();
}

/* =====================================================================
   DISEGNO 2 — GATTO D'OMBRA (Silhouette felina predatoria, artigli, pelo)
   ===================================================================== */
function disegnaGatto(x, posa, modo, fill) {
  const col = fill || P.ink;
  const isOmbra = modo === 'ombra' || !!fill;
  x.save();
  x.lineCap = 'round';
  x.lineJoin = 'round';

  // Coda sinuosa a frusta
  x.strokeStyle = col;
  x.lineWidth = 6;
  x.beginPath();
  if (posa === 'accucciato') {
    x.moveTo(-42, -26);
    x.bezierCurveTo(-64, -34, -72, -58, -56, -70);
    x.bezierCurveTo(-46, -78, -34, -68, -40, -56);
  } else {
    x.moveTo(-40, -28);
    x.bezierCurveTo(-60, -40, -64, -66, -48, -76);
  }
  x.stroke();

  // Corpo felino inarcato con schiena irta di pelo ritagliato
  const pCorpo = new Path2D();
  if (posa === 'accucciato') {
    pCorpo.moveTo(42, -6);
    pCorpo.bezierCurveTo(48, -12, 46, -24, 34, -28);
    // Schiena inarcata con punte di pelo
    pCorpo.lineTo(22, -36); pCorpo.lineTo(24, -31);
    pCorpo.lineTo(8, -42);  pCorpo.lineTo(11, -36);
    pCorpo.lineTo(-8, -46); pCorpo.lineTo(-5, -40);
    pCorpo.lineTo(-22, -45); pCorpo.lineTo(-19, -39);
    pCorpo.bezierCurveTo(-34, -42, -46, -32, -46, -18);
    pCorpo.bezierCurveTo(-46, -10, -40, -4, -30, -4);
    pCorpo.bezierCurveTo(-14, -10, 12, -10, 42, -6);
    pCorpo.closePath();
  } else {
    pCorpo.moveTo(38, -8);
    pCorpo.bezierCurveTo(44, -18, 38, -34, 22, -38);
    pCorpo.lineTo(8, -46); pCorpo.lineTo(10, -40);
    pCorpo.lineTo(-8, -48); pCorpo.lineTo(-5, -42);
    pCorpo.bezierCurveTo(-24, -44, -40, -34, -42, -16);
    pCorpo.lineTo(-32, -4);
    pCorpo.bezierCurveTo(-12, -14, 14, -14, 38, -8);
    pCorpo.closePath();
  }
  x.fillStyle = col;
  x.fill(pCorpo);

  // Zampe artigliate
  x.beginPath();
  // Zampe anteriori protese
  x.moveTo(30, -12); x.lineTo(52, -2); x.lineTo(44, 2); x.lineTo(22, -6);
  x.moveTo(18, -10); x.lineTo(36, 1); x.lineTo(28, 3); x.lineTo(12, -6);
  // Zampe posteriori muscolose
  x.moveTo(-26, -18); x.lineTo(-42, 0); x.lineTo(-28, 2); x.lineTo(-16, -12);
  x.fill();

  // Testa felina affilata con orecchie lunghe a punta
  const hx = posa === 'accucciato' ? 48 : 42;
  const hy = posa === 'accucciato' ? -22 : -36;
  const pTesta = new Path2D();
  pTesta.moveTo(hx - 12, hy + 6);
  // Orecchio sinistro
  pTesta.lineTo(hx - 18, hy - 22);
  pTesta.lineTo(hx - 4, hy - 10);
  // Fronte e orecchio destro
  pTesta.lineTo(hx + 4, hy - 11);
  pTesta.lineTo(hx + 12, hy - 24);
  pTesta.lineTo(hx + 14, hy - 4);
  // Muso aguzzo
  pTesta.lineTo(hx + 24, hy + 2);
  pTesta.quadraticCurveTo(hx + 14, hy + 12, hx - 6, hy + 10);
  pTesta.closePath();
  x.fill(pTesta);

  // Bordo di carta chiara in controluce + intagli interni da teatro delle ombre
  if (!isOmbra) {
    x.strokeStyle = 'rgba(242,194,120,0.42)';
    x.lineWidth = 1.4;
    x.stroke(pCorpo);
    x.stroke(pTesta);
    // Intagli decorativi barocchi (costole d'ombra / spirale) nel corpo
    x.fillStyle = 'rgba(242,194,120,0.22)';
    for (const cx of [-18, -6, 6]) {
      x.beginPath();
      x.ellipse(cx, -26, 2.2, 7, 0.25, 0, TAU);
      x.fill();
    }
  }

  const occhi = [[hx + 4, hy - 1, 3.6, 2.0], [hx + 13, hy, 3.4, 1.9]];
  if (modo !== 'ombra') {
    x.fillStyle = fill ? 'rgba(11,7,4,0.65)' : P.luce;
    for (const [ox, oy, orx, ory] of occhi) {
      x.beginPath();
      x.ellipse(ox, oy, orx, ory, -0.22, 0, TAU);
      x.fill();
    }
  }
  x.restore();
  return occhi;
}

/* =====================================================================
   DISEGNO 3 — LE MANI DI MARIONETTA E DONNA LUCIANA (Boss Finale)
   ===================================================================== */
function disegnaManoMarionettista(x, cx, cy, lato, scala, tAnim, conBilancino, puntiFili) {
  const swayX = Math.sin(tAnim * 1.4 + lato) * 8;
  const swayY = Math.cos(tAnim * 1.8 + lato * 0.5) * 4;
  const mx = cx + swayX;
  const my = cy + swayY;

  x.save();
  // 1. Fili d'oro del Velo che scendono dalle dita / dal bilancino ai personaggi sotto
  if (puntiFili && puntiFili.length) {
    const attacchi = [
      [mx - 48 * scala * lato, my + 58 * scala],
      [mx - 12 * scala * lato, my + 68 * scala],
      [mx + 28 * scala * lato, my + 62 * scala],
      [mx + 56 * scala * lato, my + 48 * scala]
    ];
    for (let i = 0; i < puntiFili.length; i++) {
      const [tx, ty] = puntiFili[i];
      const [ax, ay] = attacchi[i % attacchi.length];
      const midX = (ax + tx) * 0.5 + Math.sin(tAnim * 3 + i) * 4;
      const midY = (ay + ty) * 0.5 + 14;
      // Alone caldo del filo
      x.strokeStyle = 'rgba(243,193,75,0.22)';
      x.lineWidth = 4;
      x.beginPath(); x.moveTo(ax, ay); x.quadraticCurveTo(midX, midY, tx, ty); x.stroke();
      // Filo d'oro nitido
      x.strokeStyle = 'rgba(255,228,150,0.88)';
      x.lineWidth = 1.3;
      x.beginPath(); x.moveTo(ax, ay); x.quadraticCurveTo(midX, midY, tx, ty); x.stroke();
      // Nodo luminoso sul punto di aggancio
      x.fillStyle = P.oro;
      x.beginPath(); x.arc(tx, ty, 2.5, 0, TAU); x.fill();
    }
  }

  x.translate(mx, my);
  x.scale(lato * scala, scala);

  // Alone di retroilluminazione viola/ambra dietro la mano gigante
  const hg = x.createRadialGradient(0, 10, 8, 0, 15, 115);
  hg.addColorStop(0, 'rgba(243,193,75,0.28)');
  hg.addColorStop(1, 'rgba(243,193,75,0)');
  x.fillStyle = hg;
  x.beginPath(); x.arc(0, 15, 115, 0, TAU); x.fill();

  // Polso con merletto barocco borbonico
  x.fillStyle = P.ink;
  x.strokeStyle = 'rgba(243,193,75,0.62)';
  x.lineWidth = 1.6;
  x.beginPath();
  x.moveTo(-42, -90);
  x.lineTo(-28, -22);
  x.quadraticCurveTo(0, -14, 28, -22);
  x.lineTo(44, -90);
  x.closePath();
  x.fill();
  x.stroke();

  // Merletto traforato sul polsino (perforazioni di luce)
  x.fillStyle = P.luce;
  for (let i = -2; i <= 2; i++) {
    x.beginPath();
    x.arc(i * 10, -28, 2.4, 0, TAU);
    x.fill();
  }

  // Palmo affusolato e dita articolate da marionettista
  const pMano = new Path2D();
  pMano.moveTo(-26, -20);
  pMano.bezierCurveTo(-36, -6, -42, 10, -34, 22);
  // Pollice opposto
  pMano.lineTo(-64, 42);
  pMano.quadraticCurveTo(-68, 48, -58, 50);
  pMano.lineTo(-26, 30);
  // Indice che pizzica il filo
  pMano.lineTo(-34, 66);
  pMano.quadraticCurveTo(-32, 74, -24, 66);
  pMano.lineTo(-10, 32);
  // Medio lungo ed elegante
  pMano.lineTo(-6, 74);
  pMano.quadraticCurveTo(0, 82, 4, 72);
  pMano.lineTo(8, 32);
  // Anulare con anello col giglio
  pMano.lineTo(22, 68);
  pMano.quadraticCurveTo(28, 74, 30, 64);
  pMano.lineTo(22, 28);
  // Mignolo inarcato
  pMano.lineTo(48, 52);
  pMano.quadraticCurveTo(54, 56, 52, 46);
  pMano.bezierCurveTo(42, 24, 36, 4, 26, -20);
  pMano.closePath();

  x.fillStyle = P.ink;
  x.fill(pMano);
  x.strokeStyle = 'rgba(243,193,75,0.68)';
  x.lineWidth = 1.5;
  x.stroke(pMano);

  // Anelli d'oro e giunti luminosi sulle falangi
  x.fillStyle = P.oro;
  x.beginPath();
  x.ellipse(24, 44, 4.2, 2.2, -0.2, 0, TAU);
  x.fill();
  x.fillStyle = 'rgba(242,194,120,0.45)';
  for (const [jx, jy] of [[-28, 46], [-2, 50], [24, 44], [40, 38]]) {
    x.beginPath(); x.arc(jx, jy, 1.8, 0, TAU); x.fill();
  }

  // Bilancino in legno (croce da marionettista) tenuto tra le dita
  if (conBilancino) {
    x.save();
    x.translate(0, 56);
    x.rotate(Math.sin(tAnim * 2.1 + lato) * 0.08);
    // Asta principale del bilancino
    x.fillStyle = '#2b1508';
    x.strokeStyle = P.oro;
    x.lineWidth = 1.4;
    x.beginPath();
    x.roundRect(-64, -5, 128, 10, 4);
    x.fill();
    x.stroke();
    // Traversa in prospettiva
    x.beginPath();
    x.moveTo(-28, -16); x.lineTo(28, 16);
    x.lineWidth = 6; x.strokeStyle = '#2b1508'; x.stroke();
    x.lineWidth = 1.4; x.strokeStyle = P.oro; x.stroke();
    // Pomelli dorati alle estremità
    x.fillStyle = P.oro;
    for (const px of [-62, 0, 62]) {
      x.beginPath(); x.arc(px, 0, 3.6, 0, TAU); x.fill();
    }
    x.restore();
  }
  x.restore();
}

/* Donna Luciana: quando le mani scendono nel palco e diventano il Boss Finale */
function disegnaDonnaLuciana(x, cx, cy, tAnim, discesa) {
  // discesa: 0.45 = in discesa (transizione), 1.0 = nel palco (boss finale)
  const yPos = cy * discesa + 110 * (1 - discesa);
  const floatY = Math.sin(tAnim * 2.0) * 5;

  x.save();
  x.translate(cx, yPos + floatY);

  // Grande aura dorata/crema dietro Donna Luciana (controluce teatrale)
  const aura = x.createRadialGradient(0, -110, 15, 0, -110, 240);
  aura.addColorStop(0, 'rgba(255,224,140,0.55)');
  aura.addColorStop(0.45, 'rgba(200,48,27,0.22)');
  aura.addColorStop(1, 'rgba(200,48,27,0)');
  x.fillStyle = aura;
  x.beginPath(); x.arc(0, -110, 240, 0, TAU); x.fill();

  // Ragnatela di fili d'oro del Velo tesi tra Donna Luciana e il soffitto del teatro
  x.strokeStyle = 'rgba(243,193,75,0.45)';
  x.lineWidth = 1.4;
  for (let i = -5; i <= 5; i++) {
    x.beginPath();
    x.moveTo(i * 28, -190);
    x.quadraticCurveTo(i * 45, -280, i * 85, -420);
    x.stroke();
  }

  // Ombra monumentale a terra
  x.save();
  x.scale(1, 0.35);
  const sh = x.createRadialGradient(0, 0, 10, 0, 0, 150);
  sh.addColorStop(0, 'rgba(11,7,4,0.75)');
  sh.addColorStop(1, 'rgba(11,7,4,0)');
  x.fillStyle = sh;
  x.beginPath(); x.arc(0, 0, 150, 0, TAU); x.fill();
  x.restore();

  // Gonna ampia barocca a campana (ombra cinese perforata con gigli e finestre di luce)
  const pGonna = new Path2D();
  pGonna.moveTo(-24, -125);
  pGonna.bezierCurveTo(-68, -95, -96, -45, -108, 0);
  pGonna.quadraticCurveTo(0, 18, 108, 0);
  pGonna.bezierCurveTo(96, -45, 68, -95, 24, -125);
  pGonna.closePath();
  x.fillStyle = P.ink;
  x.fill(pGonna);
  x.strokeStyle = P.oro;
  x.lineWidth = 2;
  x.stroke(pGonna);

  // Perforazioni di luce nella gonna barocca (motivi di fusi, archi e gigli)
  x.fillStyle = P.luce;
  for (let i = -2; i <= 2; i++) {
    const gx = i * 32;
    const gy = -38 + Math.abs(i) * 4;
    x.beginPath();
    x.moveTo(gx, gy - 22);
    x.quadraticCurveTo(gx + 10, gy, gx, gy + 18);
    x.quadraticCurveTo(gx - 10, gy, gx, gy - 22);
    x.fill();
  }

  // Busto aristocratico con corsetto e grande colletto di pizzo in controluce
  x.fillStyle = P.ink;
  x.beginPath();
  x.moveTo(-48, -172);
  x.quadraticCurveTo(-36, -205, 0, -192);
  x.quadraticCurveTo(36, -205, 48, -172);
  x.lineTo(22, -122);
  x.lineTo(-22, -122);
  x.closePath();
  x.fill();
  x.strokeStyle = 'rgba(243,193,75,0.75)';
  x.lineWidth = 1.6;
  x.stroke();

  // Giglio borbonico acceso sul petto di Donna Luciana
  x.fillStyle = P.rosso;
  x.beginPath();
  x.moveTo(0, -170);
  x.bezierCurveTo(8, -158, 8, -144, 0, -136);
  x.bezierCurveTo(-8, -144, -8, -158, 0, -170);
  x.fill();
  x.fillStyle = P.crema;
  x.beginPath(); x.arc(0, -153, 3.2, 0, TAU); x.fill();

  // Testa coronata, chignon alto e velo che scende
  x.fillStyle = P.ink;
  x.beginPath();
  x.arc(0, -210, 18, 0, TAU);
  x.fill();
  x.strokeStyle = P.oro;
  x.lineWidth = 1.5;
  x.stroke();

  // Corona/Tiara a punte d'oro e fusi
  x.fillStyle = P.oro;
  x.beginPath();
  x.moveTo(-18, -224);
  x.lineTo(-14, -246);
  x.lineTo(-6, -230);
  x.lineTo(0, -254);
  x.lineTo(6, -230);
  x.lineTo(14, -246);
  x.lineTo(18, -224);
  x.closePath();
  x.fill();

  // Occhi luminosi e sorriso enigmatico tagliato nella sagoma
  x.fillStyle = P.rosso;
  x.beginPath();
  x.ellipse(-6, -212, 3.2, 1.8, 0.1, 0, TAU);
  x.ellipse(6, -212, 3.2, 1.8, -0.1, 0, TAU);
  x.fill();
  x.strokeStyle = P.crema;
  x.lineWidth = 1.3;
  x.beginPath();
  x.arc(0, -204, 5, 0.15 * Math.PI, 0.85 * Math.PI);
  x.stroke();

  x.restore();

  // Le due Grandi Mani di Marionetta ora scese ai lati di Donna Luciana come sue braccia!
  const handY = yPos - 135;
  disegnaManoMarionettista(x, cx - 165, handY, 1, 1.05, tAnim, true, [
    [FERRUCCIO.x + 8, FERRUCCIO.y - 115],
    [GATTO_ACC.x, GATTO_ACC.y - 28]
  ]);
  disegnaManoMarionettista(x, cx + 165, handY, -1, 1.05, tAnim, true, [
    [GATTO_ACC.x + 30, GATTO_ACC.y - 24],
    [GATTO_COL.x, GATTO_COL.y - 24]
  ]);
}

/* =====================================================================
   DISEGNO 4 — BOCCASCENA BAROCCO, QUINTE DRAPPEGGIATE E RIBALTA
   ===================================================================== */
function disegnaProscenioTeatrale() {
  // 1. Quinte di velluto rosso/bruno drappeggiate ai lati (incorniciano la Variante C)
  for (const side of [-1, 1]) {
    ctx.save();
    if (side === 1) { ctx.translate(W, 0); ctx.scale(-1, 1); }
    const cg = ctx.createLinearGradient(0, 0, 150, 0);
    cg.addColorStop(0, '#120403');
    cg.addColorStop(0.65, '#2b0906');
    cg.addColorStop(1, '#140504');
    ctx.fillStyle = cg;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(145, 0);
    ctx.bezierCurveTo(120, 160, 105, 310, 132, 430);
    ctx.bezierCurveTo(95, 520, 88, 640, 110, H);
    ctx.lineTo(0, H);
    ctx.closePath();
    ctx.fill();

    // Bordo dorato e cordone con nappa del sipario
    ctx.strokeStyle = P.oro;
    ctx.lineWidth = 2.2;
    ctx.beginPath();
    ctx.moveTo(145, 0);
    ctx.bezierCurveTo(120, 160, 105, 310, 132, 430);
    ctx.bezierCurveTo(95, 520, 88, 640, 110, H);
    ctx.stroke();

    // Nappa dorata dove il sipario è raccolto
    ctx.fillStyle = P.oro;
    ctx.beginPath();
    ctx.arc(118, 425, 6, 0, TAU);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(118, 431);
    ctx.lineTo(111, 456);
    ctx.lineTo(125, 456);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  // 2. Mantovana superiore (drappeggio barocco in alto da cui spuntano le mani)
  ctx.save();
  const mg = ctx.createLinearGradient(0, 0, 0, 56);
  mg.addColorStop(0, '#0e0403');
  mg.addColorStop(1, '#2d0a07');
  ctx.fillStyle = mg;
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.lineTo(W, 0);
  ctx.lineTo(W, 38);
  for (let x = W; x > 0; x -= 160) {
    ctx.quadraticCurveTo(x - 80, 64, x - 160, 38);
  }
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = 'rgba(243,193,75,0.65)';
  ctx.lineWidth = 1.8;
  ctx.stroke();
  ctx.restore();

  // 3. Palco di ribalta in legno intagliato sul fondo con conchiglie luminose (luci di ribalta)
  const ry = G.fb + G.southH;
  const rg = ctx.createLinearGradient(0, ry - 8, 0, H);
  rg.addColorStop(0, '#2a1509');
  rg.addColorStop(0.3, '#170b04');
  rg.addColorStop(1, '#080402');
  ctx.fillStyle = rg;
  ctx.fillRect(0, ry, W, H - ry);
  ctx.strokeStyle = 'rgba(243,193,75,0.5)';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(0, ry); ctx.lineTo(W, ry); ctx.stroke();

  // Conchiglie delle luci di ribalta teatrale
  for (const lx of [280, 460, 820, 1000]) {
    const fg = ctx.createRadialGradient(lx, ry - 4, 2, lx, ry - 24, 68);
    fg.addColorStop(0, 'rgba(255,214,125,0.38)');
    fg.addColorStop(1, 'rgba(255,214,125,0)');
    ctx.fillStyle = fg;
    ctx.beginPath(); ctx.arc(lx, ry - 8, 68, Math.PI, 0); ctx.fill();

    ctx.fillStyle = '#1b0d05';
    ctx.strokeStyle = P.oro;
    ctx.lineWidth = 1.4;
    ctx.beginPath();
    ctx.arc(lx, ry + 6, 14, Math.PI, 0);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
  }

  // 4. Cornice esterna in legno dorato con stemma del Giglio in alto al centro
  ctx.strokeStyle = P.legno;
  ctx.lineWidth = 16;
  ctx.strokeRect(8, 8, W - 16, H - 16);
  ctx.strokeStyle = 'rgba(243,193,75,0.65)';
  ctx.lineWidth = 1.5;
  ctx.strokeRect(14, 14, W - 28, H - 28);
}

/* =====================================================================
   ATTORI E FEEDBACK DEL COLPO ALLA ISAAC
   ===================================================================== */
const FERRUCCIO = { x: 430, y: 435, s: .82 };
const GATTO_ACC = { x: 895, y: 345, s: 1.0, dir: -1 };
const GATTO_COL = { x: 590, y: 488, s: 1.02, dir: 1 };
const MONETE = [[704, 555], [744, 538], [776, 568]];

function ellisseAppoggio(px, py, rx, ry, a) {
  const g = ctx.createRadialGradient(px, py, 0, px, py, rx);
  g.addColorStop(0, rgba(P.ink, a));
  g.addColorStop(.7, rgba(P.ink, a * .85));
  g.addColorStop(1, rgba(P.ink, 0));
  ctx.save();
  ctx.translate(px, py);
  ctx.scale(1, ry / rx);
  ctx.fillStyle = g;
  ctx.beginPath(); xArc(ctx, 0, 0, rx); ctx.fill();
  ctx.strokeStyle = 'rgba(242,194,120,0.28)';
  ctx.lineWidth = 1.4;
  ctx.beginPath(); ctx.arc(0, 1.5, rx * 0.9, 0.15 * Math.PI, 0.85 * Math.PI); ctx.stroke();
  ctx.restore();
}
function xArc(c, x, y, r) { c.arc(x, y, r, 0, TAU); }

function disegnaMuraStanza() {
  const { fx, fy, fr, fb, fw, wallW, southH } = G;
  // Muro nord in tufo scuro con archi ciechi e cornice di carta illuminata
  const g = ctx.createLinearGradient(0, wallTop, 0, fy);
  g.addColorStop(0, '#0d0603');
  g.addColorStop(0.5, '#1d0e06');
  g.addColorStop(1, '#3e1e0b');
  ctx.fillStyle = g;
  ctx.fillRect(fx - wallW, wallTop, fw + 2 * wallW, fy - wallTop);

  // Archi ciechi scolpiti lungo la parete di fondo
  for (let ax = fx + 28; ax < fr - 60; ax += 116) {
    if (Math.abs(ax + 36 - PORTA_N.x) < 76) continue;
    ctx.fillStyle = 'rgba(242,194,120,0.07)';
    ctx.strokeStyle = 'rgba(242,194,120,0.18)';
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(ax, fy);
    ctx.lineTo(ax, fy - 24);
    ctx.arc(ax + 34, fy - 24, 34, Math.PI, 0);
    ctx.lineTo(ax + 68, fy);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
  }

  // Cordolo superiore illuminato del muro nord
  ctx.fillStyle = '#4a240e';
  ctx.fillRect(fx - wallW, wallTop - 4, fw + 2 * wallW, 6);
  ctx.strokeStyle = 'rgba(242,194,120,0.72)';
  ctx.lineWidth = 1.6;
  ctx.beginPath();
  ctx.moveTo(fx - wallW, wallTop - 4);
  ctx.lineTo(fr + wallW, wallTop - 4);
  ctx.stroke();

  // Pareti laterali in prospettiva
  for (const side of [-1, 1]) {
    const X = side < 0 ? fx - wallW : fr;
    ctx.fillStyle = '#140a04';
    ctx.fillRect(X, fy - 2, wallW, fb - fy + southH + 2);
    ctx.strokeStyle = 'rgba(242,194,120,0.5)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(side < 0 ? fx : fr, fy);
    ctx.lineTo(side < 0 ? fx : fr, fb);
    ctx.stroke();
  }

  // Porta Nord aperta con soglia d'oro
  const { x, w, h } = PORTA_N;
  ctx.fillStyle = P.ink;
  ctx.beginPath();
  ctx.arc(x, fy - h + 18, w / 2 + 10, Math.PI, 0);
  ctx.lineTo(x + w / 2 + 10, fy);
  ctx.lineTo(x - w / 2 - 10, fy);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = 'rgba(243,193,75,0.65)';
  ctx.lineWidth = 2;
  ctx.stroke();

  const pg = ctx.createLinearGradient(0, fy - h, 0, fy);
  pg.addColorStop(0, '#7a3b14');
  pg.addColorStop(1, '#f5c776');
  ctx.fillStyle = pg;
  ctx.beginPath();
  ctx.arc(x, fy - h + 20, w / 2, Math.PI, 0);
  ctx.lineTo(x + w / 2, fy);
  ctx.lineTo(x - w / 2, fy);
  ctx.closePath();
  ctx.fill();

  // Soglia d'oro brillante
  ctx.fillStyle = P.oro;
  ctx.fillRect(x - w / 2 - 4, fy - 2, w + 8, 5);
}

function disegnaColpoIsaac(px, py) {
  ctx.save();
  ctx.translate(px, py);
  // 1. Onda d'urto radiale (shockwave ring alla Isaac)
  ctx.save();
  ctx.scale(1, 0.6);
  const rg = ctx.createRadialGradient(0, 0, 10, 0, 0, 92);
  rg.addColorStop(0, 'rgba(255,248,232,0.55)');
  rg.addColorStop(0.65, 'rgba(243,193,75,0.35)');
  rg.addColorStop(1, 'rgba(243,193,75,0)');
  ctx.fillStyle = rg;
  ctx.beginPath(); ctx.arc(0, 0, 92, 0, TAU); ctx.fill();
  ctx.strokeStyle = 'rgba(255,250,235,0.85)';
  ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(0, 0, 64, 0, TAU); ctx.stroke();
  ctx.restore();

  // 2. Schizzi densi d'inchiostro e frammenti di carta dorata esplosi dal colpo
  const r = rng(77);
  for (let i = 0; i < 22; i++) {
    const a = 0.65 + (r() - 0.5) * 1.9;
    const d = 16 + r() * 98;
    const gx = Math.cos(a) * d;
    const gy = Math.sin(a) * d * 0.62;
    const sz = 2.5 + r() * 5.5;
    ctx.save();
    ctx.translate(gx, gy);
    ctx.rotate(a);
    ctx.fillStyle = i % 5 === 0 ? P.oro : P.ink;
    ctx.beginPath();
    ctx.ellipse(0, 0, sz * 1.7, sz * 0.8, 0, 0, TAU);
    ctx.fill();
    ctx.restore();
  }

  // 3. Raggi d'impatto bianchi ("comic/Isaac hit burst")
  ctx.strokeStyle = '#fffdf5';
  ctx.lineWidth = 2.6;
  for (let i = 0; i < 8; i++) {
    const a = (i / 8) * TAU + 0.2;
    ctx.beginPath();
    ctx.moveTo(Math.cos(a) * 18, Math.sin(a) * 12);
    ctx.lineTo(Math.cos(a) * 48, Math.sin(a) * 30);
    ctx.stroke();
  }
  ctx.restore();
}

function sciaFendente(px, py) {
  const a0 = -0.58, a1 = 1.32, r1 = 132;
  ctx.save();
  ctx.translate(px, py);
  ctx.lineCap = 'round';
  // Mezzaluna tagliente multistrato
  for (let i = 0; i < 16; i++) {
    const t0 = i / 16, t1 = (i + 1) / 16;
    ctx.strokeStyle = `rgba(255,248,225,${0.18 + 0.78 * t1})`;
    ctx.lineWidth = 2 + 12 * Math.pow(t1, 0.85);
    ctx.beginPath();
    ctx.arc(0, 0, r1 - 5, a0 + (a1 - a0) * t0, a0 + (a1 - a0) * t1 + 0.03);
    ctx.stroke();
  }
  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = 2.2;
  ctx.beginPath();
  ctx.arc(0, 0, r1, a0 + 0.35, a1);
  ctx.stroke();
  ctx.restore();
}

function lanterna(l, tAnim) {
  const { x, y } = l;
  const flick = 1 + Math.sin(tAnim * 7 + x) * 0.05;
  ctx.save();
  // Alone grande caldo
  ctx.globalCompositeOperation = 'screen';
  const ag = ctx.createRadialGradient(x, y + 26, 2, x, y + 26, 135 * flick);
  ag.addColorStop(0, 'rgba(255,216,130,0.82)');
  ag.addColorStop(0.4, 'rgba(243,178,74,0.32)');
  ag.addColorStop(1, 'rgba(243,178,74,0)');
  ctx.fillStyle = ag;
  ctx.beginPath(); ctx.arc(x, y + 26, 135 * flick, 0, TAU); ctx.fill();
  ctx.restore();

  // Catena e lanterna in ferro battuto
  ctx.strokeStyle = P.ink;
  ctx.lineWidth = 1.8;
  ctx.beginPath(); ctx.moveTo(x, 36); ctx.lineTo(x, y); ctx.stroke();
  ctx.fillStyle = '#ffe29a';
  ctx.fillRect(x - 7, y + 10, 14, 24);
  ctx.strokeStyle = P.ink;
  ctx.lineWidth = 2.2;
  ctx.strokeRect(x - 7, y + 10, 14, 24);
  ctx.fillStyle = P.ink;
  ctx.beginPath();
  ctx.moveTo(x - 11, y + 10); ctx.lineTo(x + 11, y + 10); ctx.lineTo(x, y + 2); ctx.closePath();
  ctx.fill();
}

function moneta(px, py) {
  ctx.save();
  ctx.fillStyle = 'rgba(11,7,4,0.4)';
  ctx.beginPath(); ctx.ellipse(px + 3, py + 4, 9, 4, 0, 0, TAU); ctx.fill();
  ctx.translate(px, py);
  ctx.scale(1, 0.78);
  ctx.fillStyle = P.oro;
  ctx.strokeStyle = P.ink;
  ctx.lineWidth = 1.8;
  ctx.beginPath(); ctx.arc(0, 0, 8.5, 0, TAU); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#5a3208';
  ctx.fillRect(-1.5, -5, 3, 10);
  ctx.fillRect(-4.5, -1.5, 9, 3);
  ctx.restore();
}

function disegnaHUD() {
  ctx.save();
  // Cartiglio sinistro: Vita, Scatto, Monete, Scintille
  ctx.fillStyle = 'rgba(11,7,4,0.88)';
  ctx.strokeStyle = P.oro;
  ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.roundRect(24, 16, 290, 48, 6); ctx.fill(); ctx.stroke();

  for (let i = 0; i < 5; i++) {
    const mx = 52 + i * 26, my = 40;
    ctx.fillStyle = i < 4 ? P.crema : 'rgba(244,227,189,0.25)';
    ctx.beginPath(); ctx.arc(mx, my, 9, 0, TAU); ctx.fill();
    ctx.fillStyle = P.ink;
    ctx.beginPath(); ctx.arc(mx - 3, my - 1, 2, 0, TAU); ctx.arc(mx + 3, my - 1, 2, 0, TAU); ctx.fill();
  }
  ctx.fillStyle = P.oro;
  ctx.font = 'bold 15px Georgia, serif';
  ctx.fillText('12', 228, 45);
  ctx.fillStyle = P.luce;
  ctx.fillText('✦ 3', 268, 45);

  // Cartiglio destro: Nome stanza o Boss
  ctx.fillStyle = 'rgba(11,7,4,0.88)';
  ctx.strokeStyle = P.oro;
  ctx.beginPath(); ctx.roundRect(960, 16, 296, 42, 6); ctx.fill(); ctx.stroke();
  ctx.fillStyle = P.crema;
  ctx.font = '13px Georgia, serif';
  ctx.textAlign = 'right';
  const titolo = SCENA === 'boss'
    ? 'CORTILE D’ONORE · DONNA LUCIANA'
    : SCENA === 'transizione'
      ? 'IL VELO SI SQUARCIA · DISCESA'
      : 'PIAZZA DANTE · STANZA 3 (VAR. C)';
  ctx.fillText(titolo, 1240, 42);

  // Barra vita del Boss se siamo nella scena Boss
  if (SCENA === 'boss' || SCENA === 'transizione') {
    const bw = 520, bh = 18, bx = (W - bw) / 2, by = 652;
    ctx.fillStyle = 'rgba(11,7,4,0.92)';
    ctx.strokeStyle = P.oro;
    ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.roundRect(bx, by, bw, bh, 4); ctx.fill(); ctx.stroke();
    const fillW = SCENA === 'boss' ? bw * 0.72 : bw;
    const bg = ctx.createLinearGradient(bx, 0, bx + bw, 0);
    bg.addColorStop(0, P.rossoDeep);
    bg.addColorStop(1, P.rosso);
    ctx.fillStyle = bg;
    ctx.fillRect(bx + 3, by + 3, fillW - 6, bh - 6);
    ctx.fillStyle = P.crema;
    ctx.font = 'bold 12px Georgia, serif';
    ctx.textAlign = 'center';
    ctx.fillText('DONNA LUCIANA — LA MARIONETTISTA DEL VELO', W / 2, by - 7);
  }
  ctx.restore();
}

/* =====================================================================
   CICLO DI RENDER PRINCIPALE
   ===================================================================== */
let animAttiva = !Q.get('dpr'); // statico per screenshot automatici con ?dpr=1, animato per l'utente
let tStart = performance.now();

function render(now) {
  const tAnim = animAttiva ? ((now || performance.now()) - tStart) / 1000 : 0.4;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';

  const { fx, fy, fr, fb, fw, fh } = G;

  // 1. Fondale di Caserta e Reggia
  ctx.fillStyle = '#090402';
  ctx.fillRect(0, 0, W, H);
  ctx.drawImage(FONDALE, 0, 0, W, 380);

  // 2. Pavimento della stanza e pozze di luce delle lanterne
  ctx.drawImage(CARTA, fx, fy, fw, fh);
  ctx.save();
  ctx.beginPath(); ctx.rect(fx, fy, fw, fh); ctx.clip();
  for (const l of LANTERNE) {
    const pg = ctx.createRadialGradient(l.x, l.y + 165, 4, l.x, l.y + 165, 220);
    pg.addColorStop(0, 'rgba(255,198,108,0.44)');
    pg.addColorStop(1, 'rgba(255,198,108,0)');
    ctx.fillStyle = pg;
    ctx.beginPath(); ctx.arc(l.x, l.y + 165, 220, 0, TAU); ctx.fill();
  }
  ctx.restore();

  // 3. Mura e porte della stanza
  disegnaMuraStanza();

  // 4. Attori nella stanza
  ctx.save();
  ctx.beginPath(); ctx.rect(fx, fy - 90, fw, fh + 90); ctx.clip();

  // Segno a terra del balzo del gatto
  ctx.save();
  ctx.strokeStyle = 'rgba(11,7,4,0.58)';
  ctx.lineWidth = 2;
  ctx.setLineDash([10, 7]);
  ctx.beginPath();
  ctx.moveTo(GATTO_ACC.x - 16, GATTO_ACC.y);
  ctx.lineTo(GATTO_ACC.x - 210, GATTO_ACC.y + 42);
  ctx.stroke();
  ctx.restore();

  // Effetto colpo alla Isaac sotto il gatto colpito
  disegnaColpoIsaac(GATTO_COL.x + 8, GATTO_COL.y - 10);

  // Gatto accucciato con lampo rosso sugli occhi
  ellisseAppoggio(GATTO_ACC.x, GATTO_ACC.y, 46, 14, 0.48);
  ctx.save();
  ctx.translate(GATTO_ACC.x, GATTO_ACC.y);
  ctx.scale(GATTO_ACC.s * GATTO_ACC.dir, GATTO_ACC.s);
  const occhi = disegnaGatto(ctx, 'accucciato', 'pieno');
  ctx.fillStyle = P.rosso;
  for (const [ox, oy, orx, ory] of occhi) {
    ctx.beginPath(); ctx.ellipse(ox, oy, orx * 1.3, ory * 1.3, -0.2, 0, TAU); ctx.fill();
  }
  ctx.restore();
  // Anello rosso di parata attorno alla testa del gatto
  const hx = GATTO_ACC.x + GATTO_ACC.dir * 52 * GATTO_ACC.s;
  const hy = GATTO_ACC.y - 22 * GATTO_ACC.s;
  ctx.strokeStyle = P.rosso;
  ctx.lineWidth = 2.6;
  ctx.beginPath(); ctx.arc(hx, hy, 22, 0, TAU); ctx.stroke();
  ctx.strokeStyle = P.crema;
  ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.arc(hx, hy, 26, 0, TAU); ctx.stroke();

  // Boss Finale Donna Luciana (se siamo in modalità transizione o boss)
  if (SCENA === 'transizione' || SCENA === 'boss') {
    disegnaDonnaLuciana(ctx, 670, 355, tAnim, SCENA === 'boss' ? 1.0 : 0.45);
  }

  // Ferruccio e fendente
  ellisseAppoggio(FERRUCCIO.x, FERRUCCIO.y, 34, 12, 0.5);
  ctx.save();
  ctx.translate(FERRUCCIO.x, FERRUCCIO.y);
  ctx.scale(FERRUCCIO.s, FERRUCCIO.s);
  disegnaFerruccio(ctx, 'pieno', tAnim);
  ctx.restore();
  sciaFendente(FERRUCCIO.x + 48 * FERRUCCIO.s, FERRUCCIO.y - 68 * FERRUCCIO.s);

  // Gatto colpito (flash bianco pieno + squash)
  ellisseAppoggio(GATTO_COL.x + 6, GATTO_COL.y, 48, 13, 0.42);
  ctx.save();
  ctx.translate(GATTO_COL.x, GATTO_COL.y);
  ctx.scale(GATTO_COL.s, GATTO_COL.s);
  ctx.transform(1.22, 0, 0.28, 0.76, 0, 0);
  ctx.scale(GATTO_COL.dir, 1);
  disegnaGatto(ctx, 'neutro', 'pieno', P.bianco);
  ctx.restore();

  for (const [mx, my] of MONETE) moneta(mx, my);
  ctx.restore();

  // 5. Lanterne appese
  for (const l of LANTERNE) lanterna(l, tAnim);

  // 6. SOPRA A TUTTO (Stanza normale): LE MANI DI MARIONETTA CON BILANCINI E FILI D'ORO
  if (SCENA === 'stanza') {
    // Mano sinistra sopra Ferruccio e il centro stanza
    disegnaManoMarionettista(ctx, 430, 56, 1, 0.96, tAnim, true, [
      [FERRUCCIO.x - 16, FERRUCCIO.y - 168],
      [FERRUCCIO.x + 38, FERRUCCIO.y - 72],
      [GATTO_COL.x - 12, GATTO_COL.y - 28]
    ]);
    // Mano destra sopra i Gatti d'ombra (li muove come marionette)
    disegnaManoMarionettista(ctx, 875, 56, -1, 0.96, tAnim, true, [
      [GATTO_ACC.x - 32, GATTO_ACC.y - 38],
      [GATTO_ACC.x + 12, GATTO_ACC.y - 34],
      [GATTO_ACC.x - 48, GATTO_ACC.y - 52],
      [GATTO_COL.x + 22, GATTO_COL.y - 26]
    ]);
  }

  // 7. Boccascena teatrale barocco, quinte e ribalta
  disegnaProscenioTeatrale();

  // 8. HUD
  disegnaHUD();

  if (animAttiva) requestAnimationFrame(render);
}

/* Misure compatibili con la suite QA */
function campione(x, y, n) {
  const h = (n - 1) / 2;
  const id = ctx.getImageData(Math.round((x - h) * DPR), Math.round((y - h) * DPR), Math.max(1, Math.round(n * DPR)), Math.max(1, Math.round(n * DPR))).data;
  let r = 0, g = 0, b = 0, k = 0;
  for (let i = 0; i < id.length; i += 4) { r += id[i]; g += id[i + 1]; b += id[i + 2]; k++; }
  return [r / k, g / k, b / k];
}
function misura() {
  const punti = {
    centro_pavimento: [640, 380],
    pozza_lanterna_sx: [350, 330],
    angolo_pavimento_bd: [1080, 600],
    angolo_pavimento_as: [200, 190],
    parete_nord: [640, 145],
    camicia_ferruccio: [FERRUCCIO.x + 2, FERRUCCIO.y - 62],
    dorso_gatto: [GATTO_ACC.x - 10, GATTO_ACC.y - 24]
  };
  const out = {};
  for (const k in punti) {
    const [x, y] = punti[k];
    const p1 = campione(x, y, 1), p5 = campione(x, y, 5);
    out[k] = { x, y, rgb: p1.map(v => Math.round(v)), L: +lum(...p1).toFixed(3), L_media5x5: +lum(...p5).toFixed(3) };
  }
  return out;
}

window.setScena = function (s) {
  SCENA = s;
  document.getElementById('btn-stanza').classList.toggle('active', s === 'stanza');
  document.getElementById('btn-transizione').classList.toggle('active', s === 'transizione');
  document.getElementById('btn-boss').classList.toggle('active', s === 'boss');
  if (!animAttiva) render(performance.now());
};
window.toggleAnim = function () {
  animAttiva = !animAttiva;
  const b = document.getElementById('btn-anim');
  b.textContent = 'Animazione: ' + (animAttiva ? 'ON' : 'OFF');
  b.classList.toggle('active', animAttiva);
  if (animAttiva) requestAnimationFrame(render);
};
window.toggleGrigi = function () {
  cv.classList.toggle('grigi');
  document.getElementById('btn-grigi').classList.toggle('active', cv.classList.contains('grigi'));
};
window.__bench = function (n, flush) {
  n = n || 60;
  const wasAnim = animAttiva;
  animAttiva = false;
  const t0 = performance.now();
  for (let i = 0; i < n; i++) { render(t0); if (flush) ctx.getImageData(0, 0, 1, 1); }
  const media = (performance.now() - t0) / n;
  animAttiva = wasAnim;
  if (animAttiva) requestAnimationFrame(render);
  return { variante: VAR, scena: SCENA, media_ms: +media.toFixed(3) };
};

render(performance.now());
window.__misure = misura();
window.__pronto = true;
</script>
