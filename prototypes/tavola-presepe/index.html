<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Ferruccio — Tavola del presepe d'ombre (style frame)</title>
<style>
  html,body{margin:0;height:100%;background:#050302;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center}
  canvas{display:block;width:min(100vw,calc(100vh*16/9));height:auto;aspect-ratio:16/9;background:#050302}
  canvas.grigi{filter:grayscale(1)}
</style>
</head>
<body>
<canvas id="c" width="1280" height="720"></canvas>
<script>
'use strict';
/* =====================================================================
   TAVOLA DEL PRESEPE D'OMBRE — un solo fotogramma immobile, Canvas 2D.
   ?variante=A|B|C   ?grigi=1 (filtro grayscale)   ?dpr=1 (forza la scala)
   Tutto è procedurale: niente bitmap, niente font esterni.
   PRECALCOLATO (una volta): texture della carta del pavimento, fondale,
   sfondo del teatro, tile di grana. PER FRAME: tutto il resto.
   ===================================================================== */
const W = 1280, H = 720;
const Q = new URLSearchParams(location.search);
const VAR = (Q.get('variante') || 'A').toUpperCase();
const cv = document.getElementById('c');
if (Q.get('grigi')) cv.classList.add('grigi');
const DPR = Q.get('dpr') ? +Q.get('dpr') : Math.min(2, window.devicePixelRatio || 1);
cv.width = W * DPR; cv.height = H * DPR;
const ctx = cv.getContext('2d', { alpha: false });

/* ---------- palette (art bible §4) ---------- */
const P = {
  ink: '#0b0704', inkMid: '#1c1008', bruno: '#5a2a0e', carta: '#c98a3c', luce: '#f2c278',
  pav: '#9a6428', crema: '#f4e3bd', bianco: '#fff8e8', oro: '#f3c14b', oroDim: '#c9a24a',
  rosso: '#c8301b', rossoDeep: '#9c231f', azzurro: '#7fd3ff', legno: '#2a1608', bg: '#0a0604'
};

/* ---------- varianti ---------- */
const VARIANTI = {
  A: { nome: 'A — calda e teatrale', esp: 1.00, wallTop: 76, pool: .50, alone: .55, vign: .72, ombra: .30, grana: .10,
       fondaleAlpha: 1.0, nebbia: .45, quinte: false, scalaFondale: 1.0, blurMid: .8, blurFar: 2.6, bordoFloor: .40, centroMix: .30 },
  B: { nome: 'B — scura e contrastata', esp: .86, wallTop: 76, pool: .70, alone: .66, vign: .94, ombra: .46, grana: .14,
       fondaleAlpha: .78, nebbia: .28, quinte: false, scalaFondale: 1.0, blurMid: .8, blurFar: 2.6, bordoFloor: .66, centroMix: .22 },
  C: { nome: 'C — più fondale e profondità', esp: .94, wallTop: 100, pool: .50, alone: .50, vign: .70, ombra: .30, grana: .10,
       fondaleAlpha: 1.0, nebbia: .60, quinte: true, scalaFondale: 1.18, blurMid: 1.1, blurFar: 3.2, bordoFloor: .42, centroMix: .28 }
};
const V = VARIANTI[VAR] || VARIANTI.A;

/* ---------- geometria della stanza: 13×7 celle da 64 px, area 832×448 centrata ---------- */
const G = { fx: 224, fy: 136, fw: 832, fh: 448, cella: 64, wallW: 24, southH: 30 };
G.fr = G.fx + G.fw; G.fb = G.fy + G.fh;
const wallTop = V.wallTop;
const LANTERNE = [{ x: 400, y: 150 }, { x: 880, y: 150 }];   // anello di sospensione
const PORTA_N = { x: 640, w: 72, h: 58 };

/* ---------- utilità ---------- */
function rng(seed) { let t = seed >>> 0; return function () { t = (t + 0x6D2B79F5) >>> 0; let r = Math.imul(t ^ (t >>> 15), 1 | t); r = (r + Math.imul(r ^ (r >>> 7), 61 | r)) ^ r; return ((r ^ (r >>> 14)) >>> 0) / 4294967296; }; }
function hex(h) { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
function rgba(c, a) { const [r, g, b] = typeof c === 'string' ? hex(c) : c; return `rgba(${r | 0},${g | 0},${b | 0},${a == null ? 1 : a})`; }
function mix(c1, c2, t) { const a = typeof c1 === 'string' ? hex(c1) : c1, b = typeof c2 === 'string' ? hex(c2) : c2; return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t]; }
function esp(c, k) { const a = typeof c === 'string' ? hex(c) : c; return [Math.min(255, a[0] * k), Math.min(255, a[1] * k), Math.min(255, a[2] * k)]; }
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const TAU = Math.PI * 2;

/* path con jitter a seme (la linea storta è umana) */
function path(cmds, seed, amp) {
  const r = seed == null ? null : rng(seed); const j = r ? (v => v + (r() * 2 - 1) * amp) : (v => v);
  const p = new Path2D();
  for (const c of cmds) {
    const k = c[0];
    if (k === 'M') p.moveTo(j(c[1]), j(c[2]));
    else if (k === 'L') p.lineTo(j(c[1]), j(c[2]));
    else if (k === 'Q') p.quadraticCurveTo(j(c[1]), j(c[2]), j(c[3]), j(c[4]));
    else if (k === 'C') p.bezierCurveTo(j(c[1]), j(c[2]), j(c[3]), j(c[4]), j(c[5]), j(c[6]));
    else if (k === 'Z') p.closePath();
  }
  return p;
}
/* ritaglio d'inchiostro con spessore di carta chiara sul bordo in controluce (alto-sinistra) */
function ritaglio(x, p, fill, o) {
  o = o || {};
  x.fillStyle = fill || P.ink; x.fill(p);
  if (o.bordo === false) return;
  x.save(); x.clip(p); x.translate(o.dx == null ? 1.0 : o.dx, o.dy == null ? 1.0 : o.dy);
  x.lineWidth = o.lw || 1.5; x.strokeStyle = o.lip || 'rgba(242,194,120,.32)'; x.stroke(p); x.restore();
}
/* pezzo chiaro di Ferruccio: contorno d'inchiostro 2 px + riempimento crema con gradiente */
function pezzoChiaro(x, p, fill, modo) {
  x.lineJoin = 'round'; x.lineCap = 'round';
  if (modo === 'ombra') { x.lineWidth = 3.6; x.strokeStyle = x.fillStyle; x.stroke(p); x.fill(p); return; }
  x.lineWidth = 3.6; x.strokeStyle = P.ink; x.stroke(p);
  x.fillStyle = fill || P.crema; x.fill(p);
}
function rr(x, X, Y, w, h, r) { x.beginPath(); x.moveTo(X + r, Y); x.arcTo(X + w, Y, X + w, Y + h, r); x.arcTo(X + w, Y + h, X, Y + h, r); x.arcTo(X, Y + h, X, Y, r); x.arcTo(X, Y, X + w, Y, r); x.closePath(); }
function lum(r, g, b) { const f = c => { c /= 255; return c <= .04045 ? c / 12.92 : Math.pow((c + .055) / 1.055, 2.4); }; return .2126 * f(r) + .7152 * f(g) + .0722 * f(b); }

/* rumore a valore, più ottave, celle anisotrope (fibre) */
function rumore(w, h, seed, ott) {
  const out = new Float32Array(w * h), r = rng(seed);
  for (const o of ott) {
    const cx = o.cx, cy = o.cy || o.cx, amp = o.amp;
    const gw = Math.ceil(w / cx) + 2, gh = Math.ceil(h / cy) + 2; const g = new Float32Array(gw * gh);
    for (let i = 0; i < g.length; i++) g[i] = r() * 2 - 1;
    for (let y = 0; y < h; y++) {
      const fy = y / cy, y0 = fy | 0, ty = fy - y0, sy = ty * ty * (3 - 2 * ty);
      for (let x = 0; x < w; x++) {
        const fx = x / cx, x0 = fx | 0, tx = fx - x0, sx = tx * tx * (3 - 2 * tx);
        const i = y0 * gw + x0; const a = g[i], b = g[i + 1], c = g[i + gw], d = g[i + gw + 1];
        const top = a + (b - a) * sx, bot = c + (d - c) * sx; out[y * w + x] += amp * (top + (bot - top) * sy);
      }
    }
  }
  return out;
}
function nuovoCanvas(w, h) { const c = document.createElement('canvas'); c.width = Math.round(w * DPR); c.height = Math.round(h * DPR); const x = c.getContext('2d'); x.scale(DPR, DPR); return [c, x]; }

/* =====================================================================
   PRECALCOLO 1 — la carta del pavimento (retroilluminata, fibre, grana, ciottoli)
   ===================================================================== */
function creaCarta() {
  const w = G.fw, h = G.fh; const [c, x] = nuovoCanvas(w, h);
  const cen = esp(mix(P.pav, P.carta, V.centroMix), V.esp), med = esp(P.pav, V.esp), bordo = esp(mix(P.pav, P.bruno, .55), V.esp);
  const g = x.createRadialGradient(w * .5, h * .42, 10, w * .5, h * .5, w * .62);
  g.addColorStop(0, rgba(cen)); g.addColorStop(.5, rgba(med)); g.addColorStop(1, rgba(bordo));
  x.fillStyle = g; x.fillRect(0, 0, w, h);
  // luce di chiave dall'alto a sinistra
  const k = x.createLinearGradient(0, 0, w, h); k.addColorStop(0, 'rgba(255,225,160,.10)'); k.addColorStop(1, 'rgba(20,8,2,.20)');
  x.fillStyle = k; x.fillRect(0, 0, w, h);
  // chiazze (rumore grande), fibre (rumore anisotropo), grana fine
  const pw = Math.round(w * DPR), ph = Math.round(h * DPR);
  const id = x.getImageData(0, 0, pw, ph), d = id.data;
  const n1 = rumore(pw, ph, 11, [{ cx: 190 * DPR, amp: .5 }, { cx: 90 * DPR, amp: .3 }, { cx: 40 * DPR, amp: .2 }]);
  const n2 = rumore(pw, ph, 23, [{ cx: 70 * DPR, cy: 2.2 * DPR, amp: .6 }, { cx: 30 * DPR, cy: 1.6 * DPR, amp: .4 }]);
  const rr_ = rng(37);
  for (let i = 0, p = 0; i < pw * ph; i++, p += 4) {
    const m = 1 + .09 * n1[i] + .07 * n2[i] + (rr_() * 2 - 1) * .05;
    d[p] = clamp(d[p] * m, 0, 255); d[p + 1] = clamp(d[p + 1] * m, 0, 255); d[p + 2] = clamp(d[p + 2] * m, 0, 255);
  }
  x.putImageData(id, 0, 0);
  // fibre disegnate: fili chiari e scuri, quasi orizzontali con qualche trama trasversale
  const rf = rng(5); x.lineCap = 'round';
  for (let i = 0; i < 2400; i++) {
    const px = rf() * w, py = rf() * h;
    const ang = rf() < .78 ? (rf() - .5) * .5 : Math.PI / 2 + (rf() - .5) * .4;
    const len = 8 + rf() * 54, chiaro = rf() < .55;
    x.strokeStyle = chiaro ? rgba(P.luce, .05 + rf() * .07) : rgba(P.bruno, .04 + rf() * .07);
    x.lineWidth = .5 + rf() * .9; x.beginPath(); x.moveTo(px, py); x.lineTo(px + Math.cos(ang) * len, py + Math.sin(ang) * len); x.stroke();
  }
  // ciottoli appena accennati (griglia sfalsata, ellissi in 3/4)
  const rc = rng(8);
  for (let gy = 8; gy < h + 20; gy += 26) {
    for (let gx = (((gy / 26) | 0) % 2 ? 18 : 0); gx < w + 36; gx += 36) {
      const cx = gx + (rc() - .5) * 10, cy = gy + (rc() - .5) * 6, rx = 11 + rc() * 5, ry = 6 + rc() * 3;
      x.beginPath(); x.ellipse(cx, cy, rx, ry, (rc() - .5) * .3, 0, TAU); x.fillStyle = rgba(P.bruno, .035 + rc() * .035); x.fill();
      x.beginPath(); x.ellipse(cx - 1, cy - 1.5, rx * .8, ry * .7, 0, Math.PI * 1.05, Math.PI * 1.95); x.strokeStyle = rgba(P.luce, .07); x.lineWidth = 1; x.stroke();
      x.beginPath(); x.ellipse(cx + 1, cy + 1.5, rx * .85, ry * .75, 0, Math.PI * .05, Math.PI * .95); x.strokeStyle = rgba(P.ink, .07); x.lineWidth = 1; x.stroke();
    }
  }
  // occlusione lungo i muri: il nord proietta di più (la parete è alta), il sinistro per la luce di chiave
  const ao = (x0, y0, x1, y1, a) => { const gg = x.createLinearGradient(x0, y0, x1, y1); gg.addColorStop(0, rgba(P.ink, a)); gg.addColorStop(1, rgba(P.ink, 0)); x.fillStyle = gg; x.fillRect(0, 0, w, h); };
  ao(0, 0, 0, 78, V.bordoFloor); ao(0, h, 0, h - 42, V.bordoFloor * .7); ao(0, 0, 52, 0, V.bordoFloor * .85); ao(w, 0, w - 46, 0, V.bordoFloor * .7);
  return c;
}

/* =====================================================================
   PRECALCOLO 2 — il fondale di Piazza Dante oltre la parete di fondo
   ===================================================================== */
function creaFondale() {
  const FH = 360; const [c, x] = nuovoCanvas(W, FH);
  const s = V.scalaFondale, yG = wallTop + 54 * s;     // linea di terra della piazza (dietro il muro)
  // cielo di carta: bruno in alto, luce solo all'orizzonte
  const sky = x.createLinearGradient(0, 0, 0, yG);
  sky.addColorStop(0, '#1a0b04'); sky.addColorStop(.3, '#36180a'); sky.addColorStop(.62, '#6a3312'); sky.addColorStop(.86, '#a85f22'); sky.addColorStop(1, '#c98a3c');
  x.fillStyle = sky; x.fillRect(0, 0, W, yG);
  const terra = x.createLinearGradient(0, yG, 0, FH); terra.addColorStop(0, '#4a2109'); terra.addColorStop(1, '#120803');
  x.fillStyle = terra; x.fillRect(0, yG, W, FH - yG);
  // fibre della carta del cielo
  {
    const pw = Math.round(W * DPR), ph = Math.round(yG * DPR); const n = rumore(pw, ph, 2, [{ cx: 120 * DPR, cy: 3 * DPR, amp: .6 }, { cx: 60 * DPR, cy: 2 * DPR, amp: .4 }]);
    const id = x.createImageData(pw, ph), d = id.data;
    for (let i = 0, p = 0; i < pw * ph; i++, p += 4) { const v = n[i]; if (v > 0) { d[p] = 255; d[p + 1] = 205; d[p + 2] = 140; d[p + 3] = v * 70; } else { d[p] = 40; d[p + 1] = 15; d[p + 2] = 4; d[p + 3] = -v * 50; } }
    const [t, tx] = nuovoCanvas(W, yG); tx.putImageData(id, 0, 0); x.drawImage(t, 0, 0, W, yG);
  }
  x.save(); x.translate(640, yG); x.scale(s, s);
  // alone caldo dietro la Reggia
  const hot = x.createRadialGradient(0, -60, 0, 0, -60, 330); hot.addColorStop(0, 'rgba(255,225,160,.55)'); hot.addColorStop(.5, 'rgba(255,207,122,.22)'); hot.addColorStop(1, 'rgba(255,225,160,0)');
  x.save(); x.scale(1, .36); x.fillStyle = hot; x.beginPath(); x.arc(0, -60 / .36, 330, 0, TAU); x.fill(); x.restore();
  // luna crema, ferma, in alto a sinistra
  {
    const mx = -150, my = -104, r = 19;
    const halo = x.createRadialGradient(mx, my, 0, mx, my, r * 3.6); halo.addColorStop(0, 'rgba(255,246,220,.8)'); halo.addColorStop(.35, 'rgba(255,233,180,.28)'); halo.addColorStop(1, 'rgba(255,233,180,0)');
    x.fillStyle = halo; x.beginPath(); x.arc(mx, my, r * 3.6, 0, TAU); x.fill();
    x.fillStyle = '#fff4d6'; x.beginPath(); x.arc(mx, my, r, 0, TAU); x.fill();
    x.fillStyle = 'rgba(231,207,156,.35)'; x.beginPath(); x.arc(mx - 6, my - 5, 3.4, 0, TAU); x.arc(mx + 6, my + 4, 4.4, 0, TAU); x.fill(); x.beginPath(); x.arc(mx - 3, my + 7, 2, 0, TAU); x.fill();
  }
  x.restore();
  // ---- strato lontano: colline + Reggia (sfocato) ----
  {
    const [f, fx] = nuovoCanvas(W, FH); fx.translate(640, yG); fx.scale(s, s);
    fx.fillStyle = 'rgba(78,38,16,.7)'; fx.beginPath(); fx.moveTo(-300, -30); fx.bezierCurveTo(-180, -78, -40, -92, 90, -84); fx.bezierCurveTo(200, -78, 270, -66, 320, -46); fx.lineTo(320, 0); fx.lineTo(-300, 0); fx.closePath(); fx.fill();
    fx.fillStyle = '#2a1206';
    fx.fillRect(-124, -70, 248, 70); fx.fillRect(-128, -73, 256, 4); fx.fillRect(-30, -84, 60, 14); fx.fillRect(-122, -78, 16, 6); fx.fillRect(106, -78, 16, 6);
    fx.beginPath(); fx.moveTo(-36, -84); fx.lineTo(0, -100); fx.lineTo(36, -84); fx.closePath(); fx.fill();
    fx.fillStyle = 'rgba(243,197,122,.78)';
    for (let wx = -114; wx <= 110; wx += 13) { if (Math.abs(wx) < 10) continue; fx.fillRect(wx, -62, 4, 7); fx.fillRect(wx, -46, 4, 7); }
    fx.fillRect(-5, -34, 10, 16);
    x.filter = `blur(${V.blurFar}px)`; x.drawImage(f, 0, 0, W, FH); x.filter = 'none';
    // l'alone si rimette sopra: la Reggia si scioglie nella luce
    x.save(); x.translate(640, yG); x.scale(s, s);
    const h2 = x.createRadialGradient(0, -62, 0, 0, -62, 120); h2.addColorStop(0, 'rgba(255,225,160,.5)'); h2.addColorStop(1, 'rgba(255,225,160,0)');
    x.fillStyle = h2; x.beginPath(); x.arc(0, -62, 120, 0, TAU); x.fill(); x.restore();
  }
  // ---- strato medio: pini a ombrello e case basse (sfocato poco) ----
  function pino(gx, px, py, k) {
    gx.save(); gx.translate(px - 40 * k, py - 100 * k); gx.scale(k, k);
    gx.beginPath(); gx.moveTo(39, 44); gx.bezierCurveTo(37, 58, 41, 72, 37, 100); gx.lineTo(43, 100); gx.bezierCurveTo(45, 72, 42, 58, 44, 44); gx.closePath(); gx.fill();
    gx.beginPath(); gx.moveTo(41, 52); gx.bezierCurveTo(47, 47, 53, 47, 58, 42); gx.lineTo(59.5, 44.5); gx.bezierCurveTo(54, 49, 48, 50, 42.5, 55); gx.closePath(); gx.fill();
    gx.beginPath(); gx.moveTo(3, 42); gx.bezierCurveTo(8, 30, 16, 20, 26, 18); gx.bezierCurveTo(30, 8, 40, 3, 48, 9); gx.bezierCurveTo(56, 5, 66, 10, 70, 20); gx.bezierCurveTo(76, 22, 80, 30, 78, 40); gx.bezierCurveTo(72, 36, 64, 42, 56, 38); gx.bezierCurveTo(48, 44, 40, 38, 32, 42); gx.bezierCurveTo(24, 38, 14, 45, 3, 42); gx.closePath(); gx.fill();
    gx.beginPath(); gx.moveTo(10, 44); gx.bezierCurveTo(20, 37, 30, 40, 40, 36); gx.bezierCurveTo(50, 40, 60, 37, 72, 43); gx.lineTo(66, 48); gx.bezierCurveTo(56, 44, 48, 48, 40, 45); gx.bezierCurveTo(32, 48, 24, 44, 14, 48); gx.closePath(); gx.fill();
    gx.restore();
  }
  {
    const [m, mx] = nuovoCanvas(W, FH); mx.translate(640, yG); mx.scale(s, s); mx.fillStyle = '#2c1406';
    mx.beginPath(); mx.moveTo(-200, 0); mx.lineTo(-200, -34); mx.lineTo(-170, -46); mx.lineTo(-140, -34); mx.lineTo(-140, -40); mx.lineTo(-100, -40); mx.lineTo(-100, 0); mx.closePath(); mx.fill();
    mx.beginPath(); mx.moveTo(100, 0); mx.lineTo(100, -36); mx.lineTo(136, -50); mx.lineTo(172, -36); mx.lineTo(172, -42); mx.lineTo(206, -42); mx.lineTo(206, 0); mx.closePath(); mx.fill();
    mx.fillStyle = 'rgba(240,180,90,.85)'; mx.fillRect(-168, -28, 6, 9); mx.fillRect(130, -30, 6, 9);
    mx.fillStyle = '#1c0d05'; pino(mx, -182, -4, .92); pino(mx, 176, 0, 1.0); pino(mx, 60, 6, .55);
    x.filter = `blur(${V.blurMid}px)`; x.drawImage(m, 0, 0, W, FH); x.filter = 'none';
  }
  // ---- palazzi neoclassici con finestre accese e busti ----
  x.save(); x.translate(640, yG); x.scale(s, s);
  const L = -(640 / s) - 30, R = (640 / s) + 30;
  const facciate = [{ x0: L, x1: -210 }, { x0: 210, x1: R }];
  const finestre = [];
  for (const f of facciate) {
    const n = Math.max(2, Math.round((f.x1 - f.x0 - 40) / 66));
    for (let i = 0; i < n; i++) finestre.push({ x: f.x0 + 30 + i * ((f.x1 - f.x0 - 60) / Math.max(1, n - 1)) - 10, y: -104, tipo: i % 4 });
  }
  // aloni dietro le finestre
  for (const f of finestre) { const g = x.createRadialGradient(f.x + 10, f.y + 16, 2, f.x + 10, f.y + 16, 34); g.addColorStop(0, 'rgba(255,178,74,.34)'); g.addColorStop(1, 'rgba(255,178,74,0)'); x.fillStyle = g; x.fillRect(f.x - 30, f.y - 30, 80, 90); }
  for (const f of facciate) {
    x.fillStyle = '#160c05'; x.fillRect(f.x0, -190, f.x1 - f.x0, 190);
    x.fillRect(f.x0 - 6, -120, f.x1 - f.x0 + 12, 9);           // cornicione
    x.fillStyle = 'rgba(90,42,14,.6)'; x.fillRect(f.x0 - 6, -111, f.x1 - f.x0 + 12, 1.2); // spessore della carta del cornicione
    x.fillStyle = '#160c05'; x.fillRect(f.x0 - 3, -66, f.x1 - f.x0 + 6, 3);              // marcapiano
    // portici: archi scuri, uno acceso
    const n = Math.round((f.x1 - f.x0) / 70); let k = 0;
    for (let ax = f.x0 + 22; ax + 44 < f.x1 - 10 && k < n; ax += 70, k++) {
      const acceso = (k === Math.floor(n / 2));
      if (acceso) { const g = x.createLinearGradient(0, -54, 0, 0); g.addColorStop(0, 'rgba(241,165,60,.55)'); g.addColorStop(1, 'rgba(241,165,60,.2)'); x.fillStyle = g; }
      else x.fillStyle = '#2e180a';
      x.beginPath(); x.moveTo(ax, 0); x.lineTo(ax, -32); x.arc(ax + 22, -32, 22, Math.PI, 0); x.lineTo(ax + 44, 0); x.closePath(); x.fill();
    }
    // finestre del sottotetto (si vede solo il davanzale)
