  g.beginPath(); pts.forEach((z, i) => i ? g.lineTo(z[0], z[1]) : g.moveTo(z[0], z[1])); g.closePath(); g.fillStyle = 'rgba(255,255,255,.3)'; g.fill(); g.lineWidth = 3; g.strokeStyle = 'rgba(255,255,255,.9)'; g.stroke();
}
function anelloParata(g, f) {
  const u = (S.t - f.t0) / f.dur, x = sx(f.x), y = sy(f.y) - 22, r = lerp(14, 78, 1 - Math.pow(1 - u, 2)), al = 1 - u;
  g.save(); g.translate(x, y);
  g.lineWidth = lerp(7, 1.5, u); g.strokeStyle = 'rgba(255,255,255,' + al + ')'; g.beginPath(); g.arc(0, 0, r, 0, TAU); g.stroke();
  g.lineWidth = 3; g.strokeStyle = 'rgba(255,255,255,' + (al * .9) + ')';
  for (let i = 0; i < 10; i++) { const a = i / 10 * TAU + .3, r1 = r * .35, r2 = r * (.75 + (i % 2) * .5) * Math.min(1, u * 4 + .3); g.beginPath(); g.moveTo(Math.cos(a) * r1, Math.sin(a) * r1); g.lineTo(Math.cos(a) * r2, Math.sin(a) * r2); g.stroke(); }
  g.restore();
}
function anima(g, f) {
  const u = (S.t - f.t0) / f.dur, x = sx(f.x), y = sy(f.y) - 24 - u * 46;
  g.save(); g.globalAlpha = 1 - u; g.translate(x, y); poly(g, [[0, -10], [5, 0], [0, 8], [-5, 0]], C.azzurro, null); g.restore();
}

// ---------------------------------------------------------------- HUD
function rr(g, x, y, w, h, r) { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }
function hud(g) {
  const p = S.p;
  g.save();
  g.fillStyle = 'rgba(11,7,4,.88)'; rr(g, 20, 5, 420, 34, 8); g.fill(); g.lineWidth = 2; g.strokeStyle = C.oro; g.stroke(); g.lineWidth = 1; g.strokeStyle = C.bruno; rr(g, 24, 9, 412, 26, 6); g.stroke();
  for (let i = 0; i < P.maschere_max; i++) {
    g.save(); g.translate(46 + i * 27, 23); g.beginPath(); g.moveTo(0, -10); g.bezierCurveTo(9, -2, 9, 9, 0, 9); g.bezierCurveTo(-9, 9, -9, -2, 0, -10); g.closePath();
    if (i < p.maschere) { g.fillStyle = C.crema; g.fill(); g.lineWidth = 1.4; g.strokeStyle = C.ink; g.stroke(); } else { g.lineWidth = 1.6; g.strokeStyle = 'rgba(244,227,189,.5)'; g.stroke(); }
    g.restore();
  }
  const fr = p.cariche > 0 ? 1 : p.ricarica / P.t_ricarica_scatto;
  g.save(); g.translate(204, 22); g.beginPath(); g.arc(0, 0, 11, 0, TAU); g.fillStyle = '#1b0f07'; g.fill(); g.lineWidth = 1.6; g.strokeStyle = C.oro; g.stroke();
  g.lineCap = 'round'; g.strokeStyle = C.rosso; g.lineWidth = 4; g.beginPath(); g.arc(0, 0, 6, -PI / 2, -PI / 2 + TAU * Math.max(.02, fr)); g.stroke();
  g.lineWidth = 2.6; g.beginPath(); const ta = -PI / 2 + TAU * fr; g.moveTo(Math.cos(ta) * 6, Math.sin(ta) * 6); g.quadraticCurveTo(Math.cos(ta) * 12 + 8 * (1 - fr), Math.sin(ta) * 12 - 6, 22 + 10 * (1 - fr), -2 + 8 * (1 - fr)); g.stroke(); g.restore();
  const vivi = S.gatti.filter(c => c.stato !== 'morto').length;
  g.font = '700 15px Georgia, serif'; g.letterSpacing = '3px'; g.fillStyle = C.crema; g.textBaseline = 'middle'; g.fillText('GATTI ' + vivi + '/' + S.gatti.length, 262, 23);
  g.letterSpacing = '1px'; g.font = '13px Georgia, serif'; g.textAlign = 'center'; g.fillStyle = 'rgba(244,227,189,.82)'; g.textBaseline = 'alphabetic';
  g.fillText('WASD/FRECCE muovi  ·  J o Z fendente (tieni = affondo)  ·  K o X parata  ·  SPAZIO o MAIUSC scatto  ·  R ricomincia', 640, 690);
  g.restore();
}
function cartiglio(g) {
  const m = S.m, pulita = S.fase === 'pulita', x = 340, y = 190, w = 600, h = 330;
  g.save(); g.fillStyle = 'rgba(11,7,4,.93)'; rr(g, x, y, w, h, 16); g.fill(); g.lineWidth = 4; g.strokeStyle = C.oro; g.stroke(); g.lineWidth = 1.5; g.strokeStyle = C.bruno; rr(g, x + 8, y + 8, w - 16, h - 16, 11); g.stroke();
  g.textAlign = 'center'; g.fillStyle = C.crema; g.font = '700 30px Georgia, serif'; g.letterSpacing = '5px'; g.fillText(pulita ? 'STANZA PULITA' : 'LA NOTTE FINISCE', 640, y + 62);
  g.font = '19px Georgia, serif'; g.letterSpacing = '1px'; const fm = v => v.toFixed(1).replace('.', ',');
  const righe = [['Tempo', fm(m.tempo_ms / 1000) + ' s'], ['Maschere perse', String(m.maschere_perse)], ['Parate riuscite / mancate', m.parate_riuscite + ' / ' + m.parate_mancate], ['Colpi dati', String(m.colpi_dati)], ['Gatti', m.uccisioni + ' su ' + S.gatti.length]];
  righe.forEach((r, i) => { g.textAlign = 'left'; g.fillStyle = 'rgba(244,227,189,.8)'; g.fillText(r[0], x + 70, y + 118 + i * 31); g.textAlign = 'right'; g.fillStyle = C.crema; g.fillText(r[1], x + w - 70, y + 118 + i * 31); });
  g.textAlign = 'center'; g.fillStyle = C.oro; g.font = '700 20px Georgia, serif'; g.letterSpacing = '4px'; g.fillText('R PER RIGIOCARE', 640, y + h - 34);
  g.restore();
}

// ---------------------------------------------------------------- ciclo principale
let last = performance.now(), acc = 0;
function frame(now) {
  const d = Math.min(100, now - last); last = now;
  if (!paused) { acc += d; while (acc >= DT) { step(DT); acc -= DT; } }
  render(); requestAnimationFrame(frame);
}

// ---------------------------------------------------------------- banco di prova (misure)
function simula(o) {
  o = o || {};
  const salva = {}, pr = Object.assign({}, o.params || {});
  if (o.reazione != null) pr.reazione_bot = o.reazione; if (o.auto != null) pr.auto = o.auto;
  for (const k in pr) { salva[k] = P[k]; P[k] = pr[k]; }
  const oldBot = botOn, oldT = tentativo, oldS = S; botOn = true; tentativo = o.seme || 1; nuovaStanza();
  while (S.fase === 'gioco' && S.t < (o.max || 120000)) step(DT);
  const m = S.m, r = Object.assign({}, m, { fase: S.fase, tempo_ms: m.tempo_ms || Math.round(S.t), log: S.log });
  for (const k in salva) P[k] = salva[k]; botOn = oldBot; tentativo = oldT; S = oldS;
  return r;
}
function scenarioProva(o) {
  const old = {}, pr = o.params || {}; for (const k in pr) { old[k] = P[k]; P[k] = pr[k]; }
  const oldBot = botOn; botOn = false; Inp.muovi = o.muovi || { x: 0, y: 0 }; Inp.scriptHeld = false; Inp.edge = {}; Inp.atkKeys.clear();
  const oldS = S, oldT = tentativo; tentativo = 1;
  nuovaStanza({ test: true, px: o.px != null ? o.px : 300, py: o.py != null ? o.py : 224, gatti: o.gatti });
  if (o.cariche != null) S.p.cariche = o.cariche;
  S.copione = (o.copione || []).slice().sort((a, b) => a.t - b.t);
  const fine = o.fine || 1600;
  while (S.t < fine && S.fase === 'gioco') step(DT);
  const res = { log: S.log, m: S.m, p: S.p, gatti: S.gatti };
  for (const k in old) P[k] = old[k]; botOn = oldBot; Inp.muovi = null; Inp.scriptHeld = false; Inp.edge = {};
  tentativo = oldT; S = oldS;
  return res;
}
function provaParata(delta) {
  const g = [{ x: 420, y: 224, stato: 'accucciato' }];
  const r0 = scenarioProva({ gatti: g, fine: 1500 }); const T = r0.log.find(e => e.tipo === 'impatto').t;
  const r1 = scenarioProva({ gatti: g, fine: 1700, cariche: 0, copione: [{ t: T - delta, az: 'parata' }, { t: T + 60, az: 'atk' }] });
  const e = r1.log.find(x => x.tipo === 'impatto'), st = r1.log.find(x => x.tipo === 'stordito_fine'), col = r1.log.find(x => x.tipo === 'colpo');
  return { delta, T_impatto: T, esito: e ? e.esito : 'nessun_impatto', maschere: r1.p.maschere, stordito_ms: st ? st.durata : null, cariche_dopo: r1.p.cariche, colpo_post_parata: col ? { danno: col.danno, vita: col.vita } : null };
}
function provaFendente(dist, extra) {
  const r = scenarioProva(Object.assign({ gatti: [{ x: 300 + dist, y: 224, stato: 'fermo' }], fine: 700, copione: [{ t: 8, az: 'atk' }] }, extra || {}));
  const col = r.log.find(e => e.tipo === 'colpo');
  return { dist, colpito: !!col, t_dopo_pressione: col ? col.t - 8 : null, danno: col ? col.danno : null };
}
function provaCombo(muovi) {
  const r = scenarioProva({ gatti: [{ x: 360, y: 224, stato: 'fermo', vita: 6 }], fine: 1200, muovi, copione: [{ t: 8, az: 'atk' }, { t: 208, az: 'atk' }, { t: 408, az: 'atk' }] });
  return { colpi: r.log.filter(e => e.tipo === 'colpo').map(e => ({ t: e.t, danno: e.danno, vita: e.vita })), archi: r.log.filter(e => e.tipo === 'arco').map(e => ({ t: e.t, n: e.n, arco: e.arco })), fendenti: r.log.filter(e => e.tipo === 'fendente').map(e => e.t) };
}
function provaAffondo() {
  const r = scenarioProva({ gatti: [{ x: 360, y: 224, stato: 'fermo', vita: 6 }], fine: 1200, copione: [{ t: 8, az: 'atk_giu' }, { t: 458, az: 'atk_su' }] });
  return { colpi: r.log.filter(e => e.tipo === 'colpo'), affondo: r.log.filter(e => e.tipo === 'affondo' || e.tipo === 'affondo_attivo') };
}
function provaScatto() {
  const r = scenarioProva({ gatti: [{ x: 420, y: 224, stato: 'accucciato' }], fine: 1500, copione: [{ t: 500, az: 'scatto' }] });
  return { esiti: r.log.filter(e => e.tipo === 'impatto' || e.tipo === 'schivata' || e.tipo === 'scatto').map(e => e.tipo + (e.esito ? ':' + e.esito : '') + '@' + e.t), maschere: r.p.maschere, schivate: r.m.schivate };
}

// ---------------------------------------------------------------- telemetria
window.__proto = {
  get stato() { const p = S.p; return { fase: S.fase, t: Math.round(S.t), hitstop: S.hitstop, giocatore: { x: p.x, y: p.y, stato: p.stato, fase: p.fase, tf: p.tf, maschere: p.maschere, cariche: p.cariche, invuln: p.invuln, controcolpo: p.controcolpo, colpo: p.colpo }, gatti: S.gatti.map(c => ({ id: c.id, x: c.x, y: c.y, stato: c.stato, t: Math.round(c.t), vita: c.vita })), mostraFine: S.mostraFine }; },
  get metriche() { return S.m; },
  get log() { return S.log; },
  premi(az) { const m = { fendente: 'atk', parata: 'parry', scatto: 'dash' }[az]; if (m) press(m); else if (az === 'ricomincia') { tentativo++; nuovaStanza(); } return !!m; },
  muovi(x, y) { Inp.muovi = (x == null) ? null : { x, y }; },
  scarica() { const t = S.log.map(e => JSON.stringify(e)).join('\n'); console.log(t); return t; },
  pausa(b) { paused = b !== false; }, bot(b) { botOn = b !== false; },
  avanza(ms) { for (let i = 0; i < ms / DT; i++) step(DT); render(); },
  disegna() { render(); },
  sim: { step: () => step(DT), get S() { return S; }, DT },
  simula, provaParata, provaFendente, provaCombo, provaAffondo, provaScatto, scenarioProva,
  nuova(seme) { if (seme != null) tentativo = seme; nuovaStanza(); render(); },
  PARAMETRI
};

costruisciSfondo();
nuovaStanza();
requestAnimationFrame(frame);
})();
