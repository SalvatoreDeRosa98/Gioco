# Scelte di lancio di Ferruccio (lette da Ferruccio.sh). Una riga per scelta, senza spazi attorno a «=».
#
# SDL_SCELTA=auto       sceglie da sé (predefinito): la SDL2 in dotazione se la console ha GLIBC 2.34 o
#                       più nuova, altrimenti la SDL2 della console (è il caso di ArkOS)
# SDL_SCELTA=sistema    sempre la SDL2 della console
# SDL_SCELTA=dotazione  sempre la SDL2 che viaggia col gioco (su ArkOS non si carica)
SDL_SCELTA=auto
