  // ===========================================================================
  // LOOP DI GIOCO E IA DIFFERENZIATA NEMICI/BOSS IN STILE THE BINDING OF ISAAC
  // ===========================================================================
  let tick = 0;
  function loop() {
    tick++;

    if (statoRun.fase === 'menu_selezione') {
      disegnaMenuSelezionePersonaggio(tick);
      requestAnimationFrame(loop);
      return;
    }

    const st = statoRun.stanzaCorrente;
    const inPausaUI = Boolean(statoRun.scambioPendente || statoRun.siparioAttivo);

    if (st && !inPausaUI) {
      let mx = 0, my = 0;
      if (keys.KeyA) mx -= 1;
      if (keys.KeyD) mx += 1;
      if (keys.KeyW) my -= 1;
      if (keys.KeyS) my += 1;

      player.moving = false;
      if (mx !== 0 || my !== 0) {
        const l = Math.hypot(mx, my);
        player.x = Math.max(ARENA.x1, Math.min(ARENA.x2, player.x + (mx / l) * statoRun.speed));
        player.y = Math.max(ARENA.y1, Math.min(ARENA.y2, player.y + (my / l) * statoRun.speed));
        if (mx !== 0) player.flipX = mx < 0;
        player.moving = true;
      } else if (player.targetX !== null && player.targetY !== null) {
        const dx = player.targetX - player.x;
        const dy = player.targetY - player.y;
        const d = Math.hypot(dx, dy);
        if (d > 4) {
          player.x = Math.max(ARENA.x1, Math.min(ARENA.x2, player.x + (dx / d) * statoRun.speed));
          player.y = Math.max(ARENA.y1, Math.min(ARENA.y2, player.y + (dy / d) * statoRun.speed));
          player.flipX = dx < 0;
          player.moving = true;
        } else {
          player.targetX = null;
          player.targetY = null;
        }
      }

      if (player.cooldown > 0) player.cooldown--;
      if (player.shootAnimTimer > 0) player.shootAnimTimer--;
      if (player.pickupTimer > 0) player.pickupTimer--;
      if (player.invuln > 0) player.invuln--;

      if (st.oggettiATerra && st.oggettiATerra.length > 0) {
        for (let i = st.oggettiATerra.length - 1; i >= 0; i--) {
          const pk = st.oggettiATerra[i];
          if (Math.hypot(player.x - pk.x, player.y - pk.y) < 20) {
            if (pk.tipo === 'moneta') {
              statoRun.monete = Math.min(99, statoRun.monete + pk.valore);
              st.oggettiATerra.splice(i, 1);
            } else if (pk.tipo === 'cura' && statoRun.hpHalf < statoRun.maxHpHalf) {
              statoRun.hpHalf = Math.min(statoRun.maxHpHalf, statoRun.hpHalf + pk.valore);
              st.oggettiATerra.splice(i, 1);
            }
          }
        }
      }

      if (keys.ArrowRight || keys.KeyL) eseguiAttacco4Direzioni(1, 0);
      else if (keys.ArrowLeft || keys.KeyJ) eseguiAttacco4Direzioni(-1, 0);
      else if (keys.ArrowUp || keys.KeyI) eseguiAttacco4Direzioni(0, -1);
      else if (keys.ArrowDown || keys.KeyK) eseguiAttacco4Direzioni(0, 1);

      const posMuroSegreto = {
        N: { x: 320, y: ARENA.y1 },
        S: { x: 320, y: ARENA.y2 },
        W: { x: ARENA.x1, y: 188 },
        E: { x: ARENA.x2, y: 188 },
      };

      // Fendente di Spada animato in 6 frame
      if (player.swordAnimTick >= 0) {
        const frameIdx = Math.floor(player.swordAnimTick / 3);
        if (frameIdx >= 1 && frameIdx <= 4) {
          const reach = 38;
          const hx = player.x + Math.cos(player.swordAngle) * 20;
          const hy = (player.y - 6) + Math.sin(player.swordAngle) * 20;
          if (st.muroSegreto && !st.muroSegreto.aperto) {
            const pm = posMuroSegreto[st.muroSegreto.lato];
            if (pm && Math.hypot(hx - pm.x, hy - pm.y) <= reach + 16) {
              apriMuroSegreto(st);
            }
          }
          for (const nem of st.nemici) {
            if (nem.hp <= 0 || (nem.airZ || 0) > 16 || player.swordHitIds.has(nem.id)) continue;
            if (Math.hypot(nem.x - hx, (nem.y - 6) - hy) <= reach + nem.r) {
              player.swordHitIds.add(nem.id);
              danneggiaNemico(nem, statoRun.dmg, Math.cos(player.swordAngle), Math.sin(player.swordAngle));
            }
          }
          for (let i = statoRun.proiettiliNemici.length - 1; i >= 0; i--) {
            const pr = statoRun.proiettiliNemici[i];
            if (Math.hypot(pr.x - hx, pr.y - hy) <= reach * 0.85) {
              statoRun.effettiSplash.push({ x: pr.x, y: pr.y, tick: 0 });
              statoRun.proiettiliNemici.splice(i, 1);
            }
          }
        }
        player.swordAnimTick++;
        if (player.swordAnimTick >= 18) player.swordAnimTick = -1;
      }

      // Proiettili di Ferruccio
      for (let i = statoRun.proiettili.length - 1; i >= 0; i--) {
        const p = statoRun.proiettili[i];
        p.x += p.vx;
        p.y += p.vy;
        p.dist += Math.hypot(p.vx, p.vy);

        if (st.muroSegreto && !st.muroSegreto.aperto) {
          const pm = posMuroSegreto[st.muroSegreto.lato];
          if (pm && Math.hypot(p.x - pm.x, p.y - pm.y) < 26) {
            apriMuroSegreto(st);
            statoRun.effettiSplash.push({ x: p.x, y: p.y, tick: 0 });
            statoRun.proiettili.splice(i, 1);
            continue;
          }
        }

        let rimuovi = p.dist >= p.maxDist || p.x < ARENA.x1 - 8 || p.x > ARENA.x2 + 8 || p.y < ARENA.y1 - 8 || p.y > ARENA.y2 + 8;

        for (const nem of st.nemici) {
          if (nem.hp <= 0 || (nem.airZ || 0) > 16 || p.hitIds.has(nem.id)) continue;
          if (Math.hypot(nem.x - p.x, (nem.y - 6) - p.y) <= nem.r + p.r) {
            p.hitIds.add(nem.id);
            const hpPrima = nem.hp;
            const l = Math.hypot(p.vx, p.vy) || 1;
            danneggiaNemico(nem, p.dmg, p.vx / l, p.vy / l);
            statoRun.effettiSplash.push({ x: p.x, y: p.y, tick: 0 });
            if (p.piercing) {
              // Continua
            } else if (p.overflowPierce && p.dmg > hpPrima) {
              p.dmg -= hpPrima;
            } else {
              rimuovi = true;
              break;
            }
          }
        }
        if (rimuovi) {
          if (p.dist >= p.maxDist) statoRun.effettiSplash.push({ x: p.x, y: p.y, tick: 0 });
          statoRun.proiettili.splice(i, 1);
        }
      }

      // Proiettili Nemici
      const dannoBasePiano = statoRun.piano >= 3 ? 2 : 1;
      for (let i = statoRun.proiettiliNemici.length - 1; i >= 0; i--) {
        const pr = statoRun.proiettiliNemici[i];
        pr.x += pr.vx;
        pr.y += pr.vy;
        pr.dist += Math.hypot(pr.vx, pr.vy);
        if (Math.hypot(player.x - pr.x, (player.y - 6) - pr.y) < 9 && player.invuln <= 0) {
          statoRun.effettiSplash.push({ x: pr.x, y: pr.y, tick: 0 });
          statoRun.proiettiliNemici.splice(i, 1);
          subisciColpoGiocatore(pr.bossShot ? 2 : dannoBasePiano, 'un proiettile del Velo');
          if (statoRun.hpHalf <= 0) break;
          continue;
        }
        if (pr.dist > 250 || pr.x < ARENA.x1 - 8 || pr.x > ARENA.x2 + 8 || pr.y < ARENA.y1 - 8 || pr.y > ARENA.y2 + 8) {
          statoRun.effettiSplash.push({ x: pr.x, y: pr.y, tick: 0 });
          statoRun.proiettiliNemici.splice(i, 1);
        }
      }

      // Passaggio porte aperte
      if (st.pulita) {
        const opp = { N: 'S', S: 'N', W: 'E', E: 'W' };
        if (st.porte.N && player.y <= ARENA.y1 + 5 && Math.abs(player.x - 320) < 26) {
          entraInStanza(statoRun.mappa.perId.get(st.porte.N), opp.N);
        } else if (st.porte.S && player.y >= ARENA.y2 - 5 && Math.abs(player.x - 320) < 26) {
          entraInStanza(statoRun.mappa.perId.get(st.porte.S), opp.S);
        } else if (st.porte.W && player.x <= ARENA.x1 + 5 && Math.abs(player.y - 188) < 26) {
          entraInStanza(statoRun.mappa.perId.get(st.porte.W), opp.W);
        } else if (st.porte.E && player.x >= ARENA.x2 - 5 && Math.abs(player.y - 188) < 26) {
          entraInStanza(statoRun.mappa.perId.get(st.porte.E), opp.E);
        }
      }

      // 6. IA DIFFERENZIATA NEMICI E BOSS IN STILE THE BINDING OF ISAAC
      for (const n of st.nemici) {
        if (n.hp <= 0) continue;
        if (n.flash > 0) n.flash--;
        if (n.burnTicks > 0) {
          n.burnTicks--;
          if (n.burnTicks % 20 === 0) {
            danneggiaNemico(n, 1.2, 0, 0);
            if (n.hp <= 0) continue;
          }
        }
        if (n.stunTicks > 0) {
          n.stunTicks--;
          continue;
        }

        const ang = Math.atan2(player.y - n.y, player.x - n.x);
        const distPlayer = Math.hypot(player.x - n.x, player.y - n.y);

        if (n.boss) {
          n.phaseTick = (n.phaseTick || 0) + 1;
          const enrage = n.hp < n.maxHp * 0.5;

          if (n.bossId === 're-gatto') {
            // MONSTRO (Re Gatto): saltelli + grande balzo in aria (airZ > 0) con schianto e rosa caotica di 14 colpi
            if (n.jumpPhase === 'air') {
              n.jumpTimer--;
              n.airZ = Math.round(Math.sin((1 - n.jumpTimer / 44) * Math.PI) * 95);
              n.x += (n.jumpTargetX - n.x) * 0.09;
              n.y += (n.jumpTargetY - n.y) * 0.09;
              if (n.jumpTimer <= 0) {
                n.jumpPhase = 'ground';
                n.airZ = 0;
                statoRun.scossa = 8;
                statoRun.ondeEsplosione.push({ x: n.x, y: n.y, r: 8, maxR: 48, tick: 0 });
                for (let k = 0; k < 14; k++) {
                  const a = (TAU * k) / 14 + (rng() - 0.5) * 0.22;
                  const sp = 1.65 + rng() * 0.95;
                  statoRun.proiettiliNemici.push({ x: n.x, y: n.y - 6, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, dist: 0, bossShot: true });
                }
                n.shootCd = enrage ? 42 : 56;
              }
            } else {
              n.x = Math.max(ARENA.x1 + 20, Math.min(ARENA.x2 - 20, n.x + Math.cos(ang) * n.speed * 0.65));
              n.y = Math.max(ARENA.y1 + 20, Math.min(ARENA.y2 - 20, n.y + Math.sin(ang) * n.speed * 0.65));
              n.shootCd--;
              if (n.shootCd <= 0) {
                if (n.phaseTick % 2 === 0) {
                  n.jumpPhase = 'air';
                  n.jumpTimer = 44;
                  n.jumpTargetX = Math.max(ARENA.x1 + 28, Math.min(ARENA.x2 - 28, player.x));
                  n.jumpTargetY = Math.max(ARENA.y1 + 28, Math.min(ARENA.y2 - 28, player.y));
                } else {
                  for (let k = -3; k <= 3; k++) {
                    const a = ang + k * 0.14;
                    statoRun.proiettiliNemici.push({ x: n.x, y: n.y - 6, vx: Math.cos(a) * 2.25, vy: Math.sin(a) * 2.25, dist: 0, bossShot: true });
                  }
                  n.shootCd = enrage ? 38 : 52;
                }
              }
            }
          } else if (n.bossId === 'capitano-guardia') {
            // CHUB (Capitano di Piombo): carica rettilinea ad alta velocità da parete a parete!
            if (n.charging && n.chargeTimer > 0) {
              n.chargeTimer--;
              n.x = Math.max(ARENA.x1 + 18, Math.min(ARENA.x2 - 18, n.x + n.vx));
              n.y = Math.max(ARENA.y1 + 18, Math.min(ARENA.y2 - 18, n.y + n.vy));
              if (n.x <= ARENA.x1 + 19 || n.x >= ARENA.x2 - 19 || n.y <= ARENA.y1 + 19 || n.y >= ARENA.y2 - 19 || n.chargeTimer <= 0) {
                n.charging = false;
                statoRun.scossa = 6;
                for (let k = 0; k < 8; k++) {
                  const a = (TAU * k) / 8;
                  statoRun.proiettiliNemici.push({ x: n.x, y: n.y - 6, vx: Math.cos(a) * 2.2, vy: Math.sin(a) * 2.2, dist: 0, bossShot: true });
                }
                n.shootCd = enrage ? 38 : 50;
              }
            } else {
              n.x = Math.max(ARENA.x1 + 18, Math.min(ARENA.x2 - 18, n.x + Math.cos(ang) * n.speed * 0.6));
              n.y = Math.max(ARENA.y1 + 18, Math.min(ARENA.y2 - 18, n.y + Math.sin(ang) * n.speed * 0.6));
              n.shootCd--;
              if (n.shootCd <= 0) {
                n.charging = true;
                n.chargeTimer = 38;
                const horiz = Math.abs(player.x - n.x) >= Math.abs(player.y - n.y);
                const cSpd = enrage ? 4.2 : 3.5;
                n.vx = horiz ? Math.sign(player.x - n.x || 1) * cSpd : 0;
                n.vy = horiz ? 0 : Math.sign(player.y - n.y || 1) * cSpd;
              }
            }
          } else if (n.bossId === 'regina-vespa') {
            // DUKE OF FLIES (Regina Vespa): rimbalza in diagonale sui muri ed evoca Vespe Cieche che volano addosso senza sparare
            n.x += n.vx || 1.1;
            n.y += n.vy || 0.85;
            if (n.x <= ARENA.x1 + 20 || n.x >= ARENA.x2 - 20) n.vx = -(n.vx || 1.1);
            if (n.y <= ARENA.y1 + 20 || n.y >= ARENA.y2 - 20) n.vy = -(n.vy || 0.85);
            n.x = Math.max(ARENA.x1 + 20, Math.min(ARENA.x2 - 20, n.x));
            n.y = Math.max(ARENA.y1 + 20, Math.min(ARENA.y2 - 20, n.y));
            n.shootCd--;
            if (n.shootCd <= 0) {
              n.shootCd = enrage ? 52 : 68;
              const nVespeVive = st.nemici.filter((m) => !m.boss && m.hp > 0).length;
              if (nVespeVive < 4) {
                st.nemici.push({
                  id: `spawn-vespa-${tick}`,
                  tipo: 'vespa_cieca',
                  nome: 'Vespa Cieca (Attack Fly)',
                  comportamento: 'volo_puro',
                  x: n.x + (rng() - 0.5) * 26,
                  y: n.y + (rng() - 0.5) * 20,
                  vx: 0, vy: 0,
                  r: 11,
                  hp: 8, maxHp: 8,
                  speed: 1.55,
                  shootCd: 999,
                  boss: false,
                  flash: 4,
                  burnTicks: 0,
                  stunTicks: 0,
                });
              }
              for (let k = 0; k < 8; k++) {
                const a = (TAU * k) / 8 + n.phaseTick * 0.25;
                statoRun.proiettiliNemici.push({ x: n.x, y: n.y - 6, vx: Math.cos(a) * 2.0, vy: Math.sin(a) * 2.0, dist: 0, bossShot: true });
              }
            }
          } else if (n.bossId === 'colosso-statua') {
            // GURDY (Colosso di Marmo): immobile al centro, spara spirali rotanti a 8 vie e genera Bozzoli Esplosivi
            n.x = 320;
            n.y = 165;
            n.shootCd--;
            if (n.shootCd <= 0) {
              n.shootCd = enrage ? 36 : 48;
              for (let k = 0; k < 8; k++) {
                const a = (TAU * k) / 8 + n.phaseTick * 0.28;
                statoRun.proiettiliNemici.push({ x: n.x, y: n.y - 8, vx: Math.cos(a) * 2.15, vy: Math.sin(a) * 2.15, dist: 0, bossShot: true });
              }
              const nBombe = st.nemici.filter((m) => m.tipo === 'bomba_ferma' && m.hp > 0).length;
              if (n.phaseTick % 3 === 0 && nBombe < 2) {
                st.nemici.push({
                  id: `spawn-bomba-${tick}`,
                  tipo: 'bomba_ferma',
                  nome: 'Bozzolo di Polvere',
                  comportamento: 'bomba_ferma',
                  x: 160 + rng() * 320,
                  y: 120 + rng() * 130,
                  vx: 0, vy: 0,
                  r: 12,
                  hp: 10, maxHp: 10,
                  speed: 0,
                  shootCd: 999,
                  boss: false,
                  flash: 4,
                  burnTicks: 0,
                  stunTicks: 0,
                  fuseTimer: 0,
                });
              }
            }
          } else if (n.bossId === 'donna-luciana') {
            // DONNA LUCIANA (Mom / Satan): le 2 Mani Giganti sparano ventagli + schianti + anelli rotanti
            n.x = Math.max(ARENA.x1 + 32, Math.min(ARENA.x2 - 32, n.x + Math.cos(ang) * n.speed * 0.55));
            n.y = Math.max(ARENA.y1 + 24, Math.min(ARENA.y2 - 24, n.y + Math.sin(ang) * n.speed * 0.55));
            n.shootCd--;
            if (n.shootCd <= 0) {
              n.shootCd = enrage ? 34 : 46;
              for (const handOffset of [-68, 68]) {
                const ha = Math.atan2(player.y - (n.y - 14), player.x - (n.x + handOffset));
                for (const da of [-0.25, 0, 0.25]) {
                  statoRun.proiettiliNemici.push({
                    x: n.x + handOffset, y: n.y - 14,
                    vx: Math.cos(ha + da) * 2.45, vy: Math.sin(ha + da) * 2.45,
                    dist: 0, bossShot: true,
                  });
                }
              }
              if (enrage || n.phaseTick % 2 === 0) {
                const nRing = 10;
                for (let k = 0; k < nRing; k++) {
                  const a = (TAU * k) / nRing + n.phaseTick * 0.3;
                  statoRun.proiettiliNemici.push({
                    x: n.x, y: n.y - 8,
                    vx: Math.cos(a) * 2.1, vy: Math.sin(a) * 2.1,
                    dist: 0, bossShot: true,
                  });
                }
              }
            }
          }
        } else {
          // IA DIFFERENZIATA DEI NEMICI COMUNI IN STILE THE BINDING OF ISAAC:
          const comp = n.comportamento || n.tipo;

          if (comp === 'volo_puro' || n.tipo === 'vespa_cieca') {
            // 1. VESPA CIECA (Attack Fly): vola dritta contro di te SENZA SPARARE!
            const osc = Math.sin(tick * 0.22 + n.x * 0.05) * 0.3;
            n.x = Math.max(ARENA.x1 + 12, Math.min(ARENA.x2 - 12, n.x + Math.cos(ang + osc) * n.speed));
            n.y = Math.max(ARENA.y1 + 12, Math.min(ARENA.y2 - 12, n.y + Math.sin(ang + osc) * n.speed));
          } else if (comp === 'bomba_ferma' || n.tipo === 'bomba_ferma') {
            // 2. BOZZOLO DI POLVERE (Mulliboom / Boil): STA FERMO sul posto, pulsa quando ti avvicini ed ESPLODE!
            if (distPlayer < 64 || n.fuseTimer > 0) {
              n.fuseTimer = (n.fuseTimer || 0) + 1;
              if (n.fuseTimer >= 42) {
                n.hp = 0;
                innescaEsplosioneBomba(st, n.x, n.y, n.nome);
                verificaStanzaPulita();
                continue;
              }
            }
          } else if (comp === 'balzo' || n.tipo === 'gatto') {
            // 3. GATTO DEL VELO (Trite / Hopper): NON spara! Si accovaccia (telegraph) e balza rapido verso di te
            if (n.leapTimer > 0) {
              n.leapTimer--;
              n.x = Math.max(ARENA.x1 + 14, Math.min(ARENA.x2 - 14, n.x + n.vx));
              n.y = Math.max(ARENA.y1 + 14, Math.min(ARENA.y2 - 14, n.y + n.vy));
            } else {
              n.shootCd--;
              if (n.shootCd <= 18 && n.shootCd > 0) {
                n.crouchTicks = n.shootCd;
              } else if (n.shootCd <= 0) {
                n.crouchTicks = 0;
                n.leapTimer = 18;
                const lSpd = 3.25;
                n.vx = Math.cos(ang) * lSpd;
                n.vy = Math.sin(ang) * lSpd;
                n.shootCd = 54 + Math.floor(rng() * 20);
              }
            }
          } else if (comp === 'host_scudo' || n.tipo === 'maschera') {
            // 4. MASCHERA CORAZZATA (Host): immobile e corazzata finché chiusa; si apre per sparare un ventaglio di 3 colpi!
            n.shootCd--;
            if (n.shootCd > 30) {
              n.maskOpen = false;
            } else if (n.shootCd === 30) {
              n.maskOpen = true;
              n.flash = 4;
            } else if (n.shootCd === 15) {
              n.maskOpen = true;
              for (const da of [-0.22, 0, 0.22]) {
                statoRun.proiettiliNemici.push({
                  x: n.x, y: n.y - 6,
                  vx: Math.cos(ang + da) * 2.25, vy: Math.sin(ang + da) * 2.25,
                  dist: 0,
                });
              }
            } else if (n.shootCd <= 0) {
              n.maskOpen = false;
              n.shootCd = 92;
            }
          } else if (comp === 'torretta_croce' || n.tipo === 'statua') {
            // 5. BUSTO DI MARMO (Stone Grimace): completamente FERMO sul posto, spara salve alternate a '+' e '×'
            n.shootCd--;
            if (n.shootCd <= 0) {
              n.shootCd = 76;
              n.salvoParity = ((n.salvoParity || 0) + 1) % 2;
              const baseRot = n.salvoParity === 0 ? 0 : Math.PI / 4;
              for (let k = 0; k < 4; k++) {
                const a = baseRot + (k * Math.PI) / 2;
                statoRun.proiettiliNemici.push({ x: n.x, y: n.y - 6, vx: Math.cos(a) * 2.05, vy: Math.sin(a) * 2.05, dist: 0 });
              }
            }
          } else {
            // 6. SOLDATO DI PIOMBO (Knight / Clotty): pattuglia ed esegue doppi colpi mirati
            n.x = Math.max(ARENA.x1 + 14, Math.min(ARENA.x2 - 14, n.x + Math.cos(ang) * n.speed * 0.72));
            n.y = Math.max(ARENA.y1 + 14, Math.min(ARENA.y2 - 14, n.y + Math.sin(ang) * n.speed * 0.72));
            n.shootCd--;
            if (n.shootCd <= 0) {
              n.shootCd = 68;
              for (const da of [-0.12, 0.12]) {
                statoRun.proiettiliNemici.push({ x: n.x, y: n.y - 6, vx: Math.cos(ang + da) * 2.3, vy: Math.sin(ang + da) * 2.3, dist: 0 });
              }
            }
          }
        }

        // Danno da contatto (solo se il boss non è in volo alto airZ > 20)
        if ((n.airZ || 0) < 20 && Math.hypot(player.x - n.x, player.y - n.y) < n.r + 9 && player.invuln <= 0) {
          subisciColpoGiocatore(n.boss ? 2 : dannoBasePiano, n.nome);
          if (statoRun.hpHalf <= 0) break;
        }
      }
    }

    // =========================================================================
    // RENDERING PITTORICO DARK-FAIRYTALE DELLA SCENA
    // =========================================================================
    if (statoRun.scossa > 0.2) statoRun.scossa *= 0.8;
    else statoRun.scossa = 0;

    ctx.save();
    if (statoRun.scossa > 0) {
      ctx.translate(Math.round(Math.sin(tick * 2.3) * statoRun.scossa), Math.round(Math.cos(tick * 2.9) * statoRun.scossa));
    }

    if (st) {
      disegnaStanzaPixelArt(tick, st);

      const brFrame = Math.floor(tick / 8) % 2 === 0 ? SPRITE_SCENA.braciere0 : SPRITE_SCENA.braciere1;
      for (const o of st.ostacoli) {
        const sp = o.tipo === 'braciere' ? brFrame : o.tipo === 'colonna' ? SPRITE_SCENA.colonna : SPRITE_SCENA.urna;
        drawPixelSprite(sp, o.x, o.y, 2);
      }

      if (st.oggettiATerra && st.oggettiATerra.length > 0) {
        for (const pk of st.oggettiATerra) {
          const bounce = Math.round(Math.sin(tick * 0.12 + pk.x) * 2);
          ctx.fillStyle = 'rgba(0,0,0,0.4)';
          ctx.fillRect(Math.round(pk.x - 5), Math.round(pk.y + 5), 10, 3);
          drawPixelSprite(SPRITE_OGGETTI[pk.sprite] || SPRITE_OGGETTI.moneta1, pk.x, pk.y + bounce, 1.8);
          if (pk.tipo === 'moneta' && pk.valore >= 3) {
            drawTextFit('3🪙', pk.x, pk.y - 9 + bounce, 28, { size: 7, color: '#67e8f9' });
          }
        }
      }

      if (st.pulita && st.oggettoPiedistallo) {
        const o = st.oggettoPiedistallo;
        const spPed = o.forteGratis ? SPRITE_SCENA.piedistalloOro : SPRITE_SCENA.piedistallo;
        drawPixelSprite(spPed, o.x, o.y + 8, 2);
        if (!o.preso) {
          const floatY = Math.round(Math.sin(tick * 0.08) * 3);
          drawPixelSprite(SPRITE_OGGETTI[o.sprite] || SPRITE_OGGETTI.spada, o.x, o.y - 12 + floatY, 2);
          const badge = o.forteGratis ? '★ FORTE GRATIS' : '🎁 OGGETTO GRATIS';
          drawPillLabel(`${badge}: ${o.nome} [Click/E]`, o.x, o.y - 28, 300, {
            size: 8,
            color: o.forteGratis ? '#f9cb40' : '#67e8f9',
            border: o.forteGratis ? '#f9cb40' : '#0891b2',
          });
          const pw = 336, ph = 30;
          const px = Math.max(82, Math.min(W - pw - 82, Math.round(o.x - pw / 2)));
          const py = Math.min(256, Math.round(o.y + 18));
          ctx.fillStyle = 'rgba(10, 6, 4, 0.92)';
          ctx.fillRect(px, py, pw, ph);
          ctx.strokeStyle = o.forteGratis ? '#f9cb40' : '#5c4024';
          ctx.lineWidth = 1;
          ctx.strokeRect(px, py, pw, ph);
          drawTextFit(o.statsDesc, px + pw / 2, py + 12, pw - 12, { size: 8, color: '#4ade80' });
          drawTextFit(`«${o.lore}»`, px + pw / 2, py + 24, pw - 12, { size: 7.5, style: 'italic', weight: '', color: '#e6d2aa' });
        }
      }

      // NOTA: Ferruccio NON ha il filo! Solo i nemici, i boss e Mastro Peppe hanno i fili d'oro!
      const fili = [];

      // La Fucina (⚒ Shop in stile The Binding of Isaac)
      if (st.tipo === 'fucina') {
        fili.push([320, 124]);
        const peppeFrame = Math.floor(tick / 14) % 2 === 0 ? SPRITE_SCENA.mercante : SPRITE_SCENA.mercante1;
        drawPixelSprite(peppeFrame, 320, 138, 1.9);
        drawPixelSprite(SPRITE_SCENA.incudine, 282, 146, 1.6);
        drawPixelSprite(brFrame, 210, 142, 1.7);
        drawPixelSprite(brFrame, 430, 142, 1.7);

        drawPillLabel(
          `⚒ LA FUCINA DI MASTRO PEPPE · SLOT EQUIPAGGIATI ${statoRun.oggettiEquipaggiati.length}/5 ⚒`,
          320,
          112,
          376,
          { size: 8, color: '#f9cb40', border: '#f9cb40' }
        );

        let slotVicino = null;
        let minDistSlot = 999;

        for (const sl of st.slotFucina) {
          const spPed = sl.tier === 'forte' ? SPRITE_SCENA.piedistalloOro : SPRITE_SCENA.piedistallo;
          drawPixelSprite(spPed, sl.x, sl.y + 10, 1.55);
          if (!sl.comprato) {
            const dPlayer = Math.hypot(player.x - sl.x, player.y - sl.y);
            if (dPlayer < minDistSlot) {
              minDistSlot = dPlayer;
              slotVicino = sl;
            }
            const floatY = Math.round(Math.sin(tick * 0.08 + sl.x) * 2);
            drawPixelSprite(SPRITE_OGGETTI[sl.sprite] || SPRITE_OGGETTI.cuore, sl.x, sl.y - 6 + floatY, 1.75);
            drawPillLabel(sl.nomeBreve || sl.nome, sl.x, sl.y - 20, 96, {
              size: 7.5,
              color: sl.tier === 'forte' ? '#f9cb40' : '#ffffff',
              border: sl.tier === 'forte' ? '#f9cb40' : '#5c4024',
            });
            if (sl.inSaldo) {
              drawPillLabel(`SALDI ${sl.prezzo}🪙!`, sl.x, sl.y + 27, 88, {
                size: 7.5, color: '#4ade80', border: '#22c55e',
              });
            } else {
              const puo = statoRun.monete >= sl.prezzo;
              drawPillLabel(`${sl.prezzo}🪙 [Click/E]`, sl.x, sl.y + 27, 92, {
                size: 7.5,
                color: puo ? '#f9cb40' : '#f87171',
                border: puo ? '#8a5a2b' : '#7f1d1d',
              });
            }
          } else {
            drawPillLabel('VENDUTO', sl.x, sl.y + 2, 72, { size: 7, color: '#64748b', border: '#334155' });
          }
        }

        if (slotVicino) {
          const bx = 132, by = 232, bw = 376, bh = 28;
          ctx.fillStyle = 'rgba(10, 6, 4, 0.94)';
          ctx.fillRect(bx, by, bw, bh);
          ctx.strokeStyle = slotVicino.tier === 'forte' ? '#f9cb40' : '#8a5a2b';
          ctx.lineWidth = 1;
          ctx.strokeRect(bx, by, bw, bh);
          drawTextFit(
            `${slotVicino.nome} (${slotVicino.prezzo}🪙)`,
            bx + bw / 2,
            by + 11,
            bw - 12,
            { size: 8, color: slotVicino.tier === 'forte' ? '#f9cb40' : '#ffffff' }
          );
          drawTextFit(
            slotVicino.statsDesc,
            bx + bw / 2,
            by + 23,
            bw - 12,
            { size: 7.5, color: '#4ade80' }
          );
        }
      }

      // PROPOSTA 2: Stanza del Patto d'Ombra (😈 Devil Room in stile Isaac)
      if (st.tipo === 'patto') {
        drawPillLabel(
          `😈 STANZA DEL PATTO D'OMBRA · SACRIFICA 1 MASCHERA INTERA (-1 ❤️ MAX) 😈`,
          320,
          106,
          410,
          { size: 8, color: '#f87171', border: '#ef4444' }
        );
        for (const p of (st.slotPatto || [])) {
          drawPixelSprite(SPRITE_SCENA.piedistalloOro, p.x, p.y + 10, 1.8);
          if (!p.comprato) {
            const floatY = Math.round(Math.sin(tick * 0.08 + p.x) * 3);
            drawPixelSprite(SPRITE_OGGETTI[p.sprite] || SPRITE_OGGETTI.anello, p.x, p.y - 8 + floatY, 1.9);
            drawPillLabel(p.nomeBreve || p.nome, p.x, p.y - 24, 150, {
              size: 8, color: '#fca5a5', border: '#ef4444',
            });
            drawPillLabel(`PATTO: -1 ❤️ MAX [Click/E]`, p.x, p.y + 28, 148, {
              size: 7.5, color: '#f87171', border: '#991b1b',
            });
            drawTextFit(p.statsDesc, p.x, p.y + 42, 170, { size: 7.5, color: '#4ade80' });
          } else {
            drawPillLabel('PATTO SIGILLATO', p.x, p.y + 2, 110, { size: 7.5, color: '#9ca3af', border: '#4b5563' });
          }
        }
        // Portale per tornare alla Stanza del Boss
        ctx.fillStyle = '#1f0910';
        ctx.strokeStyle = '#ef4444';
        ctx.lineWidth = 2;
        ctx.fillRect(280, 248, 80, 22);
        ctx.strokeRect(280, 248, 80, 22);
        drawTextFit('▲ TORNA AL BOSS [Click/E]', 320, 262, 140, { size: 7.5, color: '#fca5a5' });
      }

      // Botola del Boss + Porta di Velluto Cremisi del Patto d'Ombra!
      if (st.tipo === 'boss') {
        ctx.fillStyle = '#0a0604';
        ctx.fillRect(302, 174, 36, 32);
        ctx.strokeStyle = st.uscitaAperta ? '#f9cb40' : '#8f160c';
        ctx.lineWidth = 2;
        ctx.strokeRect(302, 174, 36, 32);
        const pianoNelCiclo = ((statoRun.piano - 1) % 4) + 1;
        const msgBotola = st.uscitaAperta
          ? (pianoNelCiclo === 4
            ? `▼ BIS! LOOP INFINITO · PIANO ${statoRun.piano + 1} (CICLO ${statoRun.ciclo + 1}) [Click/E] ▼`
            : `▼ SCENDI AL PIANO ${statoRun.piano + 1} [Click/E] ▼`)
          : '🔒 SCONFIGGI IL BOSS PER APRIRE LA BOTOLA';
        drawPillLabel(msgBotola, 320, 222, 340, {
          size: 8,
          color: st.uscitaAperta ? '#f9cb40' : '#f87171',
          border: st.uscitaAperta ? '#f9cb40' : '#8f160c',
        });

        if (st.portaPattoAperta) {
          ctx.fillStyle = '#24060d';
          ctx.strokeStyle = '#ef4444';
          ctx.lineWidth = 2;
          ctx.fillRect(422, 168, 48, 40);
          ctx.strokeRect(422, 168, 48, 40);
          drawTextFit('😈', 446, 193, 30, { size: 13, color: '#ef4444' });
          drawPillLabel('😈 PATTO D\'OMBRA [Click/E]', 446, 156, 142, {
            size: 7.5, color: '#fca5a5', border: '#ef4444',
          });
        }
      }

      // Onde d'urto delle esplosioni (Bozzoli Esplosivi / Atterraggio Monstro / Tamburello)
      if (statoRun.ondeEsplosione && statoRun.ondeEsplosione.length > 0) {
        for (let i = statoRun.ondeEsplosione.length - 1; i >= 0; i--) {
          const onda = statoRun.ondeEsplosione[i];
          onda.r += (onda.maxR - onda.r) * 0.25;
          onda.tick++;
          const alpha = Math.max(0, 1 - onda.tick / 16);
          ctx.save();
          ctx.strokeStyle = onda.color || onda.colore || `rgba(251, 146, 60, ${alpha.toFixed(2)})`;
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.arc(onda.x, onda.y, onda.r, 0, TAU);
          ctx.stroke();
          ctx.restore();
          if (onda.tick >= 16) statoRun.ondeEsplosione.splice(i, 1);
        }
      }

      // Nemici e Boss dipinti in stile pittorico dark-fairytale!
      for (const n of st.nemici) {
        if (n.hp <= 0) continue;
        const airOffset = n.airZ || 0;
        fili.push([n.x, n.y - 18 - airOffset]);

        if (n.boss) {
          disegnaBossPittorico(ctx, n, tick);
          if (n.bossId === 'donna-luciana') {
            ctx.strokeStyle = 'rgba(249,203,64,0.72)';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(n.x - 68, 0); ctx.lineTo(n.x - 68, n.y - 26);
            ctx.moveTo(n.x + 68, 0); ctx.lineTo(n.x + 68, n.y - 26);
            ctx.stroke();
            disegnaManoMarionettaPittorica(ctx, n.x - 68, n.y - 18, 1.0, false, n.flash > 0, tick);
            disegnaManoMarionettaPittorica(ctx, n.x + 68, n.y - 18, 1.0, true, n.flash > 0, tick);
          }
        } else {
          disegnaNemicoPittorico(ctx, n, tick);
          if (n.mobSoldi) {
            drawTextFit('🪙', n.x, n.y - 25, 20, { size: 7.5, color: '#f9cb40' });
          } else if (n.champion) {
            const chCol = n.champion === 'cremisi' ? '#ef4444' : n.champion === 'dorato' ? '#f9cb40' : '#38bdf8';
            drawTextFit(`★${String(n.champion).toUpperCase()}`, n.x, n.y - 25, 58, { size: 6.5, color: chCol });
          }
          if (n.hp < n.maxHp) {
            ctx.fillStyle = '#0a0604';
            ctx.fillRect(n.x - 12, n.y - 21, 24, 4);
            ctx.fillStyle = n.burnTicks > 0 ? '#ea8626' : '#ef4444';
            ctx.fillRect(n.x - 11, n.y - 20, Math.round(22 * Math.max(0, n.hp / n.maxHp)), 2);
          }
        }
      }

      // Ferruccio Pittorico Dark-Fairytale fedele all'immagine di riferimento (SENZA ALCUN FILO!)
      const pFlash = player.invuln > 0 && (tick % 4 < 2);
      disegnaFerruccioPittorico(ctx, player.x, player.y, {
        scale: 1.0,
        flipX: player.flipX,
        tick,
        moving: player.moving,
        shootAnim: player.shootAnimTimer > 0,
        pickup: player.pickupTimer > 0,
        flash: pFlash,
        haSpada: statoRun.haSpada,
        swordAnimTick: player.swordAnimTick,
        swordAngle: player.swordAngle,
        charInfo: getCharCorrente(),
        sinergie: statoRun.sinergieVisive,
      });

      if (player.pickupTimer > 0 && player.pickupItem) {
        drawPixelSprite(SPRITE_OGGETTI[player.pickupItem.sprite] || SPRITE_OGGETTI.spada, player.x, player.y - 38, 2);
      }

      // Proiettili di Ferruccio
      for (const p of statoRun.proiettili) {
        ctx.fillStyle = 'rgba(0,0,0,0.35)';
        ctx.fillRect(Math.round(p.x - 4), Math.round(p.y + 7), 8, 3);
        const sp = SPRITE_PROIETTILI[p.tipo] || SPRITE_PROIETTILI.base;
        drawPixelSprite(sp, p.x, p.y, 1.55 * statoRun.projScale);
      }

      // Proiettili Nemici
      for (const pr of statoRun.proiettiliNemici) {
        drawPixelSprite(SPRITE_PROIETTILI.nemico, pr.x, pr.y, pr.bossShot ? 1.85 : 1.55);
      }

      // Splash di impatto a 4 frame
      for (let i = statoRun.effettiSplash.length - 1; i >= 0; i--) {
        const ef = statoRun.effettiSplash[i];
        const fIdx = Math.min(3, Math.floor(ef.tick / 3));
        drawPixelSprite(SPRITE_PROIETTILI.splash[fIdx], ef.x, ef.y, 1.8);
        ef.tick++;
        if (ef.tick >= 12) statoRun.effettiSplash.splice(i, 1);
      }

      // Fulmini a catena
      for (let i = statoRun.scintilleFulmine.length - 1; i >= 0; i--) {
        const f = statoRun.scintilleFulmine[i];
        ctx.strokeStyle = '#67e8f9';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(f.x1, f.y1);
        ctx.lineTo((f.x1 + f.x2) / 2, (f.y1 + f.y2) / 2 - 6);
        ctx.lineTo(f.x2, f.y2);
        ctx.stroke();
        f.tick--;
        if (f.tick <= 0) statoRun.scintilleFulmine.splice(i, 1);
      }

      // Grandi Mani di Marionetta sopra a tutto (i fili d'oro scendono SOLO verso tutti gli altri e MAI verso Ferruccio!)
      const pianoNelCiclo = ((statoRun.piano - 1) % 4) + 1;
      const inBossFinale = st.tipo === 'boss' && pianoNelCiclo === 4 && st.nemici.some((n) => n.hp > 0);
      if (!inBossFinale) {
        ctx.strokeStyle = 'rgba(249, 203, 64, 0.58)';
        ctx.lineWidth = 1.2;
        for (const [tx, ty] of fili) {
          const hx = tx <= W / 2 ? 216 : 424;
          ctx.beginPath();
          ctx.moveTo(hx, 36);
          ctx.lineTo(Math.round(tx), Math.round(ty));
          ctx.stroke();
        }
        disegnaManoMarionettaPittorica(ctx, 216, 25, 0.95, false, false, tick);
        disegnaManoMarionettaPittorica(ctx, 424, 25, 0.95, true, false, tick + 12);
      }

      disegnaHUDPixelArt(st);
      if (statoRun.scambioPendente) disegnaModalSostituzione5Slot();
      if (statoRun.siparioAttivo) disegnaSiparioNarrativo(statoRun.siparioAttivo);
    }
    ctx.restore();

    requestAnimationFrame(loop);
  }

  // ===========================================================================
  // HUD PIXEL-ART CON STATISTICHE ISAAC + MINIMAPPA AD ESPLORAZIONE + DOCK 5 SLOT
  // (Ogni singola scritta usa drawTextFit + clip per NON uscire mai dai riquadri!)
  // ===========================================================================
  function disegnaHUDPixelArt(st) {
    // 1. Box alto a sinistra: Vita (Maschere intere e mezze) + Statistiche Isaac (DMG, TEARS, SPD, Monete)
    const hx = 6, hy = 5, hw = 172, hh = 52;
    ctx.save();
    ctx.fillStyle = 'rgba(10, 6, 4, 0.92)';
    ctx.fillRect(hx, hy, hw, hh);
    ctx.strokeStyle = '#f9cb40';
    ctx.lineWidth = 1;
    ctx.strokeRect(hx, hy, hw, hh);
    ctx.beginPath();
    ctx.rect(hx + 2, hy + 2, hw - 4, hh - 4);
    ctx.clip();

    const etichettaCiclo = statoRun.ciclo > 1 ? ` · Ciclo ∞${statoRun.ciclo}` : '';
    const chInfo = getCharCorrente();
    drawTextFit(`${chInfo.nome} · Piano ${statoRun.piano}${etichettaCiclo}`, hx + 6, hy + 11, hw - 12, {
      size: 8.5, color: '#ffffff', align: 'left',
    });

    // Barra HP + Maschere (1 Maschera = 2 mezze-maschere)
    const hpRatio = Math.max(0, statoRun.hpHalf / statoRun.maxHpHalf);
    ctx.fillStyle = '#2d1210';
    ctx.fillRect(hx + 6, hy + 15, 98, 8);
    ctx.fillStyle = '#ef4444';
    ctx.fillRect(hx + 6, hy + 15, Math.round(98 * hpRatio), 8);
    ctx.strokeStyle = '#0a0604';
    ctx.strokeRect(hx + 6, hy + 15, 98, 8);
    drawTextFit(
      `${(statoRun.hpHalf / 2).toFixed(1)}/${(statoRun.maxHpHalf / 2).toFixed(0)} ❤️`,
      hx + 108,
      hy + 22,
      hw - 112,
      { size: 7.5, color: '#ffffff', align: 'left' }
    );

    // Statistiche stile Found HUD di Isaac
    drawTextFit(
      `⚔DMG:${statoRun.dmg.toFixed(2)}  💧TRS:${statoRun.tearsPerSec.toFixed(1)}/s`,
      hx + 6,
      hy + 35,
      hw - 12,
      { size: 8, color: '#f9cb40', align: 'left' }
    );
    drawTextFit(
      `🪙${statoRun.monete} · 🥾SPD:${(statoRun.speed / 2).toFixed(2)} · Slot:${statoRun.oggettiEquipaggiati.length}/5`,
      hx + 6,
      hy + 47,
      hw - 12,
      { size: 8, color: '#e6d2aa', align: 'left' }
    );
    ctx.restore();

    // 2. In alto al centro: Barra Vita Boss (con HP numerici!) o Info Piano
    const boss = st.nemici.find((n) => n.boss && n.hp > 0);
    if (boss) {
      const bw = 204, bx = Math.round((W - bw) / 2), by = 17;
      ctx.save();
      ctx.fillStyle = 'rgba(10,6,4,0.92)';
      ctx.fillRect(bx - 6, 4, bw + 12, 26);
      ctx.strokeStyle = '#e53222';
      ctx.strokeRect(bx - 6, 4, bw + 12, 26);
      drawTextFit(
        `${boss.nome.toUpperCase()} (${Math.ceil(boss.hp)}/${boss.maxHp})`,
        W / 2,
        13,
        bw + 4,
        { size: 7.5, color: '#f9cb40' }
      );
      ctx.fillStyle = '#2d0c0a';
      ctx.fillRect(bx, by, bw, 8);
      ctx.fillStyle = '#e53222';
      ctx.fillRect(bx, by, Math.round(bw * Math.max(0, boss.hp / boss.maxHp)), 8);
      ctx.restore();
    } else {
      const nVisitate = statoRun.mappa ? statoRun.mappa.stanze.filter((s) => s.visitata).length : 1;
      const nTot = statoRun.mappa ? statoRun.mappa.stanze.length : 6;
      drawPillLabel(
        `PIANO ${statoRun.piano} (CICLO ${statoRun.ciclo}) · STANZE ${nVisitate}/${nTot}`,
        W / 2,
        15,
        210,
        { size: 8, color: '#f9cb40', border: '#8a5a2b' }
      );
    }

    // 3. Minimappa ad ESPLORAZIONE in alto a destra:
    const m = statoRun.mappa;
    if (m) {
      const cell = 12, x0 = W - 118, y0 = 24;
      const mw = 114, mh = 92;
      ctx.save();
      ctx.fillStyle = 'rgba(10,6,4,0.92)';
      ctx.fillRect(x0 - 6, y0 - 16, mw, mh);
      ctx.strokeStyle = '#f9cb40';
      ctx.strokeRect(x0 - 6, y0 - 16, mw, mh);
      ctx.beginPath();
      ctx.rect(x0 - 5, y0 - 15, mw - 2, mh - 2);
      ctx.clip();

      const scoperte = m.stanze.filter((s) => s.visitata).length;
      drawTextFit(
        `MAPPA (${scoperte}/${m.stanze.length})`,
        x0 - 6 + mw / 2,
        y0 - 5,
        mw - 8,
        { size: 7.5, color: '#f9cb40' }
      );

      for (const s of m.stanze) {
        if (!s.visitata) continue;

        const px = x0 + (s.cx - 1) * cell;
        const py = y0 + (s.cy - 1) * cell;
        const corr = st.id === s.id;
        ctx.fillStyle = corr
          ? '#f9cb40'
          : s.tipo === 'boss'
            ? '#7f1d1d'
            : s.tipo === 'tesoro'
              ? '#713f12'
              : s.tipo === 'fucina'
                ? '#7c2d12'
                : s.tipo === 'segreta'
                  ? '#581c87'
                  : '#57534e';
        ctx.fillRect(px + 1, py + 1, cell - 2, cell - 2);

        ctx.fillStyle = '#f9cb40';
        if (s.porte.N) ctx.fillRect(px + 5, py - 1, 2, 2);
        if (s.porte.S) ctx.fillRect(px + 5, py + cell - 1, 2, 2);
        if (s.porte.W) ctx.fillRect(px - 1, py + 5, 2, 2);
        if (s.porte.E) ctx.fillRect(px + cell - 1, py + 5, 2, 2);

        const ic = s.tipo === 'tesoro'
          ? '★'
          : s.tipo === 'fucina'
            ? '⚒'
            : s.tipo === 'boss'
              ? '💀'
              : s.tipo === 'segreta'
                ? '?'
                : s.oggettoPiedistallo && !s.oggettoPiedistallo.preso
                  ? '🎁'
                  : '';
        if (ic) {
          drawTextFit(ic, px + cell / 2, py + cell - 3, cell - 2, {
            size: 6.5, color: corr ? '#0a0604' : '#ffffff', shadow: false,
          });
        }
      }
      ctx.restore();
    }

    // 4. IN BASSO AL CENTRO: DOCK CON ARMA + I 5 SLOT MASSIMI (1..5) + SLOT ATTIVO [Q] CON CARICHE!
    const slotSize = 26;
    const gap = 5;
    const totBoxes = 1 + MAX_SLOT_OGGETTI;
    const dockW = totBoxes * (slotSize + gap) + 12;
    const dx0 = Math.round((W - dockW) / 2);
    const dy0 = H - 34;

    // PROPOSTA 5: Slot Oggetto Attivo [Q] a sinistra del dock con barra di carica a tacche
    const act = statoRun.oggettoAttivo;
    if (act) {
      const ax = dx0 - 44;
      const ay = dy0;
      const maxC = act.maxCarica || 3;
      const curC = statoRun.caricaAttivo ?? maxC;
      const pronto = curC >= maxC;
      ctx.fillStyle = 'rgba(15, 12, 10, 0.94)';
      ctx.fillRect(ax, ay, slotSize, slotSize);
      ctx.strokeStyle = pronto ? '#4ade80' : '#38bdf8';
      ctx.lineWidth = pronto ? 2 : 1.5;
      ctx.strokeRect(ax, ay, slotSize, slotSize);
      drawPixelSprite(SPRITE_OGGETTI[act.sprite] || SPRITE_OGGETTI.forbici, ax + slotSize / 2, ay + slotSize / 2, 1.55);
      drawTextFit('Q', ax + 3, ay + 8, 10, {
        size: 7, color: pronto ? '#4ade80' : '#38bdf8', align: 'left', shadow: false,
      });
      // Barra verticale cariche a fianco dello slot [Q]
      const barX = ax + slotSize + 3;
      const segH = Math.floor((slotSize - 2) / maxC);
      for (let c = 0; c < maxC; c++) {
        const sy = ay + slotSize - 1 - (c + 1) * segH;
        ctx.fillStyle = c < curC ? (pronto ? '#4ade80' : '#38bdf8') : '#1c1917';
        ctx.fillRect(barX, sy, 5, segH - 1);
        ctx.strokeStyle = '#0a0604';
        ctx.lineWidth = 0.8;
        ctx.strokeRect(barX, sy, 5, segH - 1);
      }
    }

    for (let i = 0; i < totBoxes; i++) {
      const sx = dx0 + 4 + i * (slotSize + gap) + (i > 0 ? 4 : 0);
      ctx.fillStyle = 'rgba(15, 12, 10, 0.94)';
      ctx.fillRect(sx, dy0, slotSize, slotSize);

      if (i === 0) {
        ctx.strokeStyle = '#a855f7';
        ctx.lineWidth = 2;
        ctx.strokeRect(sx, dy0, slotSize, slotSize);
        if (statoRun.haSpada) {
          drawPixelSprite(SPRITE_OGGETTI.spada, sx + slotSize / 2, dy0 + slotSize / 2, 1.6);
        } else {
          drawPixelSprite(SPRITE_PROIETTILI[statoRun.tipoProiettile] || SPRITE_PROIETTILI.base, sx + slotSize / 2, dy0 + slotSize / 2, 2.0);
        }
      } else {
        const slotIdx = i - 1;
        const item = statoRun.oggettiEquipaggiati[slotIdx];
        ctx.strokeStyle = item ? '#f9cb40' : '#44403c';
        ctx.lineWidth = item ? 1.6 : 1;
        ctx.strokeRect(sx, dy0, slotSize, slotSize);
        if (item) {
          drawPixelSprite(SPRITE_OGGETTI[item.sprite] || SPRITE_OGGETTI.spada, sx + slotSize / 2, dy0 + slotSize / 2, 1.6);
        }
        drawTextFit(`${slotIdx + 1}`, sx + 3, dy0 + 8, 10, {
          size: 7, color: '#9ca3af', align: 'left', shadow: false,
        });
      }
    }

    // 5. Banner informativo (con auto-fit rigoroso dentro i 500px!)
    if (statoRun.bannerTimer > 0) {
      statoRun.bannerTimer--;
      const bw = 516, bx = Math.round((W - bw) / 2), by = H - 56, bh = 18;
      ctx.save();
      ctx.fillStyle = 'rgba(10, 6, 4, 0.95)';
      ctx.fillRect(bx, by, bw, bh);
      ctx.strokeStyle = '#f9cb40';
      ctx.lineWidth = 1;
      ctx.strokeRect(bx, by, bw, bh);
      ctx.beginPath();
      ctx.rect(bx + 2, by + 1, bw - 4, bh - 2);
      ctx.clip();
      drawTextFit(statoRun.banner, W / 2, by + 12, bw - 14, { size: 8, color: '#f9cb40' });
      ctx.restore();
    }
  }

  // ===========================================================================
  // MODAL DI SOSTITUZIONE QUANDO HAI GIÀ 5 OGGETTI E NE PRENDI/COMPRI UN 6°
  // ===========================================================================
  function disegnaModalSostituzione5Slot() {
    const sc = statoRun.scambioPendente;
    if (!sc) return;

    ctx.save();
    ctx.fillStyle = 'rgba(5, 3, 2, 0.88)';
    ctx.fillRect(0, 0, W, H);

    const mx = 84, my = 56, mw = 472, mh = 244;
    ctx.fillStyle = '#17100b';
    ctx.strokeStyle = '#f9cb40';
    ctx.lineWidth = 2;
    ctx.fillRect(mx, my, mw, mh);
    ctx.strokeRect(mx, my, mw, mh);
    ctx.beginPath();
    ctx.rect(mx + 4, my + 4, mw - 8, mh - 8);
    ctx.clip();

    drawTextFit('⚠ SLOT OGGETTI PIENI (5/5) — SCEGLI QUALE SOSTITUIRE ⚠', W / 2, 78, mw - 24, {
      size: 10, color: '#f9cb40',
    });

    drawPixelSprite(SPRITE_OGGETTI[sc.nuovoItem.sprite] || SPRITE_OGGETTI.spada, W / 2, 104, 2.1);
    drawTextFit(`NUOVO: ${sc.nuovoItem.nome}`, W / 2, 126, mw - 24, {
      size: 9, color: '#4ade80',
    });
    drawTextFit(sc.nuovoItem.statsDesc, W / 2, 138, mw - 24, {
      size: 8, color: '#67e8f9',
    });
    drawTextFit('Clicca su uno dei 5 slot qui sotto (o premi i tasti 1-5) per sostituirlo:', W / 2, 152, mw - 24, {
      size: 8, color: '#e6d2aa', weight: '',
    });

    for (let i = 0; i < MAX_SLOT_OGGETTI; i++) {
      const it = statoRun.oggettiEquipaggiati[i];
      const bx = 118 + i * 84;
      const by = 162;
      const bw = 74, bh = 84;
      ctx.save();
      ctx.fillStyle = '#26180f';
      ctx.strokeStyle = '#f9cb40';
      ctx.lineWidth = 1.5;
      ctx.fillRect(bx, by, bw, bh);
      ctx.strokeRect(bx, by, bw, bh);
      ctx.beginPath();
      ctx.rect(bx + 2, by + 2, bw - 4, bh - 4);
      ctx.clip();

      drawTextFit(`SLOT [${i + 1}]`, bx + bw / 2, by + 13, bw - 8, { size: 8.5, color: '#f9cb40' });
      if (it) {
        drawPixelSprite(SPRITE_OGGETTI[it.sprite] || SPRITE_OGGETTI.spada, bx + bw / 2, by + 37, 1.9);
        const nomeCorto = it.nome.replace(/\s*\(.*?\)/g, '');
        drawTextFit(nomeCorto, bx + bw / 2, by + 63, bw - 8, { size: 7.5, color: '#ffffff' });
        drawTextFit('SOSTITUISCI', bx + bw / 2, by + 76, bw - 8, { size: 7, color: '#f87171' });
      }
      ctx.restore();
    }

    ctx.fillStyle = '#451a14';
    ctx.strokeStyle = '#e53222';
    ctx.fillRect(250, 264, 140, 24);
    ctx.strokeRect(250, 264, 140, 24);
    drawTextFit('ANNULLA [ESC / Click]', 320, 279, 128, { size: 8.5, color: '#ffffff' });
    ctx.restore();
  }

  // ===========================================================================
  // SIPARIO NARRATIVO DEGLI ATTI (CON AUTO-FIT E CLIP RIGOROSO DENTRO LA CORNICE!)
  // ===========================================================================
  function disegnaSiparioNarrativo(info) {
    ctx.save();
    ctx.fillStyle = 'rgba(6, 3, 2, 0.88)';
    ctx.fillRect(0, 0, W, H);

    ctx.fillStyle = '#5c110b';
    ctx.fillRect(58, 42, 24, 276);
    ctx.fillRect(W - 82, 42, 24, 276);

    const cx = 82, cy = 46, cw = 476, ch = 268;
    ctx.fillStyle = '#140c08';
    ctx.strokeStyle = '#f9cb40';
    ctx.lineWidth = 2;
    ctx.fillRect(cx, cy, cw, ch);
    ctx.strokeRect(cx, cy, cw, ch);
    ctx.beginPath();
    ctx.rect(cx + 6, cy + 6, cw - 12, ch - 12);
    ctx.clip();

    // Le Mani di Marionetta sopra il cartellone + Ferruccio pittorico al centro
    disegnaManoMarionettaPittorica(ctx, 232, 82, 0.92, false, false, tick);
    disegnaManoMarionettaPittorica(ctx, 408, 82, 0.92, true, false, tick);
    disegnaFerruccioPittorico(ctx, 320, 108, {
      scale: 0.95,
      flipX: false,
      tick,
      moving: false,
      shootAnim: false,
      pickup: false,
      flash: false,
      haSpada: true,
      swordAnimTick: -1,
      swordAngle: 0,
      charInfo: getCharCorrente(),
      sinergie: statoRun.sinergieVisive,
    });

    const maxTextW = cw - 28;
    drawTextFit(info.atto, W / 2, 144, maxTextW, { size: 9.5, color: '#f9cb40' });
    drawTextFit(info.titolo, W / 2, 166, maxTextW, { size: 11, color: '#ffffff' });
    drawTextFit(info.testo1, W / 2, 194, maxTextW, { size: 8.5, weight: '', color: '#f3dfc1' });
    drawTextFit(info.testo2, W / 2, 214, maxTextW, { size: 8.5, weight: '', color: '#f3dfc1' });
    drawTextFit(info.testo3, W / 2, 236, maxTextW, { size: 8.5, color: '#4ade80' });

    ctx.fillStyle = '#7a1c12';
    ctx.strokeStyle = '#f9cb40';
    ctx.fillRect(206, 264, 228, 28);
    ctx.strokeRect(206, 264, 228, 28);
    drawTextFit('▶ ALZA IL SIPARIO [Click / Spazio]', W / 2, 281, 214, { size: 9, color: '#ffffff' });
    ctx.restore();
  }

  statoRun.fase = 'menu_selezione';
  requestAnimationFrame(loop);
})();
</script>
