      mostraBanner('🥁 TAMBURELLO DI PIAZZA DANTE! Onda sonora: proiettili spazzati via e mostri respinti!', 180);
    } else if (att.id === 'ampolla') {
      statoRun.ondeEsplosione.push({ x: player.x, y: player.y, r: 8, maxR: 90, color: '#ef4444' });
      statoRun.hpHalf = Math.min(statoRun.maxHpHalf, statoRun.hpHalf + 2);
      mostraBanner('🩸 AMPOLLA DI SAN GENNARO! Rigenerata +1 ❤️ Maschera intera!', 180);
    }
  }

  function acquisisciOggettoConLimite5Slot(nuovoItem, origine, refSlot) {
    if (origine === 'patto' && refSlot) {
      const costo = refSlot.costoMaxHpHalf || 2;
      if (statoRun.maxHpHalf <= costo && statoRun.hpHalf <= costo) {
        mostraBanner('⚠ Non hai abbastanza Maschere Massime per stringere questo Patto d\'Ombra!', 160);
        return;
      }
    }

    if (statoRun.oggettiEquipaggiati.length < MAX_SLOT_OGGETTI) {
      statoRun.oggettiEquipaggiati.push(nuovoItem);
      if (origine === 'piedistallo' && refSlot) refSlot.preso = true;
      if (origine === 'fucina' && refSlot) {
        statoRun.monete -= refSlot.prezzo;
        refSlot.comprato = true;
      }
      if (origine === 'patto' && refSlot) {
        statoRun.baseMaxHpHalf = Math.max(2, statoRun.baseMaxHpHalf - (refSlot.costoMaxHpHalf || 2));
        refSlot.comprato = true;
      }
      ricalcolaStatisticheIsaac();
      if (nuovoItem.mod?.healOnEquip) {
        statoRun.hpHalf = Math.min(statoRun.maxHpHalf, statoRun.hpHalf + nuovoItem.mod.healOnEquip);
      }
      player.pickupTimer = 55;
      player.pickupItem = nuovoItem;
      mostraBanner(`★ ${nuovoItem.nome} [${statoRun.oggettiEquipaggiati.length}/5]: ${nuovoItem.statsDesc}`, 210);
      return;
    }

    statoRun.scambioPendente = { nuovoItem, origine, refSlot };
  }

  function confermaSostituzioneSlot(idxSlot) {
    const sc = statoRun.scambioPendente;
    if (!sc || idxSlot < 0 || idxSlot >= MAX_SLOT_OGGETTI) return;
    const vecchioItem = statoRun.oggettiEquipaggiati[idxSlot];
    statoRun.oggettiEquipaggiati[idxSlot] = sc.nuovoItem;

    if (sc.origine === 'piedistallo' && sc.refSlot) {
      sc.refSlot.id = vecchioItem.id;
      sc.refSlot.sprite = vecchioItem.sprite;
      sc.refSlot.nome = vecchioItem.nome;
      sc.refSlot.statsDesc = vecchioItem.statsDesc;
      sc.refSlot.lore = vecchioItem.lore;
      sc.refSlot.mod = vecchioItem.mod;
      sc.refSlot.preso = false;
    } else if (sc.origine === 'fucina' && sc.refSlot) {
      statoRun.monete -= sc.refSlot.prezzo;
      sc.refSlot.comprato = true;
    } else if (sc.origine === 'patto' && sc.refSlot) {
      statoRun.baseMaxHpHalf = Math.max(2, statoRun.baseMaxHpHalf - (sc.refSlot.costoMaxHpHalf || 2));
      sc.refSlot.comprato = true;
    }

    statoRun.scambioPendente = null;
    ricalcolaStatisticheIsaac();
    if (sc.nuovoItem.mod?.healOnEquip) {
      statoRun.hpHalf = Math.min(statoRun.maxHpHalf, statoRun.hpHalf + sc.nuovoItem.mod.healOnEquip);
    }
    player.pickupTimer = 55;
    player.pickupItem = sc.nuovoItem;
    mostraBanner(`🔄 Sostituito [${vecchioItem.nome}] con [${sc.nuovoItem.nome}]!`, 200);
  }

  const keys = {};
  window.addEventListener('keydown', (e) => {
    keys[e.code] = true;
    player.targetX = null;
    player.targetY = null;
    if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) e.preventDefault();

    if (statoRun.fase === 'menu_selezione') {
      const charIds = ['ferruccio', 'agnese', 'taddeo', 'ombra'];
      let currIdx = charIds.indexOf(statoRun.personaggioId);
      if (currIdx === -1) currIdx = 0;
      if (['ArrowLeft', 'KeyA'].includes(e.code)) {
        currIdx = (currIdx - 1 + charIds.length) % charIds.length;
        selezionaPersonaggio(charIds[currIdx]);
      } else if (['ArrowRight', 'KeyD'].includes(e.code)) {
        currIdx = (currIdx + 1) % charIds.length;
        selezionaPersonaggio(charIds[currIdx]);
      } else if (e.code === 'Digit1') selezionaPersonaggio('ferruccio');
      else if (e.code === 'Digit2') selezionaPersonaggio('agnese');
      else if (e.code === 'Digit3') selezionaPersonaggio('taddeo');
      else if (e.code === 'Digit4') selezionaPersonaggio('ombra');
      else if (['Space', 'Enter'].includes(e.code)) {
        avviaPartitaConPersonaggio(statoRun.personaggioId);
      }
      return;
    }

    if (e.code === 'Escape') {
      statoRun.fase = 'menu_selezione';
      statoRun.siparioAttivo = null;
      return;
    }

    if (statoRun.siparioAttivo && ['Space', 'KeyE', 'Enter', 'Escape'].includes(e.code)) {
      statoRun.siparioAttivo = null;
      return;
    }

    if (statoRun.scambioPendente) {
      if (e.code === 'Digit1') confermaSostituzioneSlot(0);
      else if (e.code === 'Digit2') confermaSostituzioneSlot(1);
      else if (e.code === 'Digit3') confermaSostituzioneSlot(2);
      else if (e.code === 'Digit4') confermaSostituzioneSlot(3);
      else if (e.code === 'Digit5') confermaSostituzioneSlot(4);
      else if (e.code === 'Escape' || e.code === 'KeyQ') statoRun.scambioPendente = null;
      return;
    }

    if (e.code === 'KeyQ') usaOggettoAttivo();
    if (e.code === 'KeyE') interagisciStanza();
    if (e.code === 'Space') eseguiAttacco4Direzioni(player.dirX, player.dirY);
  });
  window.addEventListener('keyup', (e) => { keys[e.code] = false; });

  wrap.addEventListener('mouseenter', () => {
    try { window.focus(); wrap.focus({ preventScroll: true }); } catch (_) {}
  });

  canvas.addEventListener('mousedown', (e) => {
    try { window.focus(); wrap.focus({ preventScroll: true }); } catch (_) {}
    const r = canvas.getBoundingClientRect();
    const mx = (e.clientX - r.left) * (W / r.width);
    const my = (e.clientY - r.top) * (H / r.height);

    if (statoRun.fase === 'menu_selezione') {
      const charIds = ['ferruccio', 'agnese', 'taddeo', 'ombra'];
      const cardW = 132, cardH = 224, cardY = 56, gap = 14, startX = 35;
      for (let i = 0; i < charIds.length; i++) {
        const cx = startX + i * (cardW + gap);
        if (mx >= cx && mx <= cx + cardW && my >= cardY && my <= cardY + cardH) {
          if (statoRun.personaggioId === charIds[i]) {
            avviaPartitaConPersonaggio(charIds[i]);
          } else {
            selezionaPersonaggio(charIds[i]);
          }
          return;
        }
      }
      if (mx >= 150 && mx <= 490 && my >= 298 && my <= 344) {
        avviaPartitaConPersonaggio(statoRun.personaggioId);
        return;
      }
      return;
    }

    if (statoRun.siparioAttivo) {
      statoRun.siparioAttivo = null;
      return;
    }

    if (statoRun.scambioPendente) {
      for (let i = 0; i < MAX_SLOT_OGGETTI; i++) {
        const bx = 118 + i * 84;
        const by = 162;
        if (mx >= bx && mx <= bx + 74 && my >= by && my <= by + 82) {
          confermaSostituzioneSlot(i);
          return;
        }
      }
      if (mx >= 250 && mx <= 390 && my >= 262 && my <= 290) {
        statoRun.scambioPendente = null;
      }
      return;
    }

    // Click sullo Slot Oggetto Attivo [Q] in basso a sinistra nella dock
    if (mx >= 214 && mx <= 246 && my >= H - 36 && my <= H - 6) {
      usaOggettoAttivo();
      return;
    }

    const st = statoRun.stanzaCorrente;
    if (!st) return;

    if (statoRun.mappa && st.pulita) {
      const cell = 12, x0 = W - 118, y0 = 24;
      for (const s of statoRun.mappa.stanze) {
        if (!s.visitata) continue;
        const px = x0 + (s.cx - 1) * cell;
        const py = y0 + (s.cy - 1) * cell;
        if (mx >= px && mx <= px + cell && my >= py && my <= py + cell) {
          entraInStanza(s, null);
          return;
        }
      }
    }

    if (st.pulita) {
      const porteClick = {
        N: { x: 320, y: 66, rx: 28, ry: 20, opp: 'S' },
        S: { x: 320, y: 310, rx: 28, ry: 20, opp: 'N' },
        W: { x: 62, y: 188, rx: 20, ry: 28, opp: 'E' },
        E: { x: 578, y: 188, rx: 20, ry: 28, opp: 'W' },
      };
      if (st.muroSegreto && !st.muroSegreto.aperto) {
        const ms = porteClick[st.muroSegreto.lato];
        if (ms && Math.abs(mx - ms.x) <= ms.rx + 8 && Math.abs(my - ms.y) <= ms.ry + 8) {
          apriMuroSegreto(st);
          return;
        }
      }
      for (const [lato, idDest] of Object.entries(st.porte)) {
        const pc = porteClick[lato];
        if (Math.abs(mx - pc.x) <= pc.rx && Math.abs(my - pc.y) <= pc.ry) {
          entraInStanza(statoRun.mappa.perId.get(idDest), pc.opp);
          return;
        }
      }
    }

    if (st.pulita && st.oggettoPiedistallo && !st.oggettoPiedistallo.preso) {
      const o = st.oggettoPiedistallo;
      if (Math.hypot(mx - o.x, my - o.y) < 36) {
        player.x = o.x;
        player.y = o.y + 12;
        acquisisciOggettoConLimite5Slot({ ...o }, 'piedistallo', o);
        return;
      }
    }

    if (st.tipo === 'fucina' || st.tipo === 'patto') {
      const listaSlot = st.tipo === 'patto' ? st.slotPatto : st.slotFucina;
      for (const sl of listaSlot || []) {
        if (!sl.comprato && Math.hypot(mx - sl.x, my - sl.y) < 32) {
          player.x = sl.x;
          player.y = sl.y + 14;
          interagisciStanza();
          return;
        }
      }
    }

    // Click sulla Porta del Patto d'Ombra (nella stanza del Boss sconfitto) o sulla porta di ritorno dal Patto
    if (st.tipo === 'boss' && st.portaPattoAperta && Math.hypot(mx - 430, my - 190) < 34) {
      const stanzaPatto = statoRun.mappa?.stanze.find((x) => x.tipo === 'patto');
      if (stanzaPatto) entraInStanza(stanzaPatto, null);
      return;
    }
    if (st.tipo === 'patto' && Math.hypot(mx - 320, my - 252) < 36) {
      const bossRoom = statoRun.mappa?.stanze.find((x) => x.tipo === 'boss');
      if (bossRoom) entraInStanza(bossRoom, null);
      return;
    }

    if (st.tipo === 'boss' && st.uscitaAperta && Math.hypot(mx - 320, my - 190) < 34) {
      interagisciStanza();
      return;
    }

    const dx = mx - player.x;
    const dy = my - player.y;
    let dirX = 0, dirY = 0;
    if (Math.abs(dx) >= Math.abs(dy)) dirX = dx >= 0 ? 1 : -1;
    else dirY = dy >= 0 ? 1 : -1;
    player.targetX = Math.max(ARENA.x1, Math.min(ARENA.x2, mx));
    player.targetY = Math.max(ARENA.y1, Math.min(ARENA.y2, my));
    eseguiAttacco4Direzioni(dirX, dirY);
  });

  function mostraBanner(testo, durata = 160) {
    statoRun.banner = testo;
    statoRun.bannerTimer = durata;
  }

  function estraiOggettoBase() {
    if (!statoRun.poolOggettiBase.length) {
      statoRun.poolOggettiBase = shuffle(CATALOGO_OGGETTI.filter((x) => x.tier === 'base'));
    }
    return { ...statoRun.poolOggettiBase.pop() };
  }

  function estraiOggettoForte() {
    if (!statoRun.poolOggettiForti.length) {
      statoRun.poolOggettiForti = shuffle(CATALOGO_OGGETTI.filter((x) => x.tier === 'forte'));
    }
    return { ...statoRun.poolOggettiForti.pop() };
  }

  function estraiOggettoPatto() {
    if (!statoRun.poolPatto.length) {
      statoRun.poolPatto = shuffle(CATALOGO_PATTO);
    }
    return { ...statoRun.poolPatto.pop() };
  }

  function tiraOggettoGratisStanza(garantito = false) {
    const roll = rng();
    if (roll < 0.10) {
      return { ...estraiOggettoForte(), forteGratis: true };
    }
    if (garantito || roll < 0.10 + (1 / 3)) {
      return { ...estraiOggettoBase(), forteGratis: false };
    }
    return null;
  }

  function apriMuroSegreto(st) {
    if (!st?.muroSegreto || st.muroSegreto.aperto) return;
    st.muroSegreto.aperto = true;
    const seg = statoRun.mappa.perId.get(st.muroSegreto.idDest);
    if (seg) {
      st.porte[st.muroSegreto.lato] = seg.id;
      seg.porte[st.muroSegreto.opposto] = st.id;
    }
    statoRun.scossa = 5;
    mostraBanner('🔓 PASSAGGIO SEGRETO APERTO! Entra nella Stanza Segreta (?) coi Mob d\'Oro per fare soldi!', 220);
  }

  function numeroStanzeDelPiano(piano) {
    const pianoNelCiclo = ((piano - 1) % 4) + 1;
    return STANZE_PER_PIANO_CICLO[pianoNelCiclo] || 5;
  }

  function generaMappaPiano(piano) {
    const nTotale = numeroStanzeDelPiano(piano);
    const nNormali = nTotale - 4;
    const dirs = [
      { lato: 'N', opposto: 'S', dx: 0, dy: -1 },
      { lato: 'E', opposto: 'W', dx: 1, dy: 0 },
      { lato: 'S', opposto: 'N', dx: 0, dy: 1 },
      { lato: 'W', opposto: 'E', dx: -1, dy: 0 },
    ];

    for (let tentativo = 0; tentativo < 100; tentativo++) {
      const griglia = new Map();
      const stanze = [];
      const key = (x, y) => `${x},${y}`;
      const aggiungi = (tipo, cx, cy) => {
        const s = {
          id: `r${stanze.length}`,
          tipo,
          cx, cy,
          porte: {},
          muroSegreto: null,
          pulita: tipo === 'ingresso' || tipo === 'tesoro' || tipo === 'fucina' || tipo === 'patto',
          visitata: tipo === 'ingresso',
          nemici: [],
          ostacoli: [],
          oggettiATerra: [],
          oggettoPiedistallo: null,
          ricompensaOggetto: null,
          slotFucina: [],
          slotPatto: [],
          uscitaAperta: false,
          portaPattoAperta: false,
        };
        stanze.push(s);
        if (cx >= 1 && cy >= 1) griglia.set(key(cx, cy), s);
        return s;
      };
      const collega = (a, b, d) => {
        a.porte[d.lato] = b.id;
        b.porte[d.opposto] = a.id;
      };

      const ingresso = aggiungi('ingresso', 4, 3);
      let curr = ingresso;
      let ok = true;
      for (let i = 0; i < nNormali; i++) {
        const libere = shuffle(dirs).filter((d) => {
          const nx = curr.cx + d.dx, ny = curr.cy + d.dy;
          return nx >= 1 && nx <= 7 && ny >= 1 && ny <= 6 && !griglia.has(key(nx, ny));
        });
        if (!libere.length) { ok = false; break; }
        const d = libere[0];
        const nuova = aggiungi('normale', curr.cx + d.dx, curr.cy + d.dy);
        collega(curr, nuova, d);
        if (rng() < 0.75) curr = nuova;
      }
      if (!ok) continue;

      const normali = stanze.filter((s) => s.tipo === 'normale');
      let bossOk = false;
      for (const cand of shuffle(normali).reverse()) {
        for (const d of shuffle(dirs)) {
          const nx = cand.cx + d.dx, ny = cand.cy + d.dy;
          if (nx < 1 || nx > 7 || ny < 1 || ny > 6 || griglia.has(key(nx, ny))) continue;
          if (Math.abs(nx - ingresso.cx) + Math.abs(ny - ingresso.cy) <= 1) continue;
          const vicini = dirs.filter((d2) => griglia.has(key(nx + d2.dx, ny + d2.dy)));
          if (vicini.length !== 1) continue;
          const bossRoom = aggiungi('boss', nx, ny);
          collega(cand, bossRoom, d);
          bossOk = true;
          break;
        }
        if (bossOk) break;
      }
      if (!bossOk) continue;

      for (const tipoSpec of ['tesoro', 'fucina']) {
        let pos = false;
        const genitori = shuffle(stanze.filter((s) => s.tipo === 'normale' || s.tipo === 'ingresso'));
        for (const g of genitori) {
          for (const d of shuffle(dirs)) {
            const nx = g.cx + d.dx, ny = g.cy + d.dy;
            if (nx < 1 || nx > 7 || ny < 1 || ny > 6 || griglia.has(key(nx, ny))) continue;
            const vicini = dirs.filter((d2) => griglia.has(key(nx + d2.dx, ny + d2.dy)));
            if (vicini.length !== 1) continue;
            const spec = aggiungi(tipoSpec, nx, ny);
            collega(g, spec, d);
            pos = true;
            break;
          }
          if (pos) break;
        }
        if (!pos) { ok = false; break; }
      }
      if (!ok || stanze.length !== nTotale) continue;

      let segretaOk = false;
      const candidatiSegreta = shuffle(stanze.filter((s) => s.tipo === 'normale' || s.tipo === 'ingresso'));
      for (const g of candidatiSegreta) {
        for (const d of shuffle(dirs)) {
          const nx = g.cx + d.dx, ny = g.cy + d.dy;
          if (nx < 1 || nx > 7 || ny < 1 || ny > 6 || griglia.has(key(nx, ny))) continue;
          const confBoss = dirs.some((d2) => griglia.get(key(nx + d2.dx, ny + d2.dy))?.tipo === 'boss');
          if (confBoss) continue;
          const stanzaSegreta = aggiungi('segreta', nx, ny);
          g.muroSegreto = { lato: d.lato, opposto: d.opposto, idDest: stanzaSegreta.id, aperto: false };
          stanzaSegreta.porte[d.opposto] = g.id;
          segretaOk = true;
          break;
        }
        if (segretaOk) break;
      }
      if (!segretaOk) continue;

      // Aggiunge la Stanza del Patto d'Ombra (Proposta 2: accessibile dopo aver sconfitto il Boss!)
      aggiungi('patto', 0, 0);

      for (const s of stanze) popolaStanzaIsaac(s, piano);
      return { piano, stanze, perId: new Map(stanze.map((s) => [s.id, s])) };
    }
    return null;
  }

  function popolaStanzaIsaac(s, piano) {
    const ciclo = Math.floor((piano - 1) / 4) + 1;
    const moltCiclo = Math.pow(1.45, ciclo - 1);
    const moltVel = Math.min(1.55, 1 + (piano - 1) * 0.045);
    const nomeCorto = (str) => str.replace(/\s*\(.*?\)/g, '');

    if (s.tipo === 'tesoro') {
      const item = tiraOggettoGratisStanza(true);
      s.oggettoPiedistallo = {
        ...item,
        x: 320,
        y: 192,
        preso: false,
      };
    } else if (s.tipo === 'patto') {
      // STANZA DEL PATTO D'OMBRA (Proposta 2: 2 reliquie proibite in cambio di 1 Maschera Massima!)
      const p1 = estraiOggettoPatto();
      const p2 = estraiOggettoPatto();
      s.slotPatto = [
        {
          tipo: 'patto', item: p1, nome: p1.nome, nomeBreve: nomeCorto(p1.nome),
          statsDesc: p1.statsDesc, costoMaxHpHalf: p1.costoMaxHpHalf || 2,
          sprite: p1.sprite, x: 236, y: 188, comprato: false,
        },
        {
          tipo: 'patto', item: p2, nome: p2.nome, nomeBreve: nomeCorto(p2.nome),
          statsDesc: p2.statsDesc, costoMaxHpHalf: p2.costoMaxHpHalf || 2,
          sprite: p2.sprite, x: 404, y: 188, comprato: false,
        },
      ];
    } else if (s.tipo === 'fucina') {
      const objBase = estraiOggettoBase();
      const objForte = estraiOggettoForte();
      const scontoBase = rng() < 0.22;
      const scontoForte = rng() < 0.12;
      const prezzoBase = scontoBase ? Math.floor(objBase.prezzo / 2) : objBase.prezzo;
      const prezzoForte = scontoForte ? Math.floor(objForte.prezzo / 2) : objForte.prezzo;

      s.slotFucina = [
        {
          tipo: 'cura', curaHalf: 1, nome: '½ Maschera di Cera', nomeBreve: '½ Maschera',
          statsDesc: 'Rigenera +½ ❤️ Maschera (Prezzo Isaac: 3🪙)',
          prezzo: 3, inSaldo: false, sprite: 'mezzaMaschera', tier: 'cura', x: 158, y: 196, comprato: false,
        },
        {
          tipo: 'cura', curaHalf: 2, nome: 'Maschera Intera', nomeBreve: '1 Maschera',
          statsDesc: 'Rigenera +1 ❤️ Maschera intera (Prezzo Isaac: 5🪙)',
          prezzo: 5, inSaldo: false, sprite: 'cuore', tier: 'cura', x: 266, y: 196, comprato: false,
        },
        {
          tipo: 'oggetto', item: objBase, nome: objBase.nome, nomeBreve: nomeCorto(objBase.nome),
          statsDesc: objBase.statsDesc,
          prezzo: prezzoBase, inSaldo: scontoBase, sprite: objBase.sprite, tier: 'base', x: 374, y: 196, comprato: false,
        },
        {
          tipo: 'oggetto', item: objForte, nome: `★ ${objForte.nome}`, nomeBreve: `★ ${nomeCorto(objForte.nome)}`,
          statsDesc: objForte.statsDesc,
          prezzo: prezzoForte, inSaldo: scontoForte, sprite: objForte.sprite, tier: 'forte', x: 482, y: 196, comprato: false,
        },
      ];
    } else if (s.tipo === 'segreta') {
      s.ricompensaOggetto = tiraOggettoGratisStanza(false);
      const nMobSoldi = 4 + Math.min(2, Math.floor(piano * 0.5));
      const tipiAttacco = ['vespa_cieca', 'gatto', 'bomba_ferma', 'guardia'];
      const baseHpMap = { vespa_cieca: 10, gatto: 15, bomba_ferma: 16, guardia: 22 };
      const baseSpdMap = { vespa_cieca: 1.55, gatto: 1.45, bomba_ferma: 0, guardia: 1.08 };
      for (let i = 0; i < nMobSoldi; i++) {
        const t = tipiAttacco[i % tipiAttacco.length];
        const hpMax = Math.round((baseHpMap[t] + (piano - 1) * 4) * moltCiclo);
        s.nemici.push({
          id: `${s.id}-sec${i}`,
          tipo: 'predone',
          patternMob: t,
          nome: 'Predone d\'Oro',
          boss: false,
          mobSoldi: true,
          champion: 'dorato',
          x: 130 + rng() * 380,
          y: 108 + rng() * 145,
          hp: hpMax,
          maxHp: hpMax,
          speed: baseSpdMap[t] * moltVel,
          r: 11,
          flash: 0,
          burnTicks: 0,
          stunTicks: 0,
          state: 'idle',
          stateTimer: 25 + Math.floor(rng() * 30),
          maskOpen: true,
          shootCd: 38 + Math.floor(rng() * 35),
        });
      }
    } else if (s.tipo === 'normale') {
      s.ricompensaOggetto = tiraOggettoGratisStanza(false);

      const nOst = 2 + Math.floor(rng() * 3);
      const tipiOst = ['urna', 'colonna', 'braciere'];
      for (let i = 0; i < nOst; i++) {
        s.ostacoli.push({
          x: Math.round(135 + rng() * 370),
          y: Math.round(115 + rng() * 140),
          tipo: tipiOst[Math.floor(rng() * tipiOst.length)],
        });
      }

      // ARCHETIPI DIFFERENZIATI COME IN THE BINDING OF ISAAC:
      // - 'vespa_cieca' (Attack Fly): vola contro di te SENZA sparare!
      // - 'bomba_ferma' (Mulliboom / Boil): sta ferma e pulsa, esplodendo se ti avvicini o quando uccisa!
      // - 'gatto' (Trite / Hopper): NON spara, si accuccia col mirino rosso e balza verso di te!
      // - 'maschera' (Host): corazzata finché è chiusa, si apre per sparare un ventaglio di 3 colpi!
      // - 'guardia' (Knight / Clotty): pattuglia e spara doppiette di moschetto!
      // - 'statua' (Stone Grimace): ferma sul posto, spara croci rotanti (+ e x)!
      const nNem = 3 + Math.floor(rng() * 2) + Math.min(3, Math.floor(piano * 0.5));
      const tipiNem = ['vespa_cieca', 'bomba_ferma', 'gatto', 'maschera', 'guardia', 'statua'];
      const nomiNem = {
        vespa_cieca: 'Vespa Cieca (Attack Fly)',
        bomba_ferma: 'Bozzo Esplosivo (Boil)',
        gatto: 'Gatto d\'Ombra (Hopper)',
        maschera: 'Maschera Corazzata (Host)',
        guardia: 'Guardia di Piombo',
        statua: 'Torrione di Marmo',
      };
      const baseHpMap = { vespa_cieca: 9, bomba_ferma: 14, gatto: 14, maschera: 18, guardia: 22, statua: 26 };
      const stageHpMap = { vespa_cieca: 2.5, bomba_ferma: 3.5, gatto: 4, maschera: 5, guardia: 6, statua: 7 };
      const baseSpdMap = { vespa_cieca: 1.55, bomba_ferma: 0.0, gatto: 1.45, maschera: 0.35, guardia: 1.02, statua: 0.0 };

      for (let i = 0; i < nNem; i++) {
        const t = tipiNem[Math.floor(rng() * tipiNem.length)];
        // Proposta 6: ~20% probabilità di nascere come CAMPIONE COLORATO (🔴 Cremisi, 🟡 Dorato, 🔵 Elettrico)
        let champion = null;
        if (rng() < 0.20) {
          const rCh = rng();
          champion = rCh < 0.34 ? 'cremisi' : rCh < 0.67 ? 'dorato' : 'elettrico';
        }
        const multHpChamp = champion === 'cremisi' ? 1.75 : champion ? 1.45 : 1.0;
        const multSpdChamp = champion === 'dorato' ? 1.25 : 1.0;
        const hpMax = Math.round((baseHpMap[t] + (piano - 1) * stageHpMap[t]) * moltCiclo * multHpChamp);

        s.nemici.push({
          id: `${s.id}-e${i}`,
          tipo: t,
          patternMob: t,
          nome: champion ? `${nomiNem[t]} [Campione ${champion}]` : nomiNem[t],
          boss: false,
          mobSoldi: champion === 'dorato',
          champion,
          x: 120 + rng() * 400,
          y: 105 + rng() * 155,
          hp: hpMax,
          maxHp: hpMax,
          speed: baseSpdMap[t] * moltVel * multSpdChamp,
          r: t === 'statua' ? 13 : 11,
          flash: 0,
          burnTicks: 0,
          stunTicks: 0,
          state: 'idle',
          stateTimer: 25 + Math.floor(rng() * 35),
          maskOpen: false,
          shootCd: 35 + Math.floor(rng() * 45),
        });
      }
    } else if (s.tipo === 'boss') {
      const pianoNelCiclo = ((piano - 1) % 4) + 1;
      const bossInfo = pianoNelCiclo === 4
        ? BOSS_FINALE
        : statoRun.bossOrdine[(piano - 1) % statoRun.bossOrdine.length];
      const hpMax = Math.round((bossInfo.hpBase + (pianoNelCiclo - 1) * 45) * moltCiclo);
      s.nemici.push({
        id: `${s.id}-boss`,
        bossId: bossInfo.id,
        nome: ciclo > 1 ? `${bossInfo.nome} (Ciclo ${ciclo})` : bossInfo.nome,
        tipo: bossInfo.tipo,
        pattern: bossInfo.pattern,
        boss: true,
        x: 320,
        y: 162,
        vx: 1.35,
        vy: 1.05,
        airZ: 0,
        handSlamY: 0,
        state: 'idle',
        stateTimer: 45,
        hp: hpMax,
        maxHp: hpMax,
        speed: bossInfo.speed * moltVel,
        r: pianoNelCiclo === 4 ? 22 : 18,
        flash: 0,
        burnTicks: 0,
        stunTicks: 0,
        shootCd: 40,
        phaseTick: 0,
      });
    }
  }

  function avviaPiano(piano, mostraSipario = true) {
    statoRun.piano = piano;
    statoRun.ciclo = Math.floor((piano - 1) / 4) + 1;
    statoRun.dannoSubitoNelBoss = false;
    if ((piano - 1) % 4 === 0 && piano > 1) {
      statoRun.bossOrdine = shuffle(POOL_BOSS);
    }
    statoRun.mappa = generaMappaPiano(piano);
    const ing = statoRun.mappa.stanze.find((s) => s.tipo === 'ingresso');
    entraInStanza(ing, null);
    aggiornaBottoniPiano();
    if (mostraSipario) {
      statoRun.siparioAttivo = getRaccontoAtto(piano, statoRun.ciclo);
    }
  }

  function getCharCorrente() {
    return PERSONAGGI_GIOCABILI[statoRun.personaggioId] || PERSONAGGI_GIOCABILI.ferruccio;
  }

  function selezionaPersonaggio(charId) {
    if (!PERSONAGGI_GIOCABILI[charId]) return;
    statoRun.personaggioId = charId;
    for (const k of Object.keys(PERSONAGGI_GIOCABILI)) {
      const btn = document.getElementById(`btn-char-${k}`);
      if (btn) btn.classList.toggle('active', k === charId);
    }
  }

  function avviaPartitaConPersonaggio(charId) {
    if (charId) selezionaPersonaggio(charId);
    statoRun.fase = 'in_gioco';
    nuovaRun();
  }

  function nuovaRun() {
    runSeed = (Date.now() ^ Math.floor(performance.now() * 1000)) >>> 0;
    statoRun.fase = 'in_gioco';
    const pInfo = PERSONAGGI_GIOCABILI[statoRun.personaggioId] || PERSONAGGI_GIOCABILI.ferruccio;
    statoRun.numeroRun += 1;
    statoRun.bossOrdine = shuffle(POOL_BOSS);
    statoRun.poolOggettiBase = shuffle(CATALOGO_OGGETTI.filter((x) => x.tier === 'base'));
    statoRun.poolOggettiForti = shuffle(CATALOGO_OGGETTI.filter((x) => x.tier === 'forte'));
    statoRun.poolPatto = shuffle(CATALOGO_PATTO);
    statoRun.oggettiEquipaggiati = [];
    if (pInfo.passivoIniziale) {
      const initItem = CATALOGO_OGGETTI.find((x) => x.id === pInfo.passivoIniziale);
      if (initItem) statoRun.oggettiEquipaggiati.push({ ...initItem });
    }
    statoRun.oggettoAttivo = { ...(OGGETTI_ATTIVI[pInfo.attivoIniziale] || OGGETTI_ATTIVI.forbici) };
    statoRun.caricaAttivo = statoRun.oggettoAttivo.maxCarica;
    statoRun.scambioPendente = null;
    statoRun.monete = 0;
    statoRun.baseMaxHpHalf = pInfo.hpHalf;
    statoRun.maxHpHalf = pInfo.hpHalf;
    statoRun.hpHalf = pInfo.hpHalf;
    statoRun.baseDmgChar = pInfo.baseDmg;
    statoRun.baseSpdChar = pInfo.baseSpd;
    ricalcolaStatisticheIsaac();
    avviaPiano(1, true);
  }

  function entraInStanza(stanza, daLato) {
    statoRun.stanzaCorrente = stanza;
    if (stanza.tipo !== 'patto') stanza.visitata = true;
    statoRun.proiettili = [];
    statoRun.proiettiliNemici = [];
    statoRun.effettiSplash = [];
    statoRun.ondeEsplosione = [];
    statoRun.scambioPendente = null;
    player.targetX = null;
    player.targetY = null;
    if (daLato === 'N') { player.x = 320; player.y = ARENA.y1 + 18; }
    else if (daLato === 'S') { player.x = 320; player.y = ARENA.y2 - 18; }
    else if (daLato === 'W') { player.x = ARENA.x1 + 22; player.y = 188; }
    else if (daLato === 'E') { player.x = ARENA.x2 - 22; player.y = 188; }
    else { player.x = 260; player.y = 225; }

    if (stanza.tipo === 'tesoro' && stanza.oggettoPiedistallo && !stanza.oggettoPiedistallo.preso) {
      const o = stanza.oggettoPiedistallo;
      mostraBanner(`${o.forteGratis ? '★ OGGETTO FORTE GRATIS' : '🎁 OGGETTO GRATIS'}: ${o.nome} — ${o.statsDesc}`, 220);
    } else if (stanza.tipo === 'fucina') {
      mostraBanner('⚒ LA FUCINA DI MASTRO PEPPE: Risparmia i Grani (o cerca la Stanza Segreta ?) per le Reliquie da 15-18🪙!', 210);
    } else if (stanza.tipo === 'patto') {
      mostraBanner('😈 STANZA DEL PATTO D\'OMBRA: Cedi 1 ❤️ Maschera Massima per una Reliquia Proibita del Velo!', 230);
    } else if (stanza.tipo === 'segreta' && !stanza.pulita) {
      mostraBanner('🕵️ STANZA SEGRETA SCOPERTA! Sconfiggi i Predoni d\'Oro per raccogliere un bottino di monete!', 220);
    } else if (stanza.tipo === 'boss' && !stanza.pulita) {
      const b = stanza.nemici[0];
      const pianoNelCiclo = ((statoRun.piano - 1) % 4) + 1;
      mostraBanner(
        pianoNelCiclo === 4
          ? `♛ BOSS FINALE (${b.hp} HP): Le Mani di Marionetta scendono e diventano ${b.nome}!`
          : `💀 BOSS PIANO ${statoRun.piano} (${b.hp} HP): ${b.nome}!`,
        220
      );
    } else if (stanza.muroSegreto && !stanza.muroSegreto.aperto && stanza.pulita) {
      mostraBanner(`✨ C'è una Crepa Dorata sul muro ${stanza.muroSegreto.lato}! Spara o fai esplodere un Bozzo per aprire la Segreta!`, 180);
    }
  }

  function eseguiAttacco4Direzioni(dx, dy) {
    if (player.cooldown > 0 || statoRun.scambioPendente || statoRun.siparioAttivo) return;
    player.dirX = dx;
    player.dirY = dy;
    if (dx !== 0) player.flipX = dx < 0;

    if (statoRun.haSpada) {
      player.cooldown = Math.max(9, Math.round(statoRun.cooldownMax * 0.75));
      player.swordAnimTick = 0;
      player.swordAngle = Math.atan2(dy, dx);
      player.swordHitIds = new Set();
      if (statoRun.triplo || statoRun.tipoProiettile !== 'base' || statoRun.quadDir || statoRun.piercing) {
        sparaProiettiliDirezione(dx, dy, 0.65);
      }
    } else {
      player.cooldown = statoRun.cooldownMax;
      player.shootAnimTimer = 7;
      sparaProiettiliDirezione(dx, dy, 1.0);
    }
  }

  function sparaProiettiliDirezione(dx, dy, dmgScale = 1.0) {
    const baseAng = Math.atan2(dy, dx);
    const direzioniBase = statoRun.quadDir
      ? [0, Math.PI / 2, Math.PI, -Math.PI / 2]
      : [baseAng];

    for (const dirAng of direzioniBase) {
      const angoli = statoRun.triplo ? [-0.20, 0, 0.20] : [0];
      const offsets = statoRun.doppia && !statoRun.triplo ? [-4, 4] : [0];
      for (const da of angoli) {
        for (const off of offsets) {
          const a = dirAng + da;
          const perpX = -Math.sin(a) * off;
          const perpY = Math.cos(a) * off;
          statoRun.proiettili.push({
            x: player.x + Math.cos(a) * 10 + perpX,
            y: player.y - 6 + Math.sin(a) * 10 + perpY,
            vx: Math.cos(a) * 4.2,
            vy: Math.sin(a) * 4.2,
            dist: 0,
            maxDist: statoRun.range,
            dmg: statoRun.dmg * dmgScale,
            r: 4.5 * statoRun.projScale,
            tipo: statoRun.tipoProiettile,
            piercing: statoRun.piercing,
            overflowPierce: statoRun.overflowPierce,
            hitIds: new Set(),
          });
        }
      }
    }
  }

  function spawnaMonetaATerra(st, x, y, valore = 1) {
    if (!st) return;
    st.oggettiATerra.push({
      tipo: 'moneta',
      valore,
      sprite: valore >= 3 ? 'moneta3' : 'moneta1',
      x: Math.max(ARENA.x1 + 20, Math.min(ARENA.x2 - 20, x + (rng() - 0.5) * 22)),
      y: Math.max(ARENA.y1 + 20, Math.min(ARENA.y2 - 20, y + (rng() - 0.5) * 22)),
    });
  }

  // Esplosione stile Isaac per i Bozzi Esplosivi ('bomba_ferma' — Mulliboom/Boil):
  // danneggia i nemici vicini, spara 6 proiettili radiali, può colpire il giocatore e apre il Muro Segreto!
  function innescaEsplosioneBomba(st, bx, by) {
    if (!st) return;
    statoRun.scossa = 6;
    statoRun.ondeEsplosione.push({ x: bx, y: by, r: 6, maxR: 48, color: '#fb923c' });
    for (let k = 0; k < 6; k++) {
      const a = (TAU * k) / 6;
      statoRun.proiettiliNemici.push({
        x: bx, y: by - 6,
        vx: Math.cos(a) * 2.15, vy: Math.sin(a) * 2.15,
        dist: 0,
      });
    }
    if (st.muroSegreto && !st.muroSegreto.aperto) {
      const posMuro = { N: [320, ARENA.y1], S: [320, ARENA.y2], W: [ARENA.x1, 188], E: [ARENA.x2, 188] }[st.muroSegreto.lato];
      if (posMuro && Math.hypot(bx - posMuro[0], by - posMuro[1]) < 95) {
        apriMuroSegreto(st);
      }
    }
    for (const altro of st.nemici) {
      if (altro.hp > 0 && Math.hypot(altro.x - bx, altro.y - by) < 48) {
        altro.hp -= 12;
        altro.flash = 6;
      }
    }
    if (Math.hypot(player.x - bx, player.y - by) < 38 && player.invuln <= 0) {
      subisciColpoGiocatore(2, 'un Bozzo Esplosivo');
    }
  }

  function danneggiaNemico(nem, dmg, knockX, knockY) {
    // Se il Boss Re Gatto (Monstro) è in volo alto (airZ > 25), non può essere colpito finché non atterra!
    if (nem.boss && (nem.airZ || 0) > 25) return;

    // Maschera di Pulcinella (Isaac Host): quando è chiusa è corazzata e riduce l'85% del danno!
    if ((nem.patternMob || nem.tipo) === 'maschera' && !nem.maskOpen) {
      nem.flash = 3;
      nem.hp -= dmg * 0.12;
      return;
    }

    nem.hp -= dmg;
    nem.flash = 6;
    if (statoRun.burn) nem.burnTicks = 120;
    const isStun = (nem.patternMob || nem.tipo) === 'bomba_ferma' || (nem.patternMob || nem.tipo) === 'statua';
    const mult = nem.boss ? 1.5 : isStun ? 0.5 : 5.0;
    nem.x = Math.max(ARENA.x1 + 16, Math.min(ARENA.x2 - 16, nem.x + knockX * mult));
    nem.y = Math.max(ARENA.y1 + 16, Math.min(ARENA.y2 - 16, nem.y + knockY * mult));
    statoRun.scossa = 2.5;

    if (statoRun.chain && statoRun.stanzaCorrente) {
      for (const altro of statoRun.stanzaCorrente.nemici) {
        if (altro !== nem && altro.hp > 0 && Math.hypot(altro.x - nem.x, altro.y - nem.y) < 72) {
          altro.hp -= dmg * 0.45;
          altro.flash = 4;
          statoRun.scintilleFulmine.push({ x1: nem.x, y1: nem.y - 8, x2: altro.x, y2: altro.y - 8, tick: 6 });
        }
      }
    }

    if (nem.hp <= 0) {
      const st = statoRun.stanzaCorrente;
      // Se muore un Bozzo Esplosivo ('bomba_ferma'), esplode alla morte!
      if ((nem.patternMob || nem.tipo) === 'bomba_ferma' && !nem.exploded) {
        nem.exploded = true;
        innescaEsplosioneBomba(st, nem.x, nem.y);
      }
      // Drop garantiti per Campioni Colorati (Proposta 6), Mob della Stanza Segreta e Boss!
      if (nem.champion === 'cremisi' && st) {
        st.oggettiATerra.push({ tipo: 'cura', valore: 1, sprite: 'mezzaMaschera', x: nem.x, y: nem.y });
      } else if (nem.champion === 'elettrico' && st) {
        if (statoRun.oggettoAttivo) {
          statoRun.caricaAttivo = Math.min(statoRun.oggettoAttivo.maxCarica, statoRun.caricaAttivo + 1);
        }
        for (let k = 0; k < 4; k++) {
          const a = (k * Math.PI) / 2;
          statoRun.proiettiliNemici.push({ x: nem.x, y: nem.y - 6, vx: Math.cos(a) * 2.0, vy: Math.sin(a) * 2.0, dist: 0 });
        }
      }
      if ((nem.mobSoldi || nem.champion === 'dorato') && st) {
        spawnaMonetaATerra(st, nem.x, nem.y, rng() < 0.28 ? 3 : 1);
        if (rng() < 0.45) spawnaMonetaATerra(st, nem.x, nem.y, 1);
      } else if (nem.boss && st) {
        spawnaMonetaATerra(st, nem.x - 16, nem.y, 1);
        spawnaMonetaATerra(st, nem.x + 16, nem.y, rng() < 0.35 ? 3 : 1);
      }
      statoRun.effettiSplash.push({ x: nem.x, y: nem.y - 8, tick: 0 });
    }
    verificaStanzaPulita();
  }

  function verificaStanzaPulita() {
    const st = statoRun.stanzaCorrente;
    if (!st || st.pulita) return;
    if (st.nemici.every((n) => n.hp <= 0)) {
      st.pulita = true;
      // Ricarica di +1 tacca l'Oggetto Attivo [Q] a ogni stanza ripulita (Proposta 5: come in Isaac!)
      if (statoRun.oggettoAttivo) {
        statoRun.caricaAttivo = Math.min(statoRun.oggettoAttivo.maxCarica, statoRun.caricaAttivo + 1);
      }

      if (st.tipo === 'boss') {
        st.uscitaAperta = true;
        // Proposta 2: Apertura della Porta del Patto d'Ombra (100% se non hai subito danni nel boss, 60% altrimenti!)
        if (!statoRun.dannoSubitoNelBoss || rng() < 0.60) {
          st.portaPattoAperta = true;
        }
        const pianoNelCiclo = ((statoRun.piano - 1) % 4) + 1;
        if (pianoNelCiclo === 4) {
          mostraBanner(`★ DONNA LUCIANA SCONFITTA! Entra nella Botola per il LOOP INFINITO (Piano ${statoRun.piano + 1}) o nel Patto 😈!`, 320);
        } else {
          mostraBanner(`Boss sconfitto! ${st.portaPattoAperta ? 'È apparsa la PORTA DEL PATTO D\'OMBRA (😈) a destra + ' : ''}Botola aperta!`, 240);
        }
        return;
      }

      if (st.ricompensaOggetto && !st.oggettoPiedistallo) {
        st.oggettoPiedistallo = {
          ...st.ricompensaOggetto,
          x: 320,
          y: 192,
          preso: false,
        };
      }

      const rPick = rng();
      if (st.tipo === 'segreta') {
        spawnaMonetaATerra(st, 320, 165, 3);
      } else if (rPick < 0.25) {
        spawnaMonetaATerra(st, 320, 165, 1);
      } else if (rPick < 0.40 && statoRun.hpHalf < statoRun.maxHpHalf) {
        st.oggettiATerra.push({ tipo: 'cura', valore: 1, sprite: 'mezzaMaschera', x: 320, y: 165 });
      }

      if (st.oggettoPiedistallo) {
        const tag = st.oggettoPiedistallo.forteGratis ? '★ OGGETTO FORTE GRATIS (1 su 10)!' : '🎁 OGGETTO GRATIS (1 su 3)!';
        mostraBanner(`Stanza pulita! È apparso ${tag} → ${st.oggettoPiedistallo.nome} [Click/E]`, 220);
      } else if (st.muroSegreto && !st.muroSegreto.aperto) {
        mostraBanner(`Stanza pulita! ✨ Nota la Crepa Dorata sul muro ${st.muroSegreto.lato}: sparaci per la Stanza Segreta!`, 200);
      } else {
        mostraBanner(st.tipo === 'segreta' ? 'Stanza Segreta ripulita! Raccogli tutte le monete a terra!' : 'Stanza ripulita! (+1⚡ Carica Attivo [Q])', 130);
      }
    }
  }

  function interagisciStanza() {
    if (statoRun.scambioPendente || statoRun.siparioAttivo) return;
    const st = statoRun.stanzaCorrente;
    if (!st) return;

    if (st.pulita && st.muroSegreto && !st.muroSegreto.aperto) {
      apriMuroSegreto(st);
      return;
    }

    if (st.pulita && st.oggettoPiedistallo && !st.oggettoPiedistallo.preso) {
      const o = st.oggettoPiedistallo;
      if (Math.hypot(player.x - o.x, player.y - o.y) < 52) {
        acquisisciOggettoConLimite5Slot({ ...o }, 'piedistallo', o);
        return;
      }
    }

    if (st.tipo === 'patto') {
      for (const sl of st.slotPatto) {
        if (sl.comprato) continue;
        if (Math.hypot(player.x - sl.x, player.y - sl.y) < 44) {
          acquisisciOggettoConLimite5Slot({ ...sl.item }, 'patto', sl);
          return;
        }
      }
      if (Math.hypot(player.x - 320, player.y - 252) < 46) {
        const bossRoom = statoRun.mappa?.stanze.find((x) => x.tipo === 'boss');
        if (bossRoom) entraInStanza(bossRoom, null);
      }
      return;
    }

    if (st.tipo === 'fucina') {
      for (const sl of st.slotFucina) {
        if (sl.comprato) continue;
        if (Math.hypot(player.x - sl.x, player.y - sl.y) < 42) {
          if (statoRun.monete < sl.prezzo) {
            mostraBanner(`Grani insufficienti! Servono ${sl.prezzo}🪙 (hai ${statoRun.monete}🪙 — cerca la Stanza Segreta ? per fare soldi!).`, 160);
            return;
          }
          if (sl.tipo === 'cura') {
            if (statoRun.hpHalf >= statoRun.maxHpHalf) {
              mostraBanner('Hai già tutte le Maschere piene!', 100);
              return;
            }
            statoRun.monete -= sl.prezzo;
            sl.comprato = true;
            statoRun.hpHalf = Math.min(statoRun.maxHpHalf, statoRun.hpHalf + sl.curaHalf);
            mostraBanner(`Acquistato ne La Fucina: +${sl.curaHalf === 1 ? '½' : '1'} Maschera rigenerata!`, 130);
          } else {
            acquisisciOggettoConLimite5Slot({ ...sl.item }, 'fucina', sl);
          }
          return;
        }
      }
    } else if (st.tipo === 'boss') {
      if (st.portaPattoAperta && Math.hypot(player.x - 430, player.y - 190) < 42) {
        const stanzaPatto = statoRun.mappa?.stanze.find((x) => x.tipo === 'patto');
        if (stanzaPatto) entraInStanza(stanzaPatto, null);
        return;
      }
      if (st.uscitaAperta) {
        avviaPiano(statoRun.piano + 1, true);
      }
    }
  }

  function subisciColpoGiocatore(mezzeMaschereDanno, fonte) {
    if (player.invuln > 0) return;
    if (statoRun.stanzaCorrente?.tipo === 'boss') statoRun.dannoSubitoNelBoss = true;
    statoRun.hpHalf = Math.max(0, statoRun.hpHalf - mezzeMaschereDanno);
    player.invuln = 52;
    statoRun.scossa = 5;
    if (statoRun.hpHalf <= 0) {
      mostraBanner(`Le tue maschere si sono spezzate contro ${fonte}... Nuova Run al Piano 1!`, 200);
      nuovaRun();
    }
  }

  // ===========================================================================
  // PAVIMENTO E STANZA PIXEL-ART
  // ===========================================================================
  let floorCache = null;
  function getFloorTileCanvas() {
    if (floorCache) return floorCache;
    floorCache = document.createElement('canvas');
    floorCache.width = W;
    floorCache.height = H;
    const x = floorCache.getContext('2d');
    x.imageSmoothingEnabled = false;

    x.fillStyle = '#0c0806';
    x.fillRect(0, 0, W, H);

    x.fillStyle = '#241811';
    x.fillRect(48, 52, W - 96, H - 96);
    x.strokeStyle = '#0a0604';
    x.lineWidth = 2;
    x.strokeRect(48, 52, W - 96, H - 96);

    for (let bx = 52; bx < W - 52; bx += 24) {
      x.fillStyle = '#332218';
      x.fillRect(bx, 56, 20, 12);
      x.fillRect(bx, H - 60, 20, 12);
    }
    for (let by = 68; by < H - 64; by += 20) {
      x.fillStyle = '#332218';
      x.fillRect(52, by, 12, 16);
      x.fillRect(W - 64, by, 12, 16);
    }

    const tileColors = ['#3d2b1f', '#38261b', '#433022', '#352318'];
    let seed = 1337;
    const nextR = () => { seed = (seed * 1664525 + 1013904223) >>> 0; return (seed >>> 16) / 65536; };

    for (let ty = 70; ty < 304; ty += 16) {
      for (let tx = 68; tx < 572; tx += 16) {
        const c = tileColors[Math.floor(nextR() * tileColors.length)];
        x.fillStyle = c;
        x.fillRect(tx, ty, 16, 16);
        x.fillStyle = '#281a11';
        x.fillRect(tx, ty + 15, 16, 1);
        x.fillRect(tx + 15, ty, 1, 16);
        if (nextR() < 0.28) {
          x.fillStyle = '#523b2b';
          x.fillRect(tx + 4, ty + 4, 2, 2);
        }
        if (nextR() < 0.16) {
          x.fillStyle = '#22150d';
          x.fillRect(tx + 9, ty + 8, 3, 1);
          x.fillRect(tx + 10, ty + 9, 1, 2);
        }
      }
    }

    x.strokeStyle = '#0a0604';
    x.lineWidth = 2;
    x.strokeRect(68, 70, 504, 234);
    return floorCache;
  }

  function disegnaStanzaPixelArt(tick, st) {
    ctx.drawImage(getFloorTileCanvas(), 0, 0);

    if (st.tipo === 'tesoro' || st.tipo === 'fucina' || st.tipo === 'boss' || st.tipo === 'segreta' || st.tipo === 'patto') {
      ctx.fillStyle = st.tipo === 'tesoro'
        ? '#5c4214'
        : st.tipo === 'fucina'
          ? '#472112'
          : st.tipo === 'segreta'
            ? '#2d193c'
            : st.tipo === 'patto'
              ? '#240812'
              : '#4a1210';
      const rx = (st.tipo === 'fucina' || st.tipo === 'patto') ? 126 : 210;
      const rw = (st.tipo === 'fucina' || st.tipo === 'patto') ? 388 : 220;
      ctx.fillRect(rx, 130, rw, 114);
      ctx.strokeStyle = st.tipo === 'segreta' ? '#c084fc' : st.tipo === 'patto' ? '#ef4444' : '#f9cb40';
      ctx.lineWidth = 2;
      ctx.strokeRect(rx + 2, 132, rw - 4, 110);
    }

    const brFrame = Math.floor(tick / 8) % 2 === 0 ? SPRITE_SCENA.braciere0 : SPRITE_SCENA.braciere1;
    for (const tx of [150, 490]) {
      drawPixelSprite(brFrame, tx, 62, 1.5);
    }

    const chiuse = !st.pulita;
    const porte = {
      N: { x: 320, y: 61, w: 36, h: 18 },
      S: { x: 320, y: 313, w: 36, h: 18 },
      W: { x: 59, y: 187, w: 18, h: 36 },
      E: { x: 581, y: 187, w: 18, h: 36 },
    };

    if (st.muroSegreto && !st.muroSegreto.aperto) {
      const p = porte[st.muroSegreto.lato];
      if (p) {
        const pulse = 0.55 + 0.45 * Math.sin(tick * 0.14);
        ctx.save();
        ctx.strokeStyle = `rgba(249, 203, 64, ${pulse.toFixed(2)})`;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(p.x - 8, p.y - 6);
        ctx.lineTo(p.x - 2, p.y);
        ctx.lineTo(p.x + 5, p.y - 4);
        ctx.lineTo(p.x + 2, p.y + 5);
        ctx.lineTo(p.x + 9, p.y + 8);
        ctx.stroke();
        if (st.pulita) {
          const lx = st.muroSegreto.lato === 'W' ? p.x + 48 : st.muroSegreto.lato === 'E' ? p.x - 48 : p.x;
          const ly = st.muroSegreto.lato === 'N' ? p.y + 22 : st.muroSegreto.lato === 'S' ? p.y - 12 : p.y - 12;
          drawPillLabel('? CREPA [Spara/E]', lx, ly, 108, { size: 7.5, color: '#f9cb40', border: '#f9cb40' });
        }
        ctx.restore();
      }
    }

    for (const [lato, idDest] of Object.entries(st.porte)) {
      const dest = statoRun.mappa.perId.get(idDest);
      const p = porte[lato];
      const colCornice = dest?.tipo === 'tesoro'
        ? '#f9cb40'
        : dest?.tipo === 'fucina'
          ? '#ea8626'
          : dest?.tipo === 'boss'
            ? '#e53222'
            : dest?.tipo === 'segreta'
              ? '#c084fc'
              : '#9ca3af';

      ctx.fillStyle = '#0a0604';
      ctx.fillRect(p.x - p.w / 2 - 2, p.y - p.h / 2 - 2, p.w + 4, p.h + 4);
      ctx.fillStyle = colCornice;
      ctx.fillRect(p.x - p.w / 2, p.y - p.h / 2, p.w, p.h);
      ctx.fillStyle = chiuse ? '#571b14' : '#090604';
      ctx.fillRect(p.x - p.w / 2 + 3, p.y - p.h / 2 + 3, p.w - 6, p.h - 6);

      if (chiuse) {
        ctx.fillStyle = '#cbd5e1';
        ctx.fillRect(p.x - 6, p.y - p.h / 2 + 3, 2, p.h - 6);
        ctx.fillRect(p.x + 4, p.y - p.h / 2 + 3, 2, p.h - 6);
      } else if (dest) {
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 9px ui-monospace, monospace';
        ctx.textAlign = 'center';
        const tag = dest.tipo === 'tesoro'
          ? '★'
          : dest.tipo === 'fucina'
            ? '⚒'
            : dest.tipo === 'boss'
              ? '💀'
              : dest.tipo === 'segreta'
                ? '?'
                : '';
        if (tag) ctx.fillText(tag, p.x, p.y + 3);
      }
    }
  }
